<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f111c">
<meta name="description" content="如果生活是一场 RPG，你的隐藏职业与天赋面板 · 24场现实副本遭遇战，解锁16种隐藏职业、四维属性条、神级被动与致命Debuff，含3:4冒险者公会角色卡海报。">
<title>如果生活是一场 RPG，你的隐藏职业与天赋面板 · LIFE RPG GUILD</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0e101b;--panel:#151828;--panel2:#1d2136;--ink:#f4f0e8;--muted:#b2aec4;
  --gold:#f0c46c;--gold-soft:rgba(240,196,108,.15);--violet:#8f7ef2;--cyan:#55c9d6;
  --crimson:#ef6868;--emerald:#5fd19a;--line:rgba(240,196,108,.26);--line-dim:rgba(255,255,255,.10);
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --mono:"SF Mono","Menlo","Monaco","Consolas",monospace;
  --sans:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.68;-webkit-tap-highlight-color:transparent;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:
  radial-gradient(ellipse at 50% -12%,rgba(143,126,242,.22),transparent 55%),
  radial-gradient(ellipse at 92% 100%,rgba(240,196,108,.13),transparent 46%);z-index:-1}
main{width:min(100%,660px);padding:18px 16px max(34px,env(safe-area-inset-bottom));margin:auto}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 16px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--mono);font-size:11px;letter-spacing:2.2px;font-weight:800;color:var(--gold);display:flex;align-items:center;gap:7px}
.brand::before{content:"⚔";font-size:13px;color:var(--gold)}
.issue{font-family:var(--mono);font-size:10.5px;color:var(--muted);white-space:nowrap;letter-spacing:.08em}
section.panel{border:1px solid var(--line);border-radius:22px;background:linear-gradient(180deg,var(--panel),#111320);padding:clamp(18px,4.2vw,30px);box-shadow:0 26px 64px rgba(0,0,0,.52);overflow:hidden;animation:enter .28s cubic-bezier(.22,1,.36,1)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1,h2,h3,p{margin:0}
h1{font-family:var(--serif);font-size:clamp(27px,7vw,40px);font-weight:800;line-height:1.28;letter-spacing:.02em;color:#fff}
h2{font-family:var(--serif);font-size:clamp(20px,5vw,25px);line-height:1.5;font-weight:700;color:#fff}
h3{font-family:var(--serif);font-size:17px;margin-bottom:9px;font-weight:700;color:#fff}
.eyebrow{font-family:var(--mono);color:var(--gold);font-size:10.5px;letter-spacing:2px;font-weight:800;margin:16px 0 7px;text-transform:uppercase}
.lead{font-size:14.5px;line-height:1.86;margin:12px 0 18px;color:var(--muted)}
.muted{font-size:12px;color:var(--muted)}
/* RPG Guild Hero */
.hero{position:relative;isolation:isolate;height:clamp(198px,48vw,252px);background:#101222;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.hero svg{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,16,27,.06) 0%,rgba(14,16,27,.72) 100%);z-index:-1}
.hero-badge{position:absolute;top:14px;right:14px;padding:4px 11px;border-radius:99px;border:1px solid rgba(240,196,108,.56);background:rgba(15,17,28,.68);backdrop-filter:blur(6px);font-family:var(--mono);font-size:10px;letter-spacing:1.4px;font-weight:800;color:var(--gold)}
.hero-copy{position:absolute;bottom:16px;left:18px;right:16px}
.hero-copy small{font-family:var(--mono);font-size:10px;letter-spacing:2.6px;color:var(--gold);display:block;margin-bottom:3px}
.hero-copy strong{display:block;font-family:var(--serif);font-size:clamp(24px,6vw,34px);letter-spacing:2.5px;line-height:1.25;color:#fff}
.pills{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 20px}
.pill{font-size:12px;padding:5px 12px;border:1px solid var(--line-dim);border-radius:99px;background:rgba(255,255,255,.04);color:var(--muted);font-weight:600}
.pill.gold{border-color:rgba(240,196,108,.48);background:var(--gold-soft);color:var(--gold);font-weight:700}
.teaser-wrap{margin:22px 0 20px;padding-top:16px;border-top:1px dashed var(--line)}
.teaser-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.teaser-head span{font-family:var(--mono);font-size:11px;letter-spacing:1.4px;color:var(--gold);font-weight:800}
.teaser-head small{font-size:11px;color:var(--muted)}
.teasers{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.teaser{padding:12px 10px;border-radius:12px;background:var(--panel2);border:1px solid var(--line-dim);display:flex;flex-direction:column;gap:4px}
.teaser-rank{font-family:var(--mono);font-size:9.5px;font-weight:800;letter-spacing:.06em}
.teaser b{font-family:var(--serif);font-size:13.5px;color:#fff;line-height:1.35}
.teaser small{font-size:11px;color:var(--muted);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:var(--panel2);border:1px solid var(--line-dim);border-radius:13px;padding:13px 16px;min-height:48px;touch-action:manipulation;transition:transform .12s,border-color .18s,background .18s,box-shadow .18s}
button:active:not(:disabled){transform:scale(.988)}
button:focus-visible{outline:2.5px solid var(--gold);outline-offset:3px}
button:hover:not(:disabled){border-color:var(--gold)}
button:disabled{opacity:.36;cursor:not-allowed}
.primary{background:linear-gradient(135deg,#f5cf7f,#d49c3d);color:#19140d;border-color:transparent;font-weight:850;width:100%;text-align:center;box-shadow:0 8px 24px rgba(240,196,108,.24)}
.primary:hover:not(:disabled){filter:brightness(1.06)}
.secondary{width:100%;text-align:center;background:rgba(255,255,255,.04);border-color:var(--line);font-weight:700}
.subtle{background:transparent;border:0;text-align:center;color:var(--muted);font-size:12px;padding:8px;min-height:36px}
.subtle:hover{color:var(--gold)}
.stack{display:grid;gap:10px}
.actions-row{display:grid;grid-template-columns:1.25fr 1fr;gap:10px}
.notice{font-size:12px;color:var(--muted);line-height:1.72;margin-top:14px}
/* Quiz */
.question-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;color:var(--gold);font-weight:800}
.auto-toggle{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;border:1px solid var(--line-dim);background:rgba(255,255,255,.04);color:var(--muted);font-family:var(--sans);font-size:11px;font-weight:700;min-height:28px}
.auto-toggle.on{border-color:rgba(240,196,108,.55);color:var(--gold);background:var(--gold-soft)}
.progress{height:6px;background:rgba(255,255,255,.08);overflow:hidden;border-radius:12px;margin:11px 0 18px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--gold));border-radius:12px;transition:width .28s cubic-bezier(.22,1,.36,1)}
.chapter-bar{display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:12px;background:rgba(143,126,242,.09);border:1px solid rgba(143,126,242,.26);border-left:3.5px solid var(--gold);margin-bottom:20px}
.chapter-bar strong{display:block;font-family:var(--mono);font-size:12.5px;color:var(--gold)}
.chapter-bar span{display:block;font-size:11.5px;color:var(--muted);line-height:1.45}
.options{display:grid;gap:10px;margin:20px 0 22px}
.option{display:flex;text-align:left;align-items:center;gap:12px;min-height:60px;width:100%;padding:13px 14px;line-height:1.55;background:var(--panel2);color:var(--ink)}
.option .letter{display:grid;place-items:center;flex:0 0 29px;height:29px;border-radius:8px;background:rgba(255,255,255,.05);color:var(--gold);font-family:var(--mono);font-weight:800;font-size:12px;border:1px solid var(--line);transition:all .16s}
.option.selected{border-color:var(--gold);background:rgba(240,196,108,.14);box-shadow:0 6px 20px rgba(240,196,108,.12)}
.option.selected .letter{background:var(--gold);color:#19140d;border-color:var(--gold)}
.option .check{margin-left:auto;color:var(--gold);font-weight:800;font-size:15px}
.nav{display:grid;grid-template-columns:1fr 1.6fr;gap:10px}
/* Magic Circle Awakening Ritual */
.calc-box{text-align:center;padding:38px 10px 30px}
.rune-circle{width:84px;height:84px;margin:0 auto 22px;position:relative;display:grid;place-items:center}
.rune-outer{position:absolute;inset:0;border-radius:50%;border:2px dashed var(--gold);animation:spin 5s linear infinite}
.rune-inner{position:absolute;inset:12px;border:2px solid var(--violet);transform:rotate(45deg);animation:spin-rev 2.4s linear infinite;box-shadow:0 0 20px rgba(143,126,242,.35)}
.rune-core{color:var(--gold);font-size:22px;z-index:1}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spin-rev{to{transform:rotate(-315deg)}}
.calc-step{font-family:var(--serif);font-size:18.5px;color:#fff;margin-bottom:8px;min-height:1.6em}
.calc-sub{font-size:12px;color:var(--muted)}
/* Result Character Sheet Header */
.char-card{border:1.5px solid color-mix(in srgb,var(--cls-color,var(--gold)) 52%,rgba(255,255,255,.15));border-radius:20px;overflow:hidden;background:radial-gradient(ellipse at 20% 0%,color-mix(in srgb,var(--cls-color,var(--violet)) 26%,transparent),transparent 58%),linear-gradient(165deg,var(--cls-deep,#1d2136),#10121e)}
.char-top-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.08);font-family:var(--mono);font-size:10.5px;letter-spacing:1.2px;color:var(--cls-color,var(--gold))}
.rank-badge{padding:3px 10px;border-radius:6px;background:color-mix(in srgb,var(--cls-color,var(--gold)) 22%,transparent);border:1px solid var(--cls-color,var(--gold));font-weight:900;color:#fff}
.char-main{display:grid;grid-template-columns:126px 1fr;gap:16px;padding:18px 18px 14px;align-items:center}
.crest-frame{width:126px;height:126px;border-radius:18px;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--cls-color,var(--gold)) 25%,transparent),rgba(10,12,22,.8));border:1.5px solid color-mix(in srgb,var(--cls-color,var(--gold)) 58%,transparent);display:grid;place-items:center;box-shadow:0 12px 28px rgba(0,0,0,.45)}
.crest-frame svg{width:92px;height:92px;display:block}
.char-role{font-family:var(--mono);font-size:11px;letter-spacing:1.2px;color:var(--cls-color,var(--gold));font-weight:700;margin-bottom:4px}
.char-name{font-family:var(--serif);font-size:clamp(24px,6.2vw,34px);font-weight:800;line-height:1.26;color:#fff;margin-bottom:8px}
.char-meta-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:8px}
.lv-chip{font-family:var(--mono);font-size:11px;font-weight:800;padding:3px 9px;border-radius:5px;background:var(--cls-color,var(--gold));color:#12131d}
.fit-chip{font-family:var(--mono);font-size:11px;font-weight:700;padding:3px 9px;border-radius:5px;background:rgba(255,255,255,.08);color:#e9e4db;border:1px solid rgba(255,255,255,.14)}
/* RPG 4-Stat Bars inside character card */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;padding:14px 18px 16px;border-top:1px solid rgba(255,255,255,.08);background:rgba(8,10,18,.42)}
.stat-item-head{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:11.5px;margin-bottom:5px}
.stat-item-head span{color:#e2deeb;font-weight:700}
.stat-item-head strong{color:var(--bar-c,var(--gold));font-size:13px;font-weight:900}
.stat-bar{height:7px;border-radius:99px;background:rgba(255,255,255,.10);overflow:hidden}
.stat-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,color-mix(in srgb,var(--bar-c,var(--gold)) 65%,#fff),var(--bar-c,var(--gold)))}
.quote-strip{padding:12px 18px 15px;border-top:1px solid rgba(255,255,255,.08);font-family:var(--serif);font-size:15.5px;color:var(--cls-color,var(--gold));line-height:1.65;text-align:center}
/* Content Blocks */
.block{padding:21px 0;border-bottom:1px solid var(--line-dim)}
.block:last-of-type{border:0;padding-bottom:10px}
.block p{font-size:14.5px;line-height:1.88;color:#dcd7e6}
.kicker{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--gold);font-weight:800;margin-bottom:5px;text-transform:uppercase}
/* Passive Skill & Debuff Cards */
.skill-card{margin-top:12px;padding:14px 15px;border-radius:13px;background:rgba(95,209,154,.10);border:1.5px solid rgba(95,209,154,.38)}
.skill-card b{display:block;font-family:var(--mono);font-size:12px;color:var(--emerald);margin-bottom:5px;letter-spacing:.04em}
.skill-card p{font-size:13.5px;line-height:1.78;color:#e6f6ee}
.debuff-card{margin-top:11px;padding:14px 15px;border-radius:13px;background:rgba(239,104,104,.11);border:1.5px solid rgba(239,104,104,.42)}
.debuff-card b{display:block;font-family:var(--mono);font-size:12px;color:#ff8a8a;margin-bottom:5px;letter-spacing:.04em}
.debuff-card p{font-size:13.5px;line-height:1.78;color:#fae4e4}
/* Axis Meter */
.axis{margin:14px 0}
.axis-head,.axis-labels{display:flex;justify-content:space-between;gap:10px;font-size:12px}
.axis-head strong{font-size:13px;color:#fff}
.axis-head span{font-family:var(--mono);color:var(--cls-color,var(--gold));font-weight:700}
.axis-labels{color:var(--muted);font-size:11.5px}
.track{position:relative;height:8px;border-radius:9px;background:rgba(255,255,255,.08);margin:7px 0}
.track::before{content:"";position:absolute;left:50%;width:1px;height:8px;background:rgba(255,255,255,.2)}
.track i{position:absolute;width:15px;height:15px;top:-3.5px;border-radius:50%;background:var(--cls-color,var(--gold));border:2.5px solid var(--panel);box-shadow:0 0 0 1.5px var(--cls-color,var(--gold));transform:translateX(-50%)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.mini{padding:14px;border-radius:13px;background:var(--panel2);border:1px solid var(--line-dim)}
.mini b{display:block;font-family:var(--mono);color:var(--cls-color,var(--gold));font-size:11px;margin-bottom:5px}
.mini .partner-name{font-family:var(--serif);font-size:15.5px;font-weight:800;color:#fff;margin-bottom:5px;line-height:1.38}
.mini p{font-size:13px;line-height:1.68;color:var(--muted)}
.rank{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-dim);font-size:14px}
.rank:last-child{border:0}
.rank-left{display:flex;align-items:center;gap:10px}
.swatch{width:12px;height:12px;border-radius:3px;border:1px solid rgba(255,255,255,.3);flex:none}
.rank small{display:block;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.rank .pct{font-family:var(--mono);font-size:11.5px;font-weight:800;color:var(--gold);background:var(--gold-soft);padding:3px 9px;border-radius:99px}
.status-bar{font-family:var(--mono);font-size:12px;color:var(--gold);text-align:center;min-height:1.4em;margin:4px 0 6px;font-weight:700}
.footer{text-align:center;margin:20px 0 0;font-size:11px;color:var(--muted);line-height:1.8}
.poster{width:100%;max-width:360px;margin:10px auto;border-radius:12px;display:block;border:1px solid var(--line);box-shadow:0 14px 36px rgba(0,0,0,.55)}
dialog{width:min(calc(100% - 26px),460px);max-height:90dvh;overflow:auto;border:1.5px solid var(--line);border-radius:20px;padding:20px;background:var(--panel);color:var(--ink);box-shadow:0 26px 70px rgba(0,0,0,.75)}
dialog::backdrop{background:rgba(7,8,15,.8);backdrop-filter:blur(4px)}
.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.dialog-head button{min-height:36px;padding:4px 13px;font-size:13px}
.copy-area{width:100%;min-height:160px;border-radius:10px;border:1px solid var(--line);background:#10121e;color:var(--ink);padding:12px;font:inherit;font-size:13px;line-height:1.7;margin:10px 0}
@media(max-width:480px){
  main{padding:14px 12px 28px}
  .char-main{grid-template-columns:1fr;text-align:center}
  .crest-frame{margin:0 auto}
  .char-meta-row,.char-main .pills{justify-content:center}
  .teasers,.duo,.actions-row,.stat-grid{grid-template-columns:1fr}
  .option{font-size:14px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <header>
    <span class="brand">LIFE RPG GUILD</span>
    <span class="issue">QUEST 05 · 隐藏职业觉醒</span>
  </header>
  <div id="app"></div>
  <footer class="footer">LIFE RPG GUILD · 原创游戏化趣味人格测试，非专业心理测评<br>无需登录 · 所有冒险数据仅保存在你的本地浏览器</footer>
</main>

<dialog id="posterDialog" aria-labelledby="posterTitle">
  <div class="dialog-head">
    <h3 id="posterTitle">你的 3:4 RPG 角色属性卡海报</h3>
    <button id="closePoster" type="button">关闭</button>
  </div>
  <p class="muted">1080 × 1440 冒险者公会限定卡 · 手机长按图片保存，电脑点击下方下载。</p>
  <div id="posterArea"></div>
  <div class="stack" style="margin-top:12px">
    <button class="primary" id="downloadPoster">下载高清 PNG 角色面板</button>
  </div>
  <p class="status-bar" id="posterStatus" role="status"></p>
</dialog>

<dialog id="copyDialog" aria-labelledby="copyTitle">
  <div class="dialog-head">
    <h3 id="copyTitle">复制小红书组队文案</h3>
    <button id="closeCopy" type="button">关闭</button>
  </div>
  <p class="muted">长按或全选下方文案复制，搭配角色属性卡发笔记，评论区超容易引发摇人组队。</p>
  <textarea id="copyTextarea" class="copy-area" readonly></textarea>
  <button class="primary" id="selectCopyBtn" type="button">全选文案</button>

function compute(input){
  if(input.length!==N||input.some(v=>!Number.isInteger(v)||v<0||v>3)) throw Error('Incomplete answers');
  const sums=D.axes.map(()=>0), cnts=D.axes.map(()=>0);
  const wSums=D.axes.map(()=>0), wCnts=D.axes.map(()=>0);
  D.questions.forEach((q,i)=>{
    const sc=q.options[input[i]].score;
    sums[q.axis]+=sc; cnts[q.axis]++;
    const w=1+i*0.012;
    wSums[q.axis]+=sc*w; wCnts[q.axis]+=w;
  });
  const v=sums.map((s,i)=>s/cnts[i]);
  const vw=wSums.map((s,i)=>s/wCnts[i]);
  const ranked=D.profiles.map((p,i)=>{
    const center=p.vector.map(x=>x-1.5);
    const norm=Math.hypot(...center)||1;
    const radius=Math.sqrt(vw.length)*0.52+0.12*(norm-Math.sqrt(vw.length));
    const cal=center.map(x=>1.5+x*radius/norm);
    const d=cal.reduce((s,x,j)=>s+(x-vw[j])**2,0);
    const rawSim=Math.max(0,1-Math.sqrt(d/(4.2*vw.length)));
    const fit=Math.round(Math.max(68,Math.min(98,68+rawSim*30)));
    return {p,i,d,fit};
  });
  ranked.sort((a,b)=>a.d-b.d||a.i-b.i);
  for(let k=1;k<Math.min(4,ranked.length);k++){
    if(ranked[k].fit>=ranked[k-1].fit) ranked[k].fit=Math.max(62,ranked[k-1].fit-2);
  }
  // Personalized RPG 4-Stat Panel (1..99)
  const clamp=(x,lo,hi)=>Math.max(lo,Math.min(hi,Math.round(x)));
  const stats = [
    {key:'INT', name:'理性值', val:clamp(36 + ((3-v[2])*0.72 + (3-v[0])*0.28)/3*63, 36, 99), color:'#55c9d6'},
    {key:'CHA', name:'共情值', val:clamp(36 + (v[2]*0.68 + v[1]*0.32)/3*63, 36, 99), color:'#f598b5'},
    {key:'ATK', name:'行动力', val:clamp(35 + (v[0]*0.66 + v[3]*0.34)/3*64, 35, 99), color:'#f0c46c'},
    {key:'RES', name:'摸鱼抗性', val:clamp(18 + (v[3]*0.78 + v[0]*0.22)/3*81, 18, 99), color:'#5fd19a'}
  ];
  const lv = clamp(42 + Math.round((stats[0].val+stats[1].val+stats[2].val+stats[3].val)/8), 50, 99);
  return {v,ranked,p:ranked[0].p,stats,lv};
}

function wrap(ctx,text,max){
  const out=[];let line='';
  for(const ch of text){
    if(line&&ctx.measureText(line+ch).width>max){out.push(line);line=ch;}
    else line+=ch;
  }
  if(line) out.push(line);
  return out;
}
function rPath(ctx,x,y,w,h,r){
  ctx.beginPath();
  if(typeof ctx.roundRect==='function') ctx.roundRect(x,y,w,h,r);
  else{r=Math.min(r,w/2,h/2);ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
}
function fillR(ctx,x,y,w,h,r){rPath(ctx,x,y,w,h,r);ctx.fill();}
function strokeR(ctx,x,y,w,h,r){rPath(ctx,x,y,w,h,r);ctx.stroke();}

function drawCanvasCrest(ctx, cx, cy, scale, p){
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(scale, scale);
  const c = p.color;
  // Outer arcane ring
  ctx.save();ctx.setLineDash([5,5]);ctx.strokeStyle=c;ctx.globalAlpha=0.38;ctx.lineWidth=1.8;
  ctx.beginPath();ctx.arc(0,0,58,0,Math.PI*2);ctx.stroke();ctx.restore();

  ctx.strokeStyle=c;ctx.fillStyle=c;ctx.lineWidth=3.8;ctx.lineCap='round';ctx.lineJoin='round';
  if(p.crest==='flask'){
    ctx.beginPath();ctx.moveTo(-14,-40);ctx.lineTo(14,-40);ctx.moveTo(-7,-40);ctx.lineTo(-7,-18);
    ctx.lineTo(-30,24);ctx.quadraticCurveTo(-34,36,-20,38);ctx.lineTo(20,38);ctx.quadraticCurveTo(34,36,30,24);
    ctx.lineTo(7,-18);ctx.lineTo(7,-40);ctx.stroke();
    ctx.globalAlpha=0.32;ctx.beginPath();ctx.moveTo(-21,10);ctx.lineTo(21,10);ctx.lineTo(28,25);ctx.quadraticCurveTo(30,34,18,36);ctx.lineTo(-18,36);ctx.quadraticCurveTo(-30,34,-28,25);ctx.closePath();ctx.fill();
    ctx.globalAlpha=1;ctx.beginPath();ctx.arc(-8,22,4,0,Math.PI*2);ctx.arc(9,4,3,0,Math.PI*2);ctx.fill();
  } else if(p.crest==='book'){
    ctx.globalAlpha=0.22;ctx.beginPath();ctx.moveTo(-36,-30);ctx.quadraticCurveTo(-18,-38,0,-28);ctx.quadraticCurveTo(18,-38,36,-30);ctx.lineTo(36,30);ctx.quadraticCurveTo(18,22,0,32);ctx.quadraticCurveTo(-18,22,-36,30);ctx.closePath();ctx.fill();
    ctx.globalAlpha=1;ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,-28);ctx.lineTo(0,32);ctx.stroke();
    ctx.fillStyle='#131626';ctx.beginPath();ctx.arc(0,0,14,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.fillStyle=c;ctx.beginPath();ctx.arc(0,0,5,0,Math.PI*2);ctx.fill();
  } else if(p.crest==='leaf'){
    ctx.globalAlpha=0.25;ctx.beginPath();ctx.moveTo(-30,34);ctx.quadraticCurveTo(-24,-24,34,-34);ctx.quadraticCurveTo(26,24,-30,34);ctx.closePath();ctx.fill();
    ctx.globalAlpha=1;ctx.stroke();
    ctx.beginPath();ctx.moveTo(-30,34);ctx.quadraticCurveTo(-2,4,28,-28);ctx.stroke();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(34,-34,4.5,0,Math.PI*2);ctx.fill();
  } else if(p.crest==='staff'){
    ctx.beginPath();ctx.moveTo(-30,38);ctx.lineTo(20,-20);ctx.stroke();
    ctx.beginPath();
    const pts=[[22,-44],[28,-28],[44,-22],[28,-16],[22,0],[16,-16],[0,-22],[16,-28]];
    pts.forEach((pt,i)=>i?ctx.lineTo(pt[0],pt[1]):ctx.moveTo(pt[0],pt[1]));
    ctx.closePath();ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.8;ctx.stroke();
  } else if(p.crest==='lute'){
    ctx.save();ctx.translate(-10,14);ctx.rotate(-0.6);ctx.globalAlpha=0.25;ctx.beginPath();ctx.ellipse(0,0,24,27,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.stroke();ctx.restore();
    ctx.beginPath();ctx.moveTo(6,-4);ctx.lineTo(36,-36);ctx.lineWidth=5;ctx.stroke();
    ctx.fillStyle='#131626';ctx.lineWidth=2.6;ctx.beginPath();ctx.arc(-10,14,7.5,0,Math.PI*2);ctx.fill();ctx.stroke();
  } else if(p.crest==='dagger'){
    ctx.globalAlpha=0.35;ctx.beginPath();ctx.moveTo(32,-38);ctx.lineTo(22,-8);ctx.lineTo(-8,18);ctx.lineTo(-18,8);ctx.lineTo(8,-22);ctx.closePath();ctx.fill();
    ctx.globalAlpha=1;ctx.stroke();
    ctx.beginPath();ctx.moveTo(-26,-2);ctx.lineTo(4,26);ctx.moveTo(-14,14);ctx.lineTo(-32,34);ctx.lineWidth=5;ctx.stroke();
  } else if(p.crest==='sword'){
    ctx.globalAlpha=0.32;ctx.beginPath();ctx.moveTo(0,-46);ctx.lineTo(10,-28);ctx.lineTo(10,14);ctx.lineTo(-10,14);ctx.lineTo(-10,-28);ctx.closePath();ctx.fill();
    ctx.globalAlpha=1;ctx.stroke();
    fillR(ctx,-24,14,48,9,4);fillR(ctx,-5,23,10,19,3);
    ctx.beginPath();ctx.arc(0,46,6,0,Math.PI*2);ctx.fill();
  } else if(p.crest==='bow'){
    ctx.beginPath();ctx.moveTo(-20,-38);ctx.quadraticCurveTo(30,0,-20,38);ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-20,-36);ctx.lineTo(-20,36);ctx.stroke();
    ctx.strokeStyle=c;ctx.lineWidth=3.6;ctx.beginPath();ctx.moveTo(-36,0);ctx.lineTo(34,0);ctx.stroke();
    ctx.beginPath();ctx.moveTo(40,0);ctx.lineTo(26,-9);ctx.lineTo(26,9);ctx.closePath();ctx.fill();
  } else if(p.crest==='shield'){
    ctx.globalAlpha=0.24;ctx.beginPath();ctx.moveTo(0,-42);ctx.lineTo(34,-30);ctx.lineTo(34,0);ctx.bezierCurveTo(34,24,16,36,0,46);ctx.bezierCurveTo(-16,36,-34,24,-34,0);ctx.lineTo(-34,-30);ctx.closePath();ctx.fill();
    ctx.globalAlpha=1;ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,-28);ctx.lineTo(0,30);ctx.moveTo(-20,-4);ctx.lineTo(20,-4);ctx.stroke();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,-4,6,0,Math.PI*2);ctx.fill();
  } else {
    // crown
    ctx.globalAlpha=0.28;ctx.beginPath();ctx.moveTo(-36,24);ctx.lineTo(-32,-20);ctx.lineTo(-12,0);ctx.lineTo(0,-32);ctx.lineTo(12,0);ctx.lineTo(32,-20);ctx.lineTo(36,24);ctx.closePath();ctx.fill();
    ctx.globalAlpha=1;ctx.stroke();
    fillR(ctx,-36,24,72,11,4);
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,-36,5,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

function makePoster(){
  const c=document.createElement('canvas');c.width=1080;c.height=1440;
  const ctx=c.getContext('2d');if(!ctx) throw Error('Canvas unavailable');
  const {p,stats,ranked,lv}=report;
  const sans='"PingFang SC","Microsoft YaHei",sans-serif', serif='"Noto Serif SC","Songti SC","SimSun",serif', mono='"SF Mono","Menlo","Consolas",monospace';

  // Deep arcane dark fantasy backdrop
  const bg=ctx.createLinearGradient(0,0,1080,1440);
  bg.addColorStop(0,p.deep);bg.addColorStop(0.42,'#121424');bg.addColorStop(1,'#0b0c16');
  ctx.fillStyle=bg;ctx.fillRect(0,0,1080,1440);

  // Subtle decorative glowing rune circle behind header
  const glow=ctx.createRadialGradient(210,275,20,210,275,240);
  glow.addColorStop(0,p.color+'44');glow.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=glow;ctx.fillRect(0,0,1080,600);

  // Guild Double Gold Frame
  ctx.strokeStyle=p.color+'88';ctx.lineWidth=2.5;strokeR(ctx,28,28,1024,1384,26);
  ctx.strokeStyle='rgba(255,255,255,0.12)';ctx.lineWidth=1;strokeR(ctx,40,40,1000,1360,20);

  // Header Guild Bar
  ctx.fillStyle=p.color;ctx.font=`800 22px ${mono}`;
  ctx.fillText(`⚔ LIFE RPG GUILD  ·  NO.${p.no}`, 72, 92);
  ctx.textAlign='right';
  ctx.fillStyle=p.color+'30';fillR(ctx,742,64,266,42,8);
  ctx.strokeStyle=p.color;ctx.lineWidth=1.5;strokeR(ctx,742,64,266,42,8);
  ctx.fillStyle='#ffffff';ctx.font=`800 20px ${mono}`;
  ctx.textAlign='center';ctx.fillText(p.rank, 875, 92);
  ctx.textAlign='left';

  // Main Hero Identity Panel
  const hy=126;
  ctx.fillStyle='rgba(255,255,255,0.03)';fillR(ctx,64,hy,952,324,22);
  ctx.strokeStyle=p.color+'55';ctx.lineWidth=1.5;strokeR(ctx,64,hy,952,324,22);

  // Left Crest Box
  ctx.fillStyle='rgba(10,12,22,0.72)';fillR(ctx,92,hy+32,236,260,18);
  ctx.strokeStyle=p.color+'88';ctx.lineWidth=2;strokeR(ctx,92,hy+32,236,260,18);
  drawCanvasCrest(ctx, 210, hy+152, 1.48, p);
  ctx.textAlign='center';ctx.fillStyle=p.color;ctx.font=`800 19px ${mono}`;
  ctx.fillText(`LV.${lv}  ·  ${ranked[0].fit}% MATCH`, 210, hy+268);
  ctx.textAlign='left';

  // Right Title & Tags
  const rx=362, rw=620;
  ctx.fillStyle=p.color;ctx.font=`700 22px ${mono}`;
  ctx.fillText(p.role, rx, hy+68);

  const nameParts = p.name.includes('·') ? p.name.split('·') : [p.name];
  ctx.fillStyle='#ffffff';
  if(nameParts.length===2){
    ctx.font=`800 50px ${serif}`;
    ctx.fillText(nameParts[0]+' ·', rx, hy+134);
    ctx.fillText(nameParts[1], rx, hy+196);
  }else{
    ctx.font=`800 52px ${serif}`;
    ctx.fillText(p.name, rx, hy+156);
  }

  // Pills
  let tx=rx;
  p.tags.forEach(t=>{
    const lbl='# '+t;ctx.font=`600 20px ${sans}`;
    const w=ctx.measureText(lbl).width+28;
    if(tx+w<995){
      ctx.fillStyle=p.color+'24';fillR(ctx,tx,hy+232,w,38,19);
      ctx.strokeStyle=p.color+'77';ctx.lineWidth=1;strokeR(ctx,tx,hy+232,w,38,19);
      ctx.fillStyle='#ffffff';ctx.fillText(lbl,tx+14,hy+258);
      tx+=w+10;
    }
  });

  // Quote Strip
  const qy=470;
  ctx.fillStyle='rgba(255,255,255,0.04)';fillR(ctx,64,qy,952,86,16);
  ctx.fillStyle=p.color;fillR(ctx,64,qy,9,86,4);
  ctx.fillStyle='#f7e7c8';ctx.font=`600 25px ${serif}`;
  ctx.fillText(wrap(ctx,`「${p.quote}」`,890)[0], 96, qy+52);

  // 4-Stat RPG Attributes Panel
  const sy=576;
  ctx.fillStyle='#151828';fillR(ctx,64,sy,952,216,20);
  ctx.strokeStyle='rgba(255,255,255,0.10)';ctx.lineWidth=1.5;strokeR(ctx,64,sy,952,216,20);
  ctx.fillStyle='#f0c46c';ctx.font=`800 20px ${mono}`;
  ctx.fillText('CHARACTER ATTRIBUTES  ·  角色四维天赋面板', 96, sy+40);

  stats.forEach((s,i)=>{
    const col=i%2, row=Math.floor(i/2);
    const sx=96+col*456, ay=sy+88+row*68, sw=416;
    ctx.fillStyle='#ebe7f5';ctx.font=`700 21px ${sans}`;ctx.textAlign='left';
    ctx.fillText(`${s.name} ${s.key}`, sx, ay);
    ctx.textAlign='right';ctx.fillStyle=s.color;ctx.font=`900 25px ${mono}`;
    ctx.fillText(String(s.val), sx+sw, ay);
    ctx.textAlign='left';
    ctx.fillStyle='rgba(255,255,255,0.10)';fillR(ctx,sx,ay+12,sw,12,6);
    ctx.fillStyle=s.color;fillR(ctx,sx,ay+12,Math.max(24,sw*s.val/100),12,6);
  });

  // Passive Skill (Green Glow) + Fatal Debuff (Red Alert)
  const skY=814;
  ctx.fillStyle='rgba(95,209,154,0.11)';fillR(ctx,64,skY,952,148,18);
  ctx.strokeStyle='rgba(95,209,154,0.45)';ctx.lineWidth=1.8;strokeR(ctx,64,skY,952,148,18);
  ctx.fillStyle='#5fd19a';ctx.font=`800 22px ${mono}`;
  ctx.fillText(`✦ 神级被动技能  ${p.passive[0]}`, 96, skY+42);
  ctx.fillStyle='#e8f7ef';ctx.font=`400 23px ${sans}`;
  wrap(ctx,p.passive[1],888).slice(0,2).forEach((l,i)=>ctx.fillText(l, 96, skY+84+i*36));

  const dbY=982;
  ctx.fillStyle='rgba(239,104,104,0.12)';fillR(ctx,64,dbY,952,148,18);
  ctx.strokeStyle='rgba(239,104,104,0.48)';ctx.lineWidth=1.8;strokeR(ctx,64,dbY,952,148,18);
  ctx.fillStyle='#ff8a8a';ctx.font=`800 22px ${mono}`;
  ctx.fillText(`⚠ 致命 DEBUFF  ${p.debuff[0]}`, 96, dbY+42);
  ctx.fillStyle='#fae4e4';ctx.font=`400 23px ${sans}`;
  wrap(ctx,p.debuff[1],888).slice(0,2).forEach((l,i)=>ctx.fillText(l, 96, dbY+84+i*36));

  // Party Matchmaking Duo Cards
  const py=1152, ph=190;
  ctx.fillStyle='#1b1f33';fillR(ctx,64,py,464,ph,18);
  ctx.strokeStyle=p.color+'66';ctx.lineWidth=1.5;strokeR(ctx,64,py,464,ph,18);
  ctx.fillStyle=p.color;ctx.font=`800 19px ${mono}`;ctx.fillText('♥ 天选组队搭子', 92, py+38);
  ctx.fillStyle='#ffffff';ctx.font=`800 24px ${serif}`;
  wrap(ctx,p.match[0],410).slice(0,2).forEach((l,i)=>ctx.fillText(l, 92, py+78+i*31));
  ctx.fillStyle='#b2aec4';ctx.font=`400 19px ${sans}`;
  wrap(ctx,p.match[1],410).slice(0,2).forEach((l,i)=>ctx.fillText(l, 92, py+136+i*27));

  ctx.fillStyle='#1b1f33';fillR(ctx,552,py,464,ph,18);
  ctx.strokeStyle='rgba(255,255,255,0.12)';ctx.lineWidth=1.5;strokeR(ctx,552,py,464,ph,18);
  ctx.fillStyle='#ff8a8a';ctx.font=`800 19px ${mono}`;ctx.fillText('⚡ 同队易团灭警告', 580, py+38);
  ctx.fillStyle='#ffffff';ctx.font=`800 24px ${serif}`;
  wrap(ctx,p.clash[0],410).slice(0,2).forEach((l,i)=>ctx.fillText(l, 580, py+78+i*31));
  ctx.fillStyle='#b2aec4';ctx.font=`400 19px ${sans}`;
  wrap(ctx,p.clash[1],410).slice(0,2).forEach((l,i)=>ctx.fillText(l, 580, py+136+i*27));

  // Footer
  ctx.fillStyle='#9e99b0';ctx.font=`500 20px ${sans}`;
  ctx.fillText('如果生活是一场 RPG，你的隐藏职业与天赋面板  ·  长按保存摇人组队', 66, 1384);
  ctx.textAlign='right';ctx.fillText('LIFE RPG GUILD', 1014, 1384);
  ctx.textAlign='left';
  return c;
}

function showPoster(){
  if(!report) return;
  const status=document.getElementById('posterStatus'),
        area=document.getElementById('posterArea'),
        download=document.getElementById('downloadPoster');
  status.textContent='';area.innerHTML='';download.disabled=true;
  try{
    if(posterURL) URL.revokeObjectURL(posterURL);
    posterURL=null;
    const canvas=makePoster();
    const img=document.createElement('img');
    img.className='poster';img.alt='可保存的3:4 RPG角色属性卡海报';
    img.src=canvas.toDataURL('image/png');
    area.append(img);
    canvas.toBlob(blob=>{
      posterURL=blob?URL.createObjectURL(blob):img.src;
      download.disabled=false;
    },'image/png');
    if(!posterDialog.open) posterDialog.showModal();
  }catch(e){
    status.textContent='当前浏览器不支持生成海报，可直接截图保存结果页。';
    if(!posterDialog.open) posterDialog.showModal();
  }
}

document.getElementById('closePoster').onclick=()=>posterDialog.close();
document.getElementById('downloadPoster').onclick=()=>{
  if(!posterURL||!report) return;
  const a=document.createElement('a');a.href=posterURL;a.download='RPG职业-'+report.p.name+'.png';
  document.body.append(a);a.click();a.remove();
  document.getElementById('posterStatus').textContent='若微信/小红书内未自动下载，请直接长按上方角色面板保存。';
};
document.getElementById('closeCopy').onclick=()=>copyDialog.close();
document.getElementById('selectCopyBtn').onclick=()=>{
  const ta=document.getElementById('copyTextarea');ta.focus();ta.select();
};
home();
</script>
