<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e1e1c">
<meta name="description" content="你的灵魂「出厂质检单」 · 20项日常负载检测，打印你的专属人类使用说明书、已知无害小Bug与3:4热敏纸质检海报。">
<title>你的灵魂「出厂质检单」 · SOUL QC LAB</title>
<style>
:root{
  --desk:#e9e4d9;--paper:#fffef9;--ink:#1d1d1b;--muted:#68645c;--line:#d8d2c5;
  --accent:#c9362b;--cobalt:#1d4e89;--ochre:#c77d1f;--soft:#f3efe6;
  --mono:"SF Mono","Menlo","Monaco","Consolas","Liberation Mono",monospace;
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background-color:var(--desk);color:var(--ink);font-family:var(--sans);line-height:1.66;-webkit-tap-highlight-color:transparent;min-height:100vh;
  background-image:radial-gradient(rgba(30,30,28,.11) 1px,transparent 1px);background-size:20px 20px}
main{width:min(100%,640px);padding:16px 14px max(34px,env(safe-area-inset-bottom));margin:auto}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 14px;padding:0 4px}
.brand{font-family:var(--mono);font-size:11px;letter-spacing:2px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:7px}
.brand-dot{width:8px;height:8px;border-radius:2px;background:var(--accent);display:inline-block}
.issue{font-family:var(--mono);font-size:10.5px;color:var(--muted);white-space:nowrap;letter-spacing:.06em}
/* Thermal Receipt Ticket Container */
.ticket{position:relative;background:var(--paper);border-left:1px solid var(--line);border-right:1px solid var(--line);
  padding:clamp(22px,4.5vw,32px) clamp(18px,4.2vw,28px);
  box-shadow:0 18px 46px rgba(29,29,27,.10);animation:printIn .32s cubic-bezier(.22,1,.36,1)}
@keyframes printIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
.zig-top,.zig-bot{height:10px;width:100%;display:block;overflow:hidden;line-height:0}
.zig-top svg,.zig-bot svg{width:100%;height:10px;display:block}
h1,h2,h3,p{margin:0}
h1{font-family:var(--sans);font-size:clamp(28px,7.2vw,40px);font-weight:900;line-height:1.22;letter-spacing:-.01em}
h2{font-size:clamp(20px,5vw,25px);line-height:1.48;font-weight:800}
h3{font-size:15.5px;margin-bottom:9px;font-weight:800;letter-spacing:.02em}
.mono{font-family:var(--mono)}
.eyebrow{font-family:var(--mono);color:var(--accent);font-size:10.5px;letter-spacing:2px;font-weight:800;margin:14px 0 6px;text-transform:uppercase}
.lead{font-size:14.5px;line-height:1.84;margin:12px 0 18px;color:#3d3b36}
.muted{font-size:12px;color:var(--muted)}
.dash{border:0;border-top:1.5px dashed #cbc4b6;margin:20px 0}
.solid-rule{border:0;border-top:2px solid var(--ink);margin:14px 0}
/* Hero Receipt Header */
.qc-banner{position:relative;border:2px solid var(--ink);border-radius:10px;padding:18px 16px;background:var(--soft);overflow:hidden}
.qc-banner-top{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:10.5px;color:var(--muted);padding-bottom:10px;border-bottom:1px dashed #bfb7a7;margin-bottom:14px}
.qc-banner-main{display:flex;align-items:center;justify-content:space-between;gap:12px}
.qc-banner-copy small{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--accent);font-weight:800;display:block;margin-bottom:3px}
.qc-banner-copy strong{font-size:clamp(22px,5.6vw,30px);font-weight:900;line-height:1.2;display:block;letter-spacing:.02em}
.qc-stamp-svg{width:84px;height:84px;flex:none;transform:rotate(10deg)}
.pills{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 20px}
.pill{font-family:var(--mono);font-size:11.5px;padding:5px 11px;border:1px solid var(--ink);border-radius:6px;background:var(--paper);color:var(--ink);font-weight:700}
.pill.red{background:var(--accent);border-color:var(--accent);color:#fff}
.pill.soft{background:var(--soft);border-color:var(--line);color:#3f3c36;font-family:var(--sans);font-weight:600}
.teaser-wrap{margin:20px 0 18px;padding-top:16px;border-top:1.5px dashed #cbc4b6}
.teaser-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.teaser-head span{font-family:var(--mono);font-size:11px;letter-spacing:1.2px;color:var(--ink);font-weight:800}
.teaser-head small{font-size:11px;color:var(--muted)}
.teasers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.teaser{padding:11px 10px;border-radius:8px;background:var(--soft);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.teaser-code{font-family:var(--mono);font-size:9.5px;color:var(--accent);font-weight:800}
.teaser b{font-size:13px;line-height:1.35;color:var(--ink)}
.teaser small{font-size:11px;color:var(--muted);line-height:1.4}
button{font:inherit;color:inherit;cursor:pointer;background:var(--paper);border:1.5px solid var(--ink);border-radius:10px;padding:13px 16px;min-height:48px;touch-action:manipulation;transition:transform .1s,background .16s,box-shadow .16s}
button:active:not(:disabled){transform:translateY(1px)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
button:disabled{opacity:.38;cursor:not-allowed}
.primary{background:var(--ink);color:#fffef9;border-color:var(--ink);font-weight:800;width:100%;text-align:center;box-shadow:0 4px 0 rgba(29,29,27,.22)}
.primary:hover:not(:disabled){background:#32322e}
.primary.red{background:var(--accent);border-color:var(--accent);box-shadow:0 4px 0 rgba(160,34,24,.28)}
.secondary{width:100%;text-align:center;background:var(--soft);border-color:var(--line);font-weight:700}
.secondary:hover:not(:disabled){border-color:var(--ink)}
.subtle{background:transparent;border:0;text-align:center;color:var(--muted);font-size:12px;padding:8px;min-height:36px}
.subtle:hover{color:var(--ink)}
.stack{display:grid;gap:10px}
.actions-row{display:grid;grid-template-columns:1.25fr 1fr;gap:10px}
.notice{font-size:12px;color:var(--muted);line-height:1.72;margin-top:14px}
/* Quiz Screen */
.question-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;color:var(--ink);font-weight:800}
.auto-toggle{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:6px;border:1px solid var(--line);background:var(--soft);color:var(--muted);font-family:var(--sans);font-size:11px;font-weight:700;min-height:28px}
.auto-toggle.on{border-color:var(--ink);color:var(--ink);background:#fff}
.progress{height:7px;background:var(--soft);border:1px solid var(--line);overflow:hidden;border-radius:4px;margin:11px 0 18px}
.progress i{display:block;height:100%;background:repeating-linear-gradient(-45deg,var(--ink),var(--ink) 8px,#3b3b37 8px,#3b3b37 16px);transition:width .26s cubic-bezier(.22,1,.36,1)}
.chapter-bar{display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:8px;background:var(--soft);border-left:4px solid var(--accent);margin-bottom:20px}
.chapter-bar strong{display:block;font-family:var(--mono);font-size:12.5px;color:var(--ink)}
.chapter-bar span{display:block;font-size:11.5px;color:var(--muted);line-height:1.45}
.options{display:grid;gap:10px;margin:20px 0 22px}
.option{display:flex;text-align:left;align-items:center;gap:12px;min-height:60px;width:100%;padding:13px 14px;line-height:1.54;background:var(--paper);border:1.5px solid var(--line)}
.option:hover{border-color:var(--ink)}
.option .letter{display:grid;place-items:center;flex:0 0 28px;height:28px;border-radius:6px;background:var(--soft);color:var(--ink);font-family:var(--mono);font-weight:800;font-size:12px;border:1px solid var(--line);transition:all .15s}
.option.selected{border-color:var(--ink);background:var(--soft);box-shadow:3px 3px 0 var(--ink)}
.option.selected .letter{background:var(--accent);color:#fff;border-color:var(--accent)}
.option .check{margin-left:auto;font-family:var(--mono);color:var(--accent);font-weight:900;font-size:14px}
.nav{display:grid;grid-template-columns:1fr 1.6fr;gap:10px}
/* Thermal Printing Ritual */
.calc-box{text-align:center;padding:34px 10px 26px}
.printer-slot{width:176px;height:12px;margin:0 auto;background:var(--ink);border-radius:99px;position:relative}
.printer-paper{width:136px;height:82px;margin:-4px auto 22px;background:var(--soft);border:1.5px solid var(--ink);border-top:0;border-radius:0 0 6px 6px;padding:12px 14px;display:flex;flex-direction:column;gap:7px;animation:feed .9s ease-in-out infinite alternate}
.printer-paper i{display:block;height:5px;background:#bdb6a7;border-radius:2px}
.printer-paper i:nth-child(2){width:72%;background:var(--accent);opacity:.75}
.printer-paper i:nth-child(3){width:86%}
.printer-paper i:nth-child(4){width:54%}
@keyframes feed{from{transform:translateY(-4px)}to{transform:translateY(5px)}}
.calc-step{font-family:var(--mono);font-size:15.5px;font-weight:800;color:var(--ink);margin-bottom:8px;min-height:1.6em}
.calc-sub{font-size:12px;color:var(--muted)}
/* Result Receipt Header */
.receipt-head{position:relative;border:2px solid var(--ink);border-radius:10px;padding:16px 16px 14px;background:var(--paper)}
.receipt-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;color:var(--muted);padding-bottom:10px;border-bottom:1.5px dashed #cbc4b6}
.receipt-stamp{position:absolute;top:40px;right:14px;padding:5px 10px;border:2px solid var(--model-accent,var(--accent));border-radius:6px;color:var(--model-accent,var(--accent));font-family:var(--mono);font-size:11px;font-weight:900;letter-spacing:1.4px;transform:rotate(7deg);background:rgba(255,254,249,.92);box-shadow:0 0 0 2px #fffef9}
.model-code{font-family:var(--mono);font-size:11.5px;font-weight:800;color:var(--model-accent,var(--accent));margin-top:12px;letter-spacing:.06em}
.model-name{font-size:clamp(25px,6.8vw,36px);font-weight:900;line-height:1.25;margin:5px 0 8px;padding-right:86px;letter-spacing:-.01em}
.fit-strip{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.fit-chip{font-family:var(--mono);font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:5px;background:var(--model-accent,var(--ink));color:#fff}
.bat-chip{font-family:var(--mono);font-size:11px;font-weight:700;padding:4px 9px;border-radius:5px;background:var(--soft);border:1px solid var(--line);color:var(--ink)}
.spec-table{margin-top:12px;border-top:1px dashed #cbc4b6;padding-top:10px;display:grid;gap:6px}
.spec-row{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:12px}
.spec-row span{color:var(--muted)}
.spec-row strong{color:var(--ink);font-weight:800;text-align:right}
.quote-box{margin-top:14px;padding:11px 13px;background:var(--soft);border-left:4px solid var(--model-accent,var(--accent));border-radius:0 8px 8px 0;font-size:14.5px;font-weight:700;line-height:1.65;color:var(--ink)}
/* Content Blocks */
.block{padding:20px 0;border-bottom:1.5px dashed #cbc4b6}
.block:last-of-type{border:0;padding-bottom:8px}
.block p{font-size:14px;line-height:1.86;color:#2e2d29}
.kicker{font-family:var(--mono);font-size:10px;letter-spacing:1.8px;color:var(--muted);font-weight:800;margin-bottom:4px;text-transform:uppercase}
.bug-card{margin-top:12px;padding:14px 15px;border-radius:10px;background:#fdf4f2;border:1.5px solid #e9b9b4}
.bug-card b{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;color:#b82e24;margin-bottom:5px;letter-spacing:.04em}
.bug-card p{font-size:13.5px;line-height:1.78;color:#3d2422}
/* Garment Care Label Box */
.care-label{margin-top:10px;border:2px solid var(--ink);border-radius:10px;padding:14px 15px;background:var(--paper)}
.care-icons{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.care-icon{flex:1;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.care-icon svg{width:28px;height:28px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.care-icon span{font-size:10.5px;font-weight:700;color:var(--ink)}
.warn-strip{margin-top:10px;padding:9px 12px;border-radius:6px;background:repeating-linear-gradient(-45deg,#fef7e4,#fef7e4 10px,#fbf0d4 10px,#fbf0d4 20px);border:1px solid #dfb96a;font-size:12.5px;font-weight:700;color:#6e470b;line-height:1.6}
/* Axis Meter */
.axis{margin:14px 0}
.axis-head,.axis-labels{display:flex;justify-content:space-between;gap:10px;font-size:12px}
.axis-head strong{font-size:13px}
.axis-head span{font-family:var(--mono);color:var(--model-accent,var(--accent));font-weight:800}
.axis-labels{color:var(--muted);font-size:11.5px}
.track{position:relative;height:10px;border-radius:3px;background:var(--soft);border:1px solid var(--line);margin:7px 0}
.track::before{content:"";position:absolute;left:50%;width:1px;height:10px;background:#bdb6a7}
.track i{position:absolute;width:14px;height:18px;top:-5px;border-radius:3px;background:var(--model-accent,var(--ink));border:2px solid var(--paper);box-shadow:0 0 0 1.5px var(--ink);transform:translateX(-50%)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.mini{padding:13px;border-radius:10px;background:var(--soft);border:1px solid var(--line)}
.mini b{display:block;font-family:var(--mono);color:var(--model-accent,var(--accent));font-size:11px;margin-bottom:5px}
.mini .partner-name{font-size:15px;font-weight:900;color:var(--ink);margin-bottom:4px;line-height:1.35}
.mini p{font-size:12.5px;line-height:1.68;color:#3d3b36}
.rank{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.rank:last-child{border:0}
.rank small{display:block;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.rank .pct{font-family:var(--mono);font-size:11.5px;font-weight:800;color:var(--ink);background:var(--soft);border:1px solid var(--line);padding:3px 8px;border-radius:5px}
.barcode-box{margin-top:18px;padding-top:14px;border-top:1.5px dashed #cbc4b6;text-align:center}
.barcode-box svg{width:min(260px,84%);height:42px;display:block;margin:0 auto 5px}
.barcode-box span{font-family:var(--mono);font-size:10.5px;letter-spacing:2.4px;color:var(--muted)}
.status-bar{font-family:var(--mono);font-size:12px;color:var(--accent);text-align:center;min-height:1.4em;margin:4px 0 6px;font-weight:700}
.footer{text-align:center;margin:18px 0 0;font-size:11px;color:var(--muted);line-height:1.8}
.poster{width:100%;max-width:360px;margin:10px auto;border-radius:12px;display:block;border:1px solid var(--line);box-shadow:0 12px 30px rgba(0,0,0,.14)}
dialog{width:min(calc(100% - 26px),460px);max-height:90dvh;overflow:auto;border:2px solid var(--ink);border-radius:16px;padding:20px;background:var(--paper);color:var(--ink);box-shadow:0 24px 60px rgba(0,0,0,.28)}
dialog::backdrop{background:rgba(24,23,20,.65);backdrop-filter:blur(3px)}
.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.dialog-head button{min-height:36px;padding:4px 13px;font-size:13px}
.copy-area{width:100%;min-height:150px;border-radius:8px;border:1.5px solid var(--ink);background:var(--soft);color:var(--ink);padding:12px;font:inherit;font-size:13px;line-height:1.7;margin:10px 0}
@media(max-width:460px){
  main{padding:12px 10px 28px}
  .teasers,.duo,.actions-row{grid-template-columns:1fr}
  .qc-stamp-svg{width:68px;height:68px}
  .model-name{padding-right:0}
  .receipt-stamp{position:static;display:inline-block;margin-top:8px;transform:rotate(-2deg)}
  .option{font-size:14px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <header>
    <span class="brand"><i class="brand-dot"></i>SOUL QC LAB</span>
    <span class="issue">NO.02 · 人类质检局</span>
  </header>
  <div id="app"></div>
  <footer class="footer">SOUL FACTORY QC · 原创娱乐趣味测试，非专业心理测评<br>无需登录 · 所有质检数据仅在本地浏览器处理</footer>
</main>

<dialog id="posterDialog" aria-labelledby="posterTitle">
  <div class="dialog-head">
    <h3 id="posterTitle">你的 3:4 热敏纸质检海报</h3>
    <button id="closePoster" type="button">关闭</button>
  </div>
  <p class="muted">1080 × 1440 小红书专用比例 · 手机长按图片保存，电脑点击下方下载。</p>
  <div id="posterArea"></div>
  <div class="stack" style="margin-top:12px">
    <button class="primary red" id="downloadPoster">下载高清 PNG 质检单</button>
  </div>
  <p class="status-bar" id="posterStatus" role="status"></p>
</dialog>

<dialog id="copyDialog" aria-labelledby="copyTitle">
  <div class="dialog-head">
    <h3 id="copyTitle">复制小红书分享文案</h3>
    <button id="closeCopy" type="button">关闭</button>
  </div>
  <p class="muted">长按或全选下方文案复制，搭配热敏质检单发笔记最容易引发同款认领。</p>
  <textarea id="copyTextarea" class="copy-area" readonly></textarea>
  <button class="primary" id="selectCopyBtn" type="button">全选文案</button>

function barcodeSVG(seedStr){
  let h = 2166136261;
  for(const ch of seedStr){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  let bars = '', x = 4;
  for(let i=0; i<52 && x<256; i++){
    h = Math.imul(h ^ (h >>> 15), 2246822507);
    const w = [1.5, 2.5, 4, 1.5, 3][Math.abs(h) % 5];
    const gap = [1.5, 2, 3.5][Math.abs(h >> 4) % 3];
    bars += `<rect x="${x.toFixed(1)}" y="0" width="${w}" height="42" fill="#1d1d1b"/>`;
    x += w + gap;
  }
  return `<svg viewBox="0 0 260 42" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${bars}</svg>`;
}

function compute(input){
  if(input.length!==N||input.some(v=>!Number.isInteger(v)||v<0||v>3)) throw Error('Incomplete answers');
  const sums=D.axes.map(()=>0), cnts=D.axes.map(()=>0);
  const wSums=D.axes.map(()=>0), wCnts=D.axes.map(()=>0);
  D.questions.forEach((q,i)=>{
    const sc=q.options[input[i]].score;
    sums[q.axis]+=sc; cnts[q.axis]++;
    const w=1+i*0.015;
    wSums[q.axis]+=sc*w; wCnts[q.axis]+=w;
  });
  const v=sums.map((s,i)=>s/cnts[i]);
  const vw=wSums.map((s,i)=>s/wCnts[i]);
  const ranked=D.profiles.map((p,i)=>{
    const center=p.vector.map(x=>x-1.5);
    const norm=Math.hypot(...center)||1;
    const radius=Math.sqrt(vw.length)*0.52+0.12*(norm-Math.sqrt(vw.length));
    const cal=center.map(x=>1.5+x*radius/norm);
    const d=cal.reduce((s,x,j)=>s+(x-vw[j])**2,0);
    const rawSim=Math.max(0,1-Math.sqrt(d/(4.2*vw.length)));
    const fit=Math.round(maxClamp(68+rawSim*30,68,98));
    return {p,i,d,fit};
  });
  ranked.sort((a,b)=>a.d-b.d||a.i-b.i);
  for(let k=1;k<Math.min(4,ranked.length);k++){
    if(ranked[k].fit>=ranked[k-1].fit) ranked[k].fit=Math.max(62,ranked[k-1].fit-2);
  }
  const sn=`QC-26${ranked[0].p.no}-${String(Math.round((v[0]+v[1]*2+v[2]*3+v[3]*4)*17+1000)).slice(-4)}`;
  return {v,ranked,p:ranked[0].p,sn};
}
function maxClamp(x,lo,hi){return Math.max(lo,Math.min(hi,x));}
function tendency(a,v){return v<1.18?a[1]:v>1.82?a[2]:'自适应平衡'}

function wrap(ctx,text,max){
  const out=[];let line='';
  for(const ch of text){
    if(line&&ctx.measureText(line+ch).width>max){out.push(line);line=ch;}
    else line+=ch;
  }
  if(line) out.push(line);
  return out;
}
function rPath(ctx,x,y,w,h,r){
  ctx.beginPath();
  if(typeof ctx.roundRect==='function') ctx.roundRect(x,y,w,h,r);
  else{r=Math.min(r,w/2,h/2);ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
}
function fillR(ctx,x,y,w,h,r){rPath(ctx,x,y,w,h,r);ctx.fill();}
function strokeR(ctx,x,y,w,h,r){rPath(ctx,x,y,w,h,r);ctx.stroke();}

function drawZigzagReceipt(ctx, x, y, w, h, teeth){
  const step = w / teeth;
  const toothH = 14;
  ctx.beginPath();
  ctx.moveTo(x, y + toothH);
  for(let i=0;i<teeth;i++){
    ctx.lineTo(x + (i+0.5)*step, y);
    ctx.lineTo(x + (i+1)*step, y + toothH);
  }
  ctx.lineTo(x + w, y + h - toothH);
  for(let i=teeth;i>0;i--){
    ctx.lineTo(x + (i-0.5)*step, y + h);
    ctx.lineTo(x + (i-1)*step, y + h - toothH);
  }
  ctx.closePath();
}

function drawDashed(ctx, x1, x2, y){
  ctx.save();ctx.strokeStyle='#c9c2b4';ctx.lineWidth=2;ctx.setLineDash([8,7]);
  ctx.beginPath();ctx.moveTo(x1,y);ctx.lineTo(x2,y);ctx.stroke();
  ctx.restore();
}

  const c=document.createElement('canvas');c.width=1080;c.height=1440;
  const ctx=c.getContext('2d');if(!ctx) throw Error('Canvas unavailable');
  const {p,v,ranked,sn}=report;
  const sans='"PingFang SC","Microsoft YaHei",sans-serif', mono='"SF Mono","Menlo","Consolas",monospace';
  const today=new Date().toISOString().slice(0,10);

  // Tactile drafting desk backdrop with dot grid
  ctx.fillStyle='#e5dfd2';ctx.fillRect(0,0,1080,1440);
  ctx.fillStyle='rgba(29,29,27,0.08)';
  for(let gx=24;gx<1080;gx+=28){for(let gy=24;gy<1440;gy+=28){ctx.fillRect(gx,gy,2.2,2.2);}}

  // Thermal Receipt Card with serrated zigzag top/bottom & subtle desk shadow
  ctx.save();
  ctx.shadowColor='rgba(29,29,27,0.16)';ctx.shadowBlur=38;ctx.shadowOffsetY=14;
  ctx.fillStyle='#fffef9';
  drawZigzagReceipt(ctx, 64, 42, 952, 1356, 34);
  ctx.fill();
  ctx.restore();
  ctx.strokeStyle='#d4cdc0';ctx.lineWidth=1.5;
  drawZigzagReceipt(ctx, 64, 42, 952, 1356, 34);ctx.stroke();

  // Header metadata bar
  ctx.fillStyle='#1d1d1b';ctx.font=`800 22px ${mono}`;
  ctx.fillText('■ SOUL FACTORY QC / 灵魂出厂质检单', 112, 108);
  ctx.textAlign='right';ctx.fillStyle='#68645c';ctx.font=`700 20px ${mono}`;
  ctx.fillText(`SN: ${sn}  |  ${today}`, 968, 108);
  ctx.textAlign='left';

  ctx.fillStyle='#1d1d1b';ctx.fillRect(112, 128, 856, 4);

  // Model Code & Name
  ctx.fillStyle=p.accent;ctx.font=`800 23px ${mono}`;
  ctx.fillText(`${p.code}   ·   MATCH ${ranked[0].fit}%`, 112, 174);

  // Smart two-line display on '·' for big punchy poster typography
  const nameParts = p.name.includes('·') ? p.name.split('·') : [p.name];
  ctx.fillStyle='#1d1d1b';
  if(nameParts.length===2){
    ctx.font=`900 54px ${sans}`;
    ctx.fillText(nameParts[0]+' ·', 112, 240);
    ctx.fillText(nameParts[1], 112, 304);
  }else{
    ctx.font=`900 56px ${sans}`;
    ctx.fillText(p.name, 112, 268);
  }

  // Tilted QC PASS Circular Stamp on top right
  ctx.save();ctx.translate(855, 240);ctx.rotate(0.14);
  ctx.strokeStyle=p.accent;ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,0,76,0,Math.PI*2);ctx.stroke();
  ctx.lineWidth=1.5;ctx.setLineDash([5,4]);ctx.beginPath();ctx.arc(0,0,65,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='#fffef9';fillR(ctx,-84,-20,168,40,5);
  ctx.strokeStyle=p.accent;ctx.lineWidth=3;strokeR(ctx,-84,-20,168,40,5);
  ctx.fillStyle=p.accent;ctx.textAlign='center';
  ctx.font=`900 20px ${sans}`;ctx.fillText(p.stamp, 0, 7);
  ctx.font=`800 14px ${mono}`;ctx.fillText('QC PASS', 0, -34);
  ctx.fillText('CERTIFIED', 0, 46);
  ctx.restore();ctx.textAlign='left';

  // Battery & Hashtag pills
  ctx.fillStyle='#1d1d1b';fillR(ctx, 112, 336, 360, 40, 6);
  ctx.fillStyle='#fffef9';ctx.font=`700 20px ${mono}`;
  ctx.fillText(`⚡ ${p.battery}`, 128, 363);

  let tx = 486;
  p.tags.slice(0,2).forEach(t=>{
    const lbl='# '+t;ctx.font=`700 19px ${sans}`;
    const w=ctx.measureText(lbl).width+28;
    if(tx+w<970){
      ctx.fillStyle='#f3efe6';fillR(ctx,tx,336,w,40,6);
      ctx.strokeStyle='#d4cdc0';ctx.lineWidth=1.5;strokeR(ctx,tx,336,w,40,6);
      ctx.fillStyle='#1d1d1b';ctx.fillText(lbl,tx+14,363);
      tx+=w+10;
    }
  });

  // Quote Strip
  ctx.fillStyle='#f3efe6';fillR(ctx, 112, 396, 856, 78, 8);
  ctx.fillStyle=p.accent;fillR(ctx, 112, 396, 9, 78, 4);
  ctx.fillStyle='#1d1d1b';ctx.font=`700 25px ${sans}`;
  const qLine=wrap(ctx,`「${p.quote}」`,805)[0];
  ctx.fillText(qLine, 140, 444);

  drawDashed(ctx, 112, 968, 498);

  // Spec Receipt Table (3 rows + 4 diagnostic meters side-by-side)
  ctx.fillStyle='#68645c';ctx.font=`800 19px ${mono}`;
  ctx.fillText('01 / DIAGNOSTIC SPECS · 硬件检测参数', 112, 534);

  // Left: 3 spec key-values
  p.specs.forEach((line, k)=>{
    const pts=line.split('：');
    const ry=578+k*46;
    ctx.fillStyle='#68645c';ctx.font=`600 21px ${sans}`;ctx.fillText(pts[0], 112, ry);
    ctx.textAlign='right';ctx.fillStyle='#1d1d1b';ctx.font=`800 21px ${mono}`;ctx.fillText(pts[1]||'', 500, ry);
    ctx.textAlign='left';
  });

  // Right: 4 compact axis meters
  D.axes.forEach((a, i)=>{
    const ay=564+i*38;
    ctx.fillStyle='#1d1d1b';ctx.font=`700 18px ${sans}`;ctx.fillText(a[0], 546, ay);
    ctx.fillStyle='#ebe6dc';fillR(ctx, 640, ay-13, 328, 12, 3);
    const px=640+328*Math.max(0.06,Math.min(0.94,v[i]/3));
    ctx.fillStyle=p.accent;fillR(ctx, px-7, ay-17, 14, 20, 3);
    ctx.strokeStyle='#1d1d1b';ctx.lineWidth=1.5;strokeR(ctx, px-7, ay-17, 14, 20, 3);
  });

  drawDashed(ctx, 112, 968, 728);

  // Known Harmless Bug Callout (Red Alert Style)
  ctx.fillStyle='#fdf4f2';fillR(ctx, 112, 750, 856, 174, 12);
  ctx.strokeStyle='#e4aba4';ctx.lineWidth=2;strokeR(ctx, 112, 750, 856, 174, 12);
  ctx.fillStyle='#b82e24';ctx.font=`800 21px ${mono}`;
  ctx.fillText('⚠ KNOWN HARMLESS BUG · 已知无害小 BUG', 140, 790);
  ctx.fillStyle='#2e1c1a';ctx.font=`500 24px ${sans}`;
  wrap(ctx, p.bug, 800).slice(0,3).forEach((l,i)=>ctx.fillText(l, 140, 832+i*36));

  // Care Label & Warning Box
  ctx.fillStyle='#fffef9';fillR(ctx, 112, 944, 856, 166, 12);
  ctx.strokeStyle='#1d1d1b';ctx.lineWidth=2.5;strokeR(ctx, 112, 944, 856, 166, 12);
  ctx.fillStyle='#1d1d1b';ctx.font=`800 20px ${mono}`;
  ctx.fillText('CARE LABEL · 保养与禁用警告', 140, 982);
  ctx.fillStyle='#2e2d29';ctx.font=`500 22px ${sans}`;
  wrap(ctx, p.care, 800).slice(0,2).forEach((l,i)=>ctx.fillText(l, 140, 1020+i*32));
  ctx.fillStyle='#fdf3d8';fillR(ctx, 138, 1062, 804, 34, 5);
  ctx.fillStyle='#784b08';ctx.font=`700 20px ${sans}`;
  ctx.fillText('⚡ '+wrap(ctx, p.warning, 770)[0], 150, 1086);

  // Compatibility Duo Row
  ctx.fillStyle='#f3efe6';fillR(ctx, 112, 1130, 418, 124, 10);
  ctx.fillStyle=p.accent;ctx.font=`800 18px ${mono}`;ctx.fillText('♥ 天选兼容外设', 134, 1164);
  ctx.fillStyle='#1d1d1b';ctx.font=`900 24px ${sans}`;ctx.fillText(p.match[0], 134, 1200);
  ctx.fillStyle='#5c5851';ctx.font=`400 18px ${sans}`;ctx.fillText(wrap(ctx, p.match[1], 374)[0], 134, 1234);

  ctx.fillStyle='#f3efe6';fillR(ctx, 550, 1130, 418, 124, 10);
  ctx.fillStyle='#68645c';ctx.font=`800 18px ${mono}`;ctx.fillText('⚡ 系统冲突型号', 572, 1164);
  ctx.fillStyle='#1d1d1b';ctx.font=`900 24px ${sans}`;ctx.fillText(p.clash[0], 572, 1200);
  ctx.fillStyle='#5c5851';ctx.font=`400 18px ${sans}`;ctx.fillText(wrap(ctx, p.clash[1], 374)[0], 572, 1234);

  // Realistic Thermal Barcode at Bottom
  let h=2166136261;
  for(const ch of (sn+p.name)){ h^=ch.charCodeAt(0); h=Math.imul(h,16777619); }
  let bx=310;
  ctx.fillStyle='#1d1d1b';
  for(let i=0;i<68&&bx<770;i++){
    h=Math.imul(h^(h>>>15),2246822507);
    const bw=[2.5,4,6.5,2.5,5][Math.abs(h)%5];
    const bg=[2.5,3.5,5.5][Math.abs(h>>4)%3];
    ctx.fillRect(bx, 1278, bw, 56);
    bx+=bw+bg;
  }
  ctx.textAlign='center';ctx.fillStyle='#68645c';ctx.font=`700 18px ${mono}`;
  ctx.fillText(`* ${sn} · 你的灵魂「出厂质检单」 · 仅供娱乐 *`, 540, 1362);
  ctx.textAlign='left';
  return c;
}

function showPoster(){
  if(!report) return;
  const status=document.getElementById('posterStatus'),
        area=document.getElementById('posterArea'),
        download=document.getElementById('downloadPoster');
  status.textContent='';area.innerHTML='';download.disabled=true;
  try{
    if(posterURL) URL.revokeObjectURL(posterURL);
    posterURL=null;
    const canvas=makePoster();
    const img=document.createElement('img');
    img.className='poster';img.alt='可保存的3:4热敏纸质检海报';
    img.src=canvas.toDataURL('image/png');
    area.append(img);
    canvas.toBlob(blob=>{
      posterURL=blob?URL.createObjectURL(blob):img.src;
      download.disabled=false;
    },'image/png');
    if(!posterDialog.open) posterDialog.showModal();
  }catch(e){
    status.textContent='当前浏览器不支持生成海报，可直接截图保存结果页。';
    if(!posterDialog.open) posterDialog.showModal();
  }
}

document.getElementById('closePoster').onclick=()=>posterDialog.close();
document.getElementById('downloadPoster').onclick=()=>{
  if(!posterURL||!report) return;
  const a=document.createElement('a');a.href=posterURL;a.download='灵魂质检单-'+report.p.name+'.png';
  document.body.append(a);a.click();a.remove();
  document.getElementById('posterStatus').textContent='若微信/小红书内未自动下载，请直接长按上方热敏小票保存。';
};
document.getElementById('closeCopy').onclick=()=>copyDialog.close();
document.getElementById('selectCopyBtn').onclick=()=>{
  const ta=document.getElementById('copyTextarea');ta.focus();ta.select();
};
home();
</script>
