<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141523">
<meta name="description" content="24次情景选择，探索你在平行宇宙的另一种人生。原创沉浸式趣味测试。">
<title>平行宇宙的另一个你 · 人生可能性研究所</title>
<style>
:root{color-scheme:dark;--bg:#131422;--panel:#1c1d2e;--line:#ffffff1d;--text:#f6f1ea;--muted:#c4c0cf;--gold:#f0d2a2;--violet:#cbb9ee;font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;line-height:1.75}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% -15%,#383254 0,transparent 58%),radial-gradient(ellipse at 90% 100%,#271e3d 0,transparent 48%),var(--bg);color:var(--text);min-height:100vh}
button,a{-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
button:disabled{opacity:.35;cursor:not-allowed}
button:active:not(:disabled){transform:scale(.988)}
.top,footer{max-width:980px;margin:auto;padding:22px 26px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.top{border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-size:14px;letter-spacing:.08em;font-weight:650}
.brandmark{font-family:serif;font-size:30px;color:var(--gold);line-height:1}
.brand small{display:block;font-size:9px;letter-spacing:.2em;color:var(--muted);font-weight:400}
.issue{font-size:10px;letter-spacing:.16em;color:var(--muted);white-space:nowrap}
.issue i{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--gold);margin:0 5px;vertical-align:middle}
main{max-width:900px;margin:0 auto;padding:26px 24px 60px;min-height:66vh}
footer{font-size:11px;color:#aaa6b8;border-top:1px solid var(--line);flex-wrap:wrap}
h1,h2,h3,p{margin:0}
h1,h2{font-family:"Songti SC","Noto Serif CJK SC","SimSun",serif;font-weight:600;line-height:1.35}
h1{font-size:clamp(35px,6.4vw,62px);letter-spacing:.05em}
h2{font-size:clamp(22px,4vw,32px)}
h3{font-size:16px}
p{color:var(--muted)}
.eyebrow{font-size:10px;letter-spacing:.25em;color:var(--gold);font-weight:650;text-transform:uppercase}
.hero{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:24px;background:#1e1c30;box-shadow:0 26px 90px rgba(0,0,0,.42)}
.hero-art{height:clamp(220px,42vw,400px);width:100%;object-fit:cover;display:block;object-position:center 42%}
.hero-copy{position:relative;padding:0 34px 34px;margin-top:-58px;background:linear-gradient(transparent,#1e1c30 58px);text-align:center}
.hero-copy .eyebrow{padding-top:38px;margin-bottom:10px}
.hero-copy h1 span{display:block;color:var(--gold)}
.hero-copy p{margin:14px auto 22px;max-width:460px;font-size:15px}
.chips{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:16px 0 22px}
.chip{border:1px solid var(--line);border-radius:30px;padding:4px 12px;font-size:11px;color:var(--muted);background:rgba(255,255,255,.04)}
.chip.gold{border-color:rgba(240,210,162,.38);color:var(--gold);background:rgba(240,210,162,.09)}
.btn{border:1px solid transparent;background:var(--gold);color:#261f30;font-weight:750;border-radius:13px;padding:13px 22px;min-height:48px;transition:background .2s,transform .15s,box-shadow .2s;box-shadow:0 8px 22px rgba(240,210,162,.18)}
.btn:hover:not(:disabled){background:#ffe5be}
.btn.secondary{color:var(--text);background:#ffffff0a;border-color:var(--line);font-weight:500;box-shadow:none}
.btn.secondary:hover:not(:disabled){background:#ffffff16;border-color:#ffffff33}
.btn.full{width:100%;max-width:420px}
.micro{font-size:11px!important;color:#b2acc0!important;margin-top:12px!important}
.section-head{display:flex;justify-content:space-between;align-items:end;margin:30px 0 14px;gap:10px}
.section-head h2{font-size:21px}
.section-head span{font-size:11px;color:var(--muted)}
.teasers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.teaser{background:var(--panel);border:1px solid var(--line);border-radius:15px;overflow:hidden}
.teaser img{width:100%;height:105px;object-fit:cover;display:block}
.teaser div{padding:10px 12px;font-size:13px}
.teaser small{display:block;font-size:10px;color:var(--muted);margin-top:2px}
.quiz{max-width:650px;margin:auto}
.progress-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.progress-label{display:flex;align-items:center;color:var(--muted);font-size:12px;gap:10px}
.progress-label strong{color:var(--gold);font-size:15px;font-variant-numeric:tabular-nums}
.auto-toggle{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:99px;border:1px solid var(--line);background:#ffffff08;color:var(--muted);font-size:11px;min-height:28px}
.auto-toggle.on{border-color:rgba(240,210,162,.45);color:var(--gold);background:rgba(240,210,162,.12)}
.progress{height:5px;background:#ffffff14;border-radius:20px;margin:12px 0 22px;overflow:hidden}
.progress div{height:100%;background:linear-gradient(90deg,#b9a4de,var(--gold));border-radius:20px;transition:width .28s cubic-bezier(.22,1,.36,1)}
.chapter{border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;gap:13px;align-items:center;background:linear-gradient(110deg,#ffffff0a,transparent)}
.chapter-number{font-family:Georgia,serif;font-size:28px;color:var(--gold);line-height:1}
.chapter h3{font-size:14px}
.chapter p{font-size:12px}
.qcard{padding:26px 0 18px;animation:appear .24s ease-out}
.qcard h2{margin:9px 0 22px;line-height:1.52}
.options{display:grid;gap:11px}
.option{display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:15px 16px;background:var(--panel);border:1px solid var(--line);border-radius:14px;color:var(--text);min-height:62px;font-size:15px;transition:border .18s,background .18s,box-shadow .18s}
.option:hover{border-color:#cbb9ee88}
.option.selected{border-color:var(--gold);background:#f0d2a218;box-shadow:0 6px 20px rgba(240,210,162,.1)}
.letter{display:grid;place-items:center;flex:none;width:30px;height:30px;border:1px solid #ffffff2b;border-radius:50%;color:var(--muted);font-family:Georgia,serif;font-size:14px;transition:all .18s}
.selected .letter{background:var(--gold);color:#2b2335;border-color:var(--gold);font-weight:700}
.option .check{margin-left:auto;color:var(--gold);font-size:15px;visibility:hidden}
.selected .check{visibility:visible}
.nav{display:flex;gap:12px;margin-top:10px}
.nav .btn:last-child{flex:1}
.under{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:11px;color:var(--muted)}
.link{background:none;border:none;text-decoration:underline;text-underline-offset:3px;color:var(--muted);padding:6px 0;font-size:12px}
/* Calculating Ritual */
.calc-panel{max-width:560px;margin:28px auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:44px 24px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.orbit{width:72px;height:72px;margin:0 auto 22px;border-radius:50%;border:2px solid #ffffff1c;border-top-color:var(--gold);border-right-color:var(--violet);animation:spin 1.1s linear infinite;position:relative}
.orbit::after{content:"✦";position:absolute;inset:0;display:grid;place-items:center;color:var(--gold);font-size:20px;animation:spin-rev 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spin-rev{to{transform:rotate(-360deg)}}
.calc-title{font-family:"Songti SC","Noto Serif CJK SC",serif;font-size:21px;color:var(--text);margin-bottom:8px;min-height:1.6em}
/* Result */
.result{max-width:680px;margin:auto;animation:appear .3s ease-out}
.result-top{text-align:center;margin-bottom:18px}
.result-top h2{margin-top:5px}
.poster{border:1px solid #ffffff2b;border-radius:22px;overflow:hidden;background:linear-gradient(155deg,var(--deep),#161724);box-shadow:0 20px 64px rgba(0,0,0,.45)}
.poster-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;font-size:10px;letter-spacing:.16em;color:var(--accent)}
.res-pill{padding:3px 10px;border-radius:99px;border:1px solid color-mix(in srgb,var(--accent) 55%,transparent);background:rgba(0,0,0,.22);color:var(--accent);font-weight:700;letter-spacing:.06em}
.poster img{width:100%;display:block;aspect-ratio:5/3;object-fit:cover}
.poster-body{text-align:center;padding:24px 22px 26px}
.poster-body h1{font-size:clamp(30px,6vw,46px);color:var(--accent);letter-spacing:.045em;margin:8px 0}
.poster-body p{color:#e5dcea;font-size:14px}
.poster .chips{margin:14px 0}
.quote{border-top:1px solid #ffffff20;padding-top:16px;margin-top:15px;font-family:"Songti SC","Noto Serif CJK SC",serif;font-size:17px;color:var(--accent);line-height:1.75}
.actions{display:grid;grid-template-columns:1.25fr 1fr;gap:12px;margin:15px 0 8px}
.status{font-size:12px;color:var(--gold);min-height:1.5em;text-align:center;margin-bottom:10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:14px}
.panel .eyebrow{margin-bottom:6px}
.panel h2{font-size:21px;margin:3px 0 11px}
.panel p{font-size:14px;line-height:1.9}
.contrast-box{margin-top:14px;padding:14px 16px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(240,210,162,.24)}
.contrast-box b{display:block;font-size:12px;color:var(--accent);margin-bottom:4px;letter-spacing:.06em}
.contrast-box p{font-size:13.5px;color:#e5e0ee}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}
.fact{padding:13px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.02)}
.fact span{display:block;color:var(--muted);font-size:11px;margin-bottom:3px}
.fact strong{font-size:14px;color:var(--accent);display:block;margin-bottom:4px}
.fact small{display:block;font-size:12px;color:var(--muted);line-height:1.6}
.bar-row{display:grid;grid-template-columns:82px 1fr 44px;gap:10px;align-items:center;margin:13px 0;font-size:12px}
.bar-bg{height:7px;background:#ffffff14;border-radius:8px;overflow:hidden}
.bar-fill{height:100%;border-radius:8px;background:linear-gradient(90deg,#ae9ad8,var(--accent))}
.bar-num{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.insight{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.insight .panel{margin-top:14px}
.secondary-world{display:flex;gap:14px;align-items:center}
.secondary-world img{width:116px;aspect-ratio:5/3;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.secondary-world h3{color:var(--text);margin-bottom:4px}
.secondary-world p{font-size:12.5px;line-height:1.65}
.answer-review{margin-top:12px}
.answer-review summary{font-size:13px;color:var(--gold);cursor:pointer}
.answer-review ol{padding-left:20px;font-size:12.5px;color:var(--muted);margin-top:10px}
.answer-review li{margin:9px 0}
.answer-review strong{display:block;color:var(--text);font-weight:500}
.retake{margin-top:24px;text-align:center}
.notice{font-size:11px!important;line-height:1.75!important;text-align:center;margin-top:16px}
.preview{display:block;width:100%;border-radius:12px;margin-top:12px;border:1px solid var(--line)}
.modal{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:18px;padding:20px;max-width:min(440px,94vw);width:100%;max-height:90dvh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.55)}
.modal::backdrop{background:#080812cf;backdrop-filter:blur(3px)}
.modal .btn{width:100%;margin-top:10px}
.modal h3{margin-bottom:8px}
@keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:540px){
  .top,footer{padding:16px 15px}
  .brand{font-size:12px}.brand small{font-size:8px}.issue{font-size:9px}
  main{padding:16px 14px 36px}
  .hero{border-radius:18px}.hero-copy{padding:0 18px 24px}.hero-copy p{font-size:14px}
  .teasers{gap:8px}.teaser img{height:74px}.teaser div{padding:8px;font-size:11px}.teaser small{font-size:9px}
  .option{font-size:14px;padding:13px 12px}.qcard{padding-top:20px}.panel{padding:18px}
  .insight,.facts,.actions{grid-template-columns:1fr}
  .poster-head{padding:14px 15px}.poster-body{padding:18px 14px 22px}
  .secondary-world img{width:92px}.hero-art{height:250px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="top"><div class="brand"><span class="brandmark">✧</span><div>人生可能性研究所<small>THE POSSIBILITY LAB</small></div></div><span class="issue">档案 001 <i></i> VOL.02</span></header>
<main id="app" aria-live="polite"></main>
<footer><span>© 人生可能性研究所 · 原创沉浸测试</span><span>娱乐性自我探索 · 非专业心理测评 · 无需登录</span></footer>
<noscript>请启用 JavaScript 后重新打开网页。</noscript>
<script>
window.QUIZ_DATA = {
  themes: [ {id:'care',name:'温柔联结'}, {id:'mind',name:'求知洞察'}, {id:'self',name:'内在自由'}, {id:'create',name:'想象创造'}, {id:'roam',name:'远方冒险'}, {id:'build',name:'行动建构'} ],
  profiles: [
    {id:'flower',name:'海边花店店主',theme:'care',place:'晴潮镇 · 海边花屋',tags:['温柔','观察','细腻'],gift:'让日常重新发光',quote:'你不必改变整个世界，也能让一个人的今天变好。',story:'清晨的潮声先于闹钟响起。你把新鲜的花摆在窗边，记得熟客喜欢的颜色，也记得哪一天他们只是想有人听。你没有把生活过成一场盛大的表演，而是把一个又一个普通的日子照顾得很漂亮。',mirror:'在你的选择里，关系的温度和具体的小事比宏大的承诺更值得珍惜。你也许更喜欢用行动表达善意。',strength:'留意别人忽略的需求，把关心变成可以感受到的东西。',edge:'照顾别人时，也为自己的时间和感受留出空间；温柔并不要求你总是答应。',mission:'为自己挑一束花，或者留下一件让今天变好的小事。',color:'#e6adab',deep:'#342744'},
    {id:'hacker',name:'赛博世界黑客',theme:'mind',place:'霓虹港 · 雨夜工作室',tags:['好奇','理性','独立'],gift:'从混乱中识别规律',quote:'规则不是答案，而是下一扇等待打开的门。',story:'午夜的城市被霓虹切成碎片。你在屏幕与雨声之间追踪一个又一个谜题，不是为了证明自己比别人聪明，而是享受终于看清机制的那一刻。这个世界给你足够多的未知，也给你一张可以自己画的地图。',mirror:'你的选择偏向理解机制、拆解复杂问题以及保留独立判断，而不是仅仅接受现成的解释。',strength:'把模糊的问题拆成可验证的小问题，找到别人没有注意的联系。',edge:'不是所有问题都需要被解开；偶尔接受不确定，也能让精力留给更重要的事。',mission:'选一个好奇已久的小问题，记录三个可能解释。',color:'#72e3db',deep:'#102c49'},
    {id:'writer',name:'深山隐居作家',theme:'self',place:'雾松山 · 木窗小屋',tags:['独立','沉静','专注'],gift:'把独处变成丰饶',quote:'世界很吵，而你拥有属于自己的回声。',story:'山雾从松树间升起，窗边摊着写到一半的稿纸。你没有每天追逐新的热闹，而是在有节奏的安静中慢慢完成想做的事。这里的时间属于你，你可以写作、散步，或者只是望着天光变化。',mirror:'你重视自主安排的时间和深度体验，倾向于先听见自己的声音，再决定是否跟随人群。',strength:'在不依赖外界即时反馈时，也能保持专注，整理自己的思绪。',edge:'独处可以是选择，不必变成拒绝一切帮助的理由。',mission:'给自己留半小时无通知的时间，写下最近真正想做的事。',color:'#b0cda8',deep:'#21333e'},
    {id:'artist',name:'巴黎流浪艺术家',theme:'create',place:'旧城左岸 · 日落画室',tags:['浪漫','表达','审美'],gift:'给普通事物新的意义',quote:'日常不必惊天动地，也值得被认真描绘。',story:'你带着画册穿过街角，橱窗的倒影、路人的围巾、雨后石板路都成了素材。你会为了一个色调多停留几分钟，也愿意把不完美的作品交给世界。你的人生不是一份标准答案，而是一张不断修改的画。',mirror:'你偏爱审美体验和自由表达，可能更关心一件事有没有自己的味道，而不是它是否符合惯例。',strength:'发现细节中的美，并把抽象感受转化为具体的作品。',edge:'灵感有时需要规律练习来承接；完成一件作品比永远等待完美更有价值。',mission:'拍下或画出今天一个容易被忽略的角落。',color:'#f0be97',deep:'#4b304d'},
    {id:'star',name:'星际旅行者',theme:'roam',place:'第九星环 · 远航舱',tags:['探索','勇气','开放'],gift:'把未知变成出发的理由',quote:'地图的边缘，从来不是世界的尽头。',story:'舷窗外是从未命名的星云。你在航行日志里记录陌生的颜色、声音和发现，每一次偏离预定航线都可能带来新线索。你接受旅途会改变计划，因为发现本身就是抵达的一部分。',mirror:'你倾向于被未知和新体验吸引，愿意尝试不同路线，也享受重新认识世界的过程。',strength:'在陌生情境里保持开放，迅速发现可尝试的方向。',edge:'冒险不等于忽略风险；带上一份可回撤的计划，才能走得更远。',mission:'尝试一个平时不会选的小路线、小主题或新技能。',color:'#a7c8ff',deep:'#24234e'},
    {id:'strategist',name:'乱世执棋人',theme:'build',place:'云阙城 · 观星棋阁',tags:['远见','谋划','决断'],gift:'为复杂局面找到下一步',quote:'落子之前看清全局，落子之后承担选择。',story:'暮色里的棋阁只有一盏灯。你整理情报、推演变化，也知道有时最好的行动不是向前，而是等待更好的时机。你没有操控所有人的愿望，只希望在纷乱中做出经得起检验的判断。',mirror:'你偏向规划、权衡和长期目标，重视选择带来的后续影响，而不只看眼前的得失。',strength:'梳理约束与优先级，提前准备多条可行路径。',edge:'计划是为了帮助行动，不是为了控制一切；给意外留出余地。',mission:'为一个近期目标写下三步行动，以及一个备选方案。',color:'#e3c68c',deep:'#3e3235'},
    {id:'library',name:'午夜图书馆馆长',theme:'mind',place:'永夜之城 · 无尽书库',tags:['求知','深邃','联想'],gift:'让知识之间产生新的连接',quote:'有人寻找答案，而你愿意认真读懂问题。',story:'当城市沉睡，图书馆的灯仍亮着。你从一本旧书走向另一页批注，把不同年代、不同领域的故事连成新的理解。这里没有必须立刻得到的结论，只有一个又一个值得追问的问题。',mirror:'你倾向于积累理解、寻找事物背后的意义，享受知识慢慢形成体系的过程。',strength:'串联零散信息，在表面无关的故事里发现共同线索。',edge:'理解不必永远停在准备阶段；可以先用学到的一点东西做个小尝试。',mission:'把最近学到的一件事用三句话讲给自己听。',color:'#d5b7f3',deep:'#30213e'},

  answers.forEach((a,i)=>{
    const id=D.questions[i][a+1][0];
    counts[id]++;last[id]=i;themes[byId[id].theme]++;
  });
  const synergy=Object.fromEntries(D.profiles.map(p=>[p.id, counts[p.id]*10 + themes[p.theme]*1.6]));
  const rank=D.profiles.map(p=>p.id).sort((a,b)=>synergy[b]-synergy[a]||counts[b]-counts[a]||(last[b]??-1)-(last[a]??-1)||a.localeCompare(b));
  const topScore=synergy[rank[0]];
  // Map top synergy (typically 35..105) to intuitive 82%..98% cosmic resonance index
  const resonance=Math.round(Math.max(82,Math.min(98, 72 + (topScore/95)*28)));
  const secondResonance=Math.max(70, Math.min(resonance-3, Math.round(72 + (synergy[rank[1]]/95)*28)));
  return {
    first:byId[rank[0]], second:byId[rank[1]], counts, themes, synergy,
    resonance, secondResonance, tie:Math.abs(synergy[rank[0]]-synergy[rank[1]])<1e-6
  };
}

function imgLoad(src){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=src;});}
function roundRectPath(ctx,x,y,w,h,r){
  ctx.beginPath();
  if(typeof ctx.roundRect==='function') ctx.roundRect(x,y,w,h,r);
  else{r=Math.min(r,w/2,h/2);ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
}

    canvas.toBlob(b=>{if(b) blobUrl=URL.createObjectURL(b);},'image/png');
    dialog.querySelector('#png-save').onclick=()=>{
      const a=document.createElement('a');a.href=blobUrl||dataUrl;a.download=`平行人生-${p.name}.png`;
      document.body.append(a);a.click();a.remove();
    };
    dialog.querySelector('#png-close').onclick=()=>dialog.close();
    dialog.onclose=()=>{if(blobUrl) URL.revokeObjectURL(blobUrl);dialog.remove();};
    document.body.append(dialog);dialog.showModal();
    status('✓ 分享卡片已生成（1080 × 1440）');
  }catch(e){
    status('当前环境不支持生成卡片，可直接截图保存结果页。');console.error(e);
  }finally{btn.disabled=false;}
}

restore();home();
})();
</script>
</body>
</html>
