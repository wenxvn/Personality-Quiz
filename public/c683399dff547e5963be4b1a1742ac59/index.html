<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#165b55">
<meta name="description" content="你的灵魂老家在哪座城市 · 原创高质感趣味探索测试，无需登录，数据仅在本地浏览器处理。">
<title>你的灵魂老家在哪座城市</title>
<style>
:root{
  --ink:#1b3532;--accent:#165b55;--accent2:#c79248;--paper:#f5f3ea;
  --soft:#e1ece3;--line:#cdd9ce;--card:#fffdf8;--muted:#566b65;
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.68;-webkit-tap-highlight-color:transparent;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:
  radial-gradient(ellipse at 92% 0%,var(--soft),transparent 58%),
  radial-gradient(ellipse at 8% 100%,color-mix(in srgb,var(--accent2) 13%,transparent),transparent 52%);z-index:-1}
main{width:min(100%,660px);padding:18px 16px max(32px,env(safe-area-inset-bottom));margin:auto}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 16px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.brand{font-size:11px;letter-spacing:2.4px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:6px}
.brand::before{content:"✦";color:var(--accent2);font-size:13px}
.issue{font-size:11px;color:var(--muted);white-space:nowrap;letter-spacing:.05em}
section.panel{border:1px solid var(--line);border-radius:26px;background:var(--card);padding:clamp(18px,4.2vw,30px);box-shadow:0 22px 54px rgba(32,24,20,.08);overflow:hidden;animation:enter .28s cubic-bezier(.22,1,.36,1)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1,h2,h3,p{margin:0}
h1{font-family:var(--serif);font-size:clamp(30px,7.8vw,46px);font-weight:800;line-height:1.26;letter-spacing:.03em}
h2{font-family:var(--serif);font-size:clamp(21px,5.2vw,27px);line-height:1.48;font-weight:700}
h3{font-family:var(--serif);font-size:17px;margin-bottom:9px;font-weight:700}
.eyebrow{color:var(--accent);font-size:11px;letter-spacing:2.2px;font-weight:800;margin:16px 0 8px;text-transform:uppercase}
.lead{font-size:15px;line-height:1.85;margin:12px 0 18px;color:color-mix(in srgb,var(--ink) 86%,var(--muted))}
.muted{font-size:12px;color:var(--muted)}
.hero{position:relative;isolation:isolate;height:clamp(176px,46vw,230px);background:var(--accent);border-radius:18px;overflow:hidden;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.hero svg{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 0%,rgba(0,0,0,.42) 100%);z-index:-1}
.hero-badge{position:absolute;top:14px;right:14px;padding:4px 10px;border-radius:99px;border:1px solid rgba(255,255,255,.45);background:rgba(0,0,0,.22);backdrop-filter:blur(6px);font-size:10px;letter-spacing:1.6px;font-weight:700;color:#fff}
.hero-copy{position:absolute;bottom:16px;left:18px;right:16px}
.hero-copy small{font-size:10px;letter-spacing:3px;opacity:.92;display:block;margin-bottom:2px}
.hero-copy strong{display:block;font-family:var(--serif);font-size:clamp(24px,6vw,34px);letter-spacing:3px;line-height:1.25}
.pills{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 20px}
.pill{font-size:12px;padding:5px 12px;border:1px solid var(--line);border-radius:100px;background:var(--paper);color:var(--ink);font-weight:500}
.pill.accent{border-color:color-mix(in srgb,var(--accent) 32%,var(--line));background:var(--soft);color:var(--accent);font-weight:700}
.teaser-wrap{margin:20px 0 22px;padding-top:16px;border-top:1px dashed var(--line)}
.teaser-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.teaser-head span{font-size:11px;letter-spacing:1.4px;color:var(--accent);font-weight:800}
.teaser-head small{font-size:11px;color:var(--muted)}
.teasers{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.teaser{padding:12px 10px;border-radius:14px;background:var(--paper);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.teaser b{font-family:var(--serif);font-size:15px;color:var(--ink)}
.teaser span{font-size:11px;color:var(--accent);font-weight:600}
.teaser small{font-size:11px;color:var(--muted);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 16px;min-height:48px;touch-action:manipulation;transition:transform .12s,border-color .18s,background .18s,box-shadow .18s}
button:active:not(:disabled){transform:scale(.988)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.4;cursor:not-allowed}
.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:750;width:100%;text-align:center;box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 26%,transparent)}
.primary:hover:not(:disabled){filter:brightness(1.06)}
.secondary{width:100%;text-align:center;background:var(--paper)}
.subtle{background:transparent;border:0;text-align:center;color:var(--muted);font-size:12px;padding:8px;min-height:36px}
.subtle:hover{color:var(--accent)}
.stack{display:grid;gap:10px}
.actions-row{display:grid;grid-template-columns:1.25fr 1fr;gap:10px}
.notice{font-size:12px;color:var(--muted);line-height:1.72;margin-top:16px}
.question-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--accent);font-weight:750;letter-spacing:.06em}
.auto-toggle{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--paper);color:var(--muted);font-size:11px;font-weight:600;min-height:28px;cursor:pointer}
.auto-toggle.on{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));color:var(--accent);background:var(--soft)}
.progress{height:6px;background:var(--soft);overflow:hidden;border-radius:12px;margin:11px 0 18px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:12px;transition:width .28s cubic-bezier(.22,1,.36,1)}
.chapter-bar{display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:14px;background:var(--paper);border:1px solid var(--line);margin-bottom:20px}
.chapter-num{font-family:var(--serif);font-size:20px;font-weight:800;color:var(--accent2);line-height:1}
.chapter-bar strong{display:block;font-size:13px;color:var(--ink)}
.chapter-bar span{display:block;font-size:11px;color:var(--muted);line-height:1.45}
.options{display:grid;gap:10px;margin:20px 0 22px}
.option{display:flex;text-align:left;align-items:center;gap:12px;min-height:60px;width:100%;padding:13px 14px;line-height:1.55;background:var(--card)}
.option .letter{display:grid;place-items:center;flex:0 0 30px;height:30px;border-radius:10px;background:var(--paper);color:var(--accent);font-weight:800;font-size:12px;border:1px solid var(--line);transition:all .18s}
.option.selected{border-color:var(--accent);box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 16%,transparent),inset 0 0 0 1px var(--accent);background:var(--soft)}
.option.selected .letter{background:var(--accent);color:#fff;border-color:var(--accent)}
.option .check{margin-left:auto;color:var(--accent);font-weight:800;font-size:15px}
.nav{display:grid;grid-template-columns:1fr 1.6fr;gap:10px}
/* Calculating ritual screen */
.calc-box{text-align:center;padding:34px 10px 26px}
.calc-ring{width:66px;height:66px;margin:0 auto 20px;border-radius:50%;border:3px solid var(--soft);border-top-color:var(--accent);border-right-color:var(--accent2);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.calc-step{font-family:var(--serif);font-size:19px;color:var(--ink);margin-bottom:8px;min-height:1.6em}
.calc-sub{font-size:12px;color:var(--muted)}
/* Result Cover */
.result-cover{border:1px solid var(--line);border-radius:20px;padding:14px;background:var(--paper);position:relative}
.result-cover .hero{height:168px}
.result-stamp{position:absolute;top:24px;right:24px;padding:5px 11px;border:1.5px solid rgba(255,255,255,.78);border-radius:8px;font-family:var(--serif);font-size:11px;letter-spacing:2px;color:#fff;background:rgba(0,0,0,.22);backdrop-filter:blur(4px);transform:rotate(3deg)}
.result-name-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:6px 0 8px}
.result-name{font-family:var(--serif);font-size:clamp(34px,8.8vw,50px);line-height:1.22;letter-spacing:.03em}
.fit-badge{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border-radius:99px;background:var(--accent);color:#fff;font-size:12px;font-weight:750;white-space:nowrap}
.quote-box{position:relative;margin:12px 0 8px;padding:12px 14px;border-left:3px solid var(--accent2);background:var(--card);border-radius:0 12px 12px 0}
.quote{font-family:var(--serif);font-size:17px;color:var(--accent);line-height:1.62;font-weight:600}
.result-cover .intro{padding:8px 6px 6px}
.block{padding:22px 0;border-bottom:1px solid var(--line)}
.block:last-of-type{border:0;padding-bottom:14px}
.block p{font-size:14.5px;line-height:1.88;color:color-mix(in srgb,var(--ink) 92%,var(--muted))}
.kicker{font-size:10px;letter-spacing:2.2px;color:var(--accent2);font-weight:800;margin-bottom:5px;text-transform:uppercase}
.contrast-card{margin-top:13px;padding:13px 15px;border-radius:14px;background:linear-gradient(135deg,var(--soft),var(--paper));border:1px solid var(--line)}
.contrast-card b{display:block;font-size:12px;color:var(--accent);margin-bottom:4px;letter-spacing:.04em}
.contrast-card p{font-size:13.5px;line-height:1.75}
.axis{margin:15px 0}
.axis-head,.axis-labels{display:flex;justify-content:space-between;gap:10px;font-size:12px}
.axis-head strong{font-size:13px}
.axis-head span{color:var(--accent);font-weight:700}
.axis-labels{color:var(--muted)}
.track{position:relative;height:9px;border-radius:9px;background:var(--soft);margin:8px 0}
.track::before{content:"";position:absolute;left:50%;width:1px;height:9px;background:var(--line)}
.track i{position:absolute;width:16px;height:16px;top:-3.5px;border-radius:50%;background:var(--accent);border:2.5px solid var(--card);box-shadow:0 0 0 1.5px var(--accent);transform:translateX(-50%)}
.rank{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.rank:last-child{border:0}
.rank small{display:block;font-size:11px;color:var(--muted)}
.rank .pct{font-size:12px;font-weight:700;color:var(--accent);background:var(--soft);padding:3px 9px;border-radius:99px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.mini{padding:14px;border-radius:14px;background:var(--paper);border:1px solid var(--line)}
.mini b{display:block;color:var(--accent);font-size:12px;margin-bottom:5px}
.mini .partner-name{font-family:var(--serif);font-size:18px;font-weight:800;color:var(--ink);margin-bottom:4px}
.mini p{font-size:13px;line-height:1.68}
.egg-box{padding:14px 16px;border-radius:14px;background:var(--paper);border:1px dashed var(--accent2);margin-top:10px}
.egg-box b{display:block;font-size:12px;color:var(--accent2);margin-bottom:4px;letter-spacing:.05em}
.egg-box p{font-size:14px}
.status-bar{font-size:12px;color:var(--accent);text-align:center;min-height:1.4em;margin:4px 0 6px;font-weight:600}
.footer{text-align:center;margin:20px 0 0;font-size:11px;color:var(--muted);line-height:1.8}
.poster{width:100%;max-width:360px;margin:10px auto;border-radius:14px;display:block;border:1px solid var(--line);box-shadow:0 12px 30px rgba(0,0,0,.12)}
dialog{width:min(calc(100% - 26px),460px);max-height:90dvh;overflow:auto;border:1px solid var(--line);border-radius:22px;padding:20px;background:var(--card);color:var(--ink);box-shadow:0 24px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(20,16,22,.62);backdrop-filter:blur(3px)}
.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.dialog-head button{min-height:36px;padding:4px 13px;font-size:13px}
.copy-area{width:100%;min-height:150px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:12px;font:inherit;font-size:13px;line-height:1.7;margin:10px 0}
@media(max-width:440px){
  main{padding:14px 12px 28px}
  .teasers{grid-template-columns:1fr}
  .duo,.actions-row{grid-template-columns:1fr}
  .option{font-size:14px}
  .brand{letter-spacing:1.4px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

 洱海边不被打扰的清晨","stamp":"风花 · 旷野"},{"name":"福州","vector":[1,1,1,0],"tag":"温润日常","quote":"日子不必盛大，温暖就好。","insight":"你不迷恋浮夸的虚名，更钟情于有树荫、有老厝、有熟悉味道的安稳日常。你的温柔藏在日复一日的靠谱与体贴里，像四季常青的榕树一样，总能给身边人带来踏实妥帖的安心感。","strength":"善于珍惜熟悉的生活细节","caution":"主动给生活增加一点新鲜感","action":"在古厝街巷慢慢走，找特色小吃","motif":"古厝与绿荫","no":"17","tags":["温润治愈系","人间踏实感","细水长流"],"contrast":"外表温和低调、不爱抢风头，但真正扛事的时候比谁都稳重有韧性。","match":["南京","都是温润有底蕴的慢性子，把寻常日子过出安心的质感。"],"clash":["深圳","你偏好安稳绵长的生活温度，太激进求变的节奏会让你觉得没着落。"],"vibe":"三坊七巷的古厝树影 · 傍晚飘着茉莉茶香的微风","stamp":"榕城 · 温润"},{"name":"天津","vector":[1,3,2,0],"tag":"自在交谈","quote":"聊几句，日子就有了笑意。","insight":"你天生自带“把严肃生活解构出笑意”的魔法。比起紧绷着演大人，你更喜欢自在交谈、相视一笑的松弛氛围。老街的烟火与朋友间的互相接梗，就是你抵御一切疲惫的解药。","strength":"善于通过对话拉近距离","caution":"也留意独处的真实需求","action":"沿老建筑街区走走，和朋友吃饭","motif":"老街与笑语","no":"18","tags":["松弛幽默感","聊天天花板","通透乐天"],"contrast":"嘴上总爱开玩笑、看似大大咧咧，其实极其通透善良，最懂怎么不露痕迹地给人台阶下。","match":["成都","幽默松弛遇上安逸烟火，凑一块每天笑声不断、毫无内耗。"],"clash":["宁波","你爱随时抛梗互动，遇到极度安静内敛的类型会忍不住想逗对方说话。"],"vibe":"海河边的落日晚风 · 老友相聚笑声不断的餐桌","stamp":"津门 · 乐活"},{"name":"宁波","vector":[2.2,0.0,1.5,2.0],"tag":"安静进取","quote":"安静地走，坚定地向前。","insight":"你是典型的“悄悄拔尖、不爱张扬”型灵魂。你看重独立的私人空间与实打实的效率，讨厌无意义的社交表演；既能安安静静推进自己的目标，也懂得用精致的小众审美犒劳自己。","strength":"能在安静中持续推进目标","caution":"别忘了邀请他人分享成果","action":"探访海港街区和设计空间","motif":"海港与微光","no":"19","tags":["清醒实干派","安静进阶","低耗能生活"],"contrast":"表面冷静克制、自带高冷气场，熟了之后才发现你不仅靠谱，还藏着冷幽默。","match":["深圳","高效独立又不互相消耗，是彼此最省心的神仙搭子。"],"clash":["天津","一个偏爱安静专注，一个偏爱热闹唠嗑，需要提前商量社交时间。"],"vibe":"静谧海港的晨光 · 一个人高效专注的书桌与咖啡","stamp":"港城 · 笃行"},{"name":"珠海","vector":[1,0,0,3],"tag":"清爽新生活","quote":"给生活留一片开阔的蓝。","insight":"你既想要山海的开阔清澈，又割舍不下现代生活的清爽便捷。你不喜欢拥挤嘈杂，也不想退回原始闭塞——一条干净的海岸骑行道、一片蓝得发亮的天空和不被打扰的独处半径，就是你的乌托邦。","strength":"懂得为自己选择舒适的生活半径","caution":"注意理想场景之外的实际需求","action":"沿海骑行或散步，再去现代公共空间","motif":"海岸与蓝天","no":"20","tags":["清澈留白控","轻盈现代派","低密度幸福"],"contrast":"看着清冷随性、像个极简主义者，其实对生活品质和细节体验有着极高的隐形标准。","match":["深圳","同属海风现代系，一个提供能量一个提供治愈，切换自如。"],"clash":["西安","你偏爱清爽留白的新世界，太密集厚重的市井历史感偶尔会觉得太满。"],"vibe":"情侣路的单车晚风 · 落地窗外开阔清澈的蓝天","stamp":"海湾 · 留白"}],"brand":"CIT const app=document.getElementById('app'),
      posterDialog=document.getElementById('posterDialog'),
      copyDialog=document.getElementById('copyDialog');
const N=D.questions.length, STORAGE='personal-atlas-v3:'+D.kind;
let idx=0, answers=Array(N).fill(null), report=null, posterURL=null, screen='home', autoNext=true, autoTimer=null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function stash(){try{localStorage.setItem(STORAGE,JSON.stringify({idx,answers,autoNext}))}catch{}}
function restore(){
  try{
    const s=JSON.parse(localStorage.getItem(STORAGE));
    if(s&&Array.isArray(s.answers)&&s.answers.length===N&&s.answers.every(x=>x===null||Number.isInteger(x)&&x>=0&&x<=3)&&Number.isInteger(s.idx)&&s.idx>=0&&s.idx<N){
      if(typeof s.autoNext==='boolean') autoNext=s.autoNext;
      return s;
    }
  }catch{}
  return null;
}
function clearSaved(){try{localStorage.removeItem(STORAGE)}catch{}}
function scrollTop(){window.scrollTo({top:0,behavior:'instant'})}
function focusTitle(){let h=app.querySelector('h1,h2');if(h){h.tabIndex=-1;h.focus({preventScroll:true})}}
function hero(text,sub=D.heroSub,badge=''){
  return `<div class="hero" aria-hidden="true">${D.art}${badge?`<span class="hero-badge">${esc(badge)}</span>`:''}<div class="hero-copy"><small>${esc(sub)}</small><strong>${esc(text)}</strong></div></div>`;
}

function home(){
  if(autoTimer){clearTimeout(autoTimer);autoTimer=null;}
  screen='home';
  const saved=restore(), count=saved?saved.answers.filter(v=>v!==null).length:0;
  const teaserCards=D.teasers.map(name=>D.profiles.find(p=>p.name===name)).filter(Boolean);
  app.innerHTML=`<section class="panel">
    ${hero(D.heroTitle,D.heroSub,D.profiles.length+' 种档案')}
    <p class="eyebrow">${esc(D.subtitle)}</p>
    <h1>${esc(D.title)}</h1>
    <p class="lead">${esc(D.intro)}</p>
    <div class="pills">
      <span class="pill accent">${N} 道情境探索</span>
      <span class="pill">${D.profiles.length} 种专属档案</span>
      <span class="pill">约 ${Math.max(2,Math.ceil(N/8))} 分钟 · 含3:4海报</span>
    </div>
    <div class="stack">
      ${count===N
        ? `<button class="primary" onclick="resume()">查看我已生成的专属档案　✦</button><button class="secondary" onclick="start()">重新测一次</button>`
        : count
        ? `<button class="primary" onclick="resume()">继续上次探索（${count}/${N}）　→</button><button class="secondary" onclick="start()">重新开始测试</button>`
        : `<button class="primary" onclick="start()">开启我的探索　→</button>`}
    </div>
    <div class="teaser-wrap">

function start(){
  if(screen==='home'&&restore()?.answers.some(v=>v!==null)&&!confirm('开始新测试将清除上次进度，继续吗？')) return;
  idx=0;answers=Array(N).fill(null);report=null;stash();question(true);
}

function resume(){
  const saved=restore();if(!saved)return start();
  idx=saved.idx;answers=saved.answers;
  if(answers.every(v=>v!==null)){result();return;}
  if(answers.slice(0,idx).some(v=>v===null)) idx=answers.indexOf(null);
  question(true);
}

function toggleAuto(){
  autoNext=!autoNext;stash();question(false);
}

function getChapter(qIdx){
  const chs=D.chapters;
  const per=Math.ceil(N/chs.length);
  const ci=Math.min(chs.length-1,Math.floor(qIdx/per));
  return {num:String(ci+1).padStart(2,'0'),...chs[ci]};
}

function question(move=false){
  if(autoTimer){clearTimeout(autoTimer);autoTimer=null;}
  screen='question';

function choose(i){
  if(screen!=='question'||!Number.isInteger(i)||i<0||i>3) return;
  answers[idx]=i;stash();
  // Immediate visual feedback without losing smooth flow
  const btns=app.querySelectorAll('.option');
  btns.forEach((b,k)=>{
    const sel=k===i;
    b.classList.toggle('selected',sel);
    b.setAttribute('aria-pressed',String(sel));
    let ck=b.querySelector('.check');
    if(sel&&!ck){ck=document.createElement('span');ck.className='check';ck.setAttribute('aria-hidden','true');ck.textContent='✓';b.append(ck);}
    if(!sel&&ck) ck.remove();
  });
  const nextBtn=app.querySelector('.nav .primary');
  if(nextBtn) nextBtn.disabled=false;
  const count=answers.filter(v=>v!==null).length;
  const pct=Math.round((count/N)*100);
  const bar=app.querySelector('.progress i');
  if(bar) bar.style.width=Math.max(4,pct)+'%';
  if(autoNext){
    if(autoTimer) clearTimeout(autoTimer);
    autoTimer=setTimeout(()=>{
      autoTimer=null;
      if(idx<N-1){idx++;stash();question(true);}
      else if(answers.some(v=>v===null)){idx=answers.indexOf(null);stash();question(true);}
      else calculateRitual();
    }, 300);
  }
}

function back(){if(idx>0){idx--;stash();question(true);}}
function next(){
  if(answers[idx]===null) return;
  if(idx<N-1){idx++;stash();question(true);}
  else if(answers.some(v=>v===null)){idx=answers.indexOf(null);stash();question(true);}
  else calculateRitual();
}

function calculateRitual(){

  scrollTop();

function compute(input){
  if(input.length!==N||input.some(v=>!Number.isInteger(v)||v<0||v>3)) throw Error('Incomplete answers');
  const sums=D.axes.map(()=>0), counts=D.axes.map(()=>0);
  D.questions.forEach((q,i)=>{sums[q.axis]+=q.options[input[i]].score;counts[q.axis]++;});
  const v=sums.map((s,i)=>s/counts[i]);
  const ranked=D.profiles.map((p,i)=>{
    const center=p.vector.map(x=>x-1.5);
    const norm=Math.hypot(...center)||1;
    const radius=Math.sqrt(v.length)*0.5+0.15*(norm-Math.sqrt(v.length));
    const calibrated=center.map(x=>1.5+x*radius/norm);
    const d=calibrated.reduce((s,x,j)=>s+(x-v[j])**2,0);
    // Smooth intuitive affinity score (high contrast & realistic 72%~98% range for top matches)
    const rawSim=Math.max(0,1-Math.sqrt(d/(4.2*v.length)));
    const fit=Math.round(Math.max(62,Math.min(98,66+rawSim*32)));
    return {p,i,d,fit};
  });
  ranked.sort((a,b)=>a.d-b.d||a.i-b.i);
  // Ensure strict monotonic visual display for top 4
  for(let k=1;k<Math.min(4,ranked.length);k++){
    if(ranked[k].fit>=ranked[k-1].fit) ranked[k].fit=Math.max(60,ranked[k-1].fit-2);
  }
  return {v,ranked,p:ranked[0].p};
}

function tendency(a,v){return v<1.15?a[1]:v>1.85?a[2]:'两者兼顾'}

function wrap(ctx,text,max){
  const out=[];let line='';
  for(const ch of text){
    if(line&&ctx.measureText(line+ch).width>max){out.push(line);line=ch;}
    else line+=ch;
  }
  if(line) out.push(line);
  return out;
}
function roundedPath(ctx,x,y,w,h,r){
  ctx.beginPath();
  if(typeof ctx.roundRect==='function') ctx.roundRect(x,y,w,h,r);
  else{r=Math.min(r,w/2,h/2);ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
}
function fillRound(ctx,x,y,w,h,r){roundedPath(ctx,x,y,w,h,r);ctx.fill();}
function strokeRound(ctx,x,y,w,h,r){roundedPath(ctx,x,y,w,h,r);ctx.stroke();}

function makePoster(){
  const c=document.createElement('canvas');c.width=1080;c.height=1440;
  const ctx=c.getContext('2d');if(!ctx) throw Error('Canvas unavailable');
  const {p,v,ranked}=report, P=D.palette;
  const sans='"PingFang SC","Microsoft YaHei",sans-serif', serif='"Noto Serif SC","Songti SC","SimSun",serif';

  // Paper backdrop & elegant outer double frame
  ctx.fillStyle=P.paper;ctx.fillRect(0,0,1080,1440);
  ctx.strokeStyle=P.line;ctx.lineWidth=2;strokeRound(ctx,26,26,1028,1388,30);

  // Header card (editorial rich banner)
  const grad=ctx.createLinearGradient(52,52,1028,372);
  grad.addColorStop(0,P.accent);grad.addColorStop(1,P.ink);
  ctx.fillStyle=grad;fillRound(ctx,52,52,976,316,26);
  ctx.save();roundedPath(ctx,52,52,976,316,26);ctx.clip();
  ctx.strokeStyle='rgba(255,255,255,0.16)';ctx.lineWidth=2;
  for(let i=0;i<7;i++){ctx.beginPath();ctx.ellipse(905,120,85+i*38,52+i*22,-0.35,0,Math.PI*2);ctx.stroke();}
  ctx.fillStyle=P.accent2;ctx.globalAlpha=0.22;ctx.beginPath();ctx.arc(920,310,130,0,Math.PI*2);ctx.fill();
  ctx.restore();

  // Header typography + collectible stamp
  ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font=`700 22px ${sans}`;
  ctx.fillText(`${D.brand}  ·  ARCHIVE NO.${p.no}`,92,108);
  ctx.fillStyle='#ffffff';ctx.font=`800 72px ${serif}`;
  ctx.fillText(p.name,90,214);
  ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font=`500 28px ${sans}`;
  ctx.fillText(`${p.motif}  ·  灵魂契合度 ${ranked[0].fit}%`,92,276);

  // Stamp badge top right
  const stamp=p.stamp||`NO.${p.no}`;
  ctx.save();ctx.translate(925,112);ctx.rotate(0.06);
  ctx.strokeStyle='rgba(255,255,255,0.75)';ctx.lineWidth=2;strokeRound(ctx,-92,-24,184,48,10);
  ctx.fillStyle='#ffffff';ctx.font=`700 22px ${serif}`;ctx.textAlign='center';
  ctx.fillText(stamp,0,8);ctx.restore();ctx.textAlign='left';

  // Tag pills inside header bottom
  let tx=92;
  p.tags.forEach(t=>{
    const label='# '+t;
    ctx.font=`600 22px ${sans}`;
    const w=ctx.measureText(label).width+34;
    ctx.fillStyle='rgba(255,255,255,0.18)';fillRound(ctx,tx,306,w,40,20);
    ctx.fillStyle='#fff';ctx.fillText(label,tx+17,333);
    tx+=w+14;
  });

  // Quote callout card
  ctx.fillStyle=P.card;fillRound(ctx,52,394,976,120,20);
  ctx.strokeStyle=P.line;ctx.lineWidth=1.5;strokeRound(ctx,52,394,976,120,20);
  ctx.fillStyle=P.accent2;fillRound(ctx,52,394,10,120,5);
  ctx.fillStyle=P.accent;ctx.font=`700 34px ${serif}`;
  const qLines=wrap(ctx,`「${p.quote}」`,900).slice(0,2);
  const qStart=qLines.length===1?466:444;
  qLines.forEach((l,i)=>ctx.fillText(l,86,qStart+i*44));

  // Insight paragraph
  let y=566;
  ctx.fillStyle=P.accent2;ctx.font=`800 21px ${sans}`;
  ctx.fillText('SOUL PORTRAIT  ·  专属解读',70,y);y+=40;
  ctx.fillStyle=P.ink;ctx.font=`400 27px ${sans}`;
  const iLines=wrap(ctx,p.insight,936).slice(0,3);
  iLines.forEach(l=>{ctx.fillText(l,70,y);y+=41;});

  // Axes visualization block
  y+=16;
  ctx.fillStyle=P.card;
  const axisStep=D.axes.length>4?56:72;
  const axisBoxH=56+D.axes.length*axisStep;
  fillRound(ctx,52,y,976,axisBoxH,20);
  ctx.strokeStyle=P.line;ctx.lineWidth=1.5;strokeRound(ctx,52,y,976,axisBoxH,20);
  ctx.fillStyle=P.accent;ctx.font=`800 22px ${sans}`;
  ctx.fillText('偏好维度图谱',82,y+40);
  let ay=y+78;
  D.axes.forEach((a,i)=>{
    ctx.font=`600 21px ${sans}`;ctx.fillStyle=P.ink;ctx.textAlign='left';
    ctx.fillText(`${a[0]} · ${a[1]}`,82,ay);
    ctx.textAlign='right';ctx.fillStyle=P.muted;ctx.fillText(a[2],998,ay);
    ctx.textAlign='left';
    ctx.fillStyle=P.soft;fillRound(ctx,82,ay+13,916,10,5);
    const px=82+916*Math.max(0.03,Math.min(0.97,v[i]/3));
    ctx.fillStyle=P.accent;ctx.beginPath();ctx.arc(px,ay+18,11,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();
    ay+=axisStep;
  });

  // Bottom Duo Cards: Soulmate + Strength
  const duoY=Math.min(1148, y+axisBoxH+22);
  const duoH=186;
  // Left card: Soulmate
  ctx.fillStyle=P.soft;fillRound(ctx,52,duoY,476,duoH,20);
  ctx.fillStyle=P.accent;ctx.font=`800 21px ${sans}`;ctx.fillText('♥ 天选合拍搭子',80,duoY+40);
  ctx.fillStyle=P.ink;ctx.font=`800 34px ${serif}`;ctx.fillText(p.match[0],80,duoY+86);
  ctx.fillStyle=P.muted;ctx.font=`400 21px ${sans}`;
  wrap(ctx,p.match[1],420).slice(0,2).forEach((l,i)=>ctx.fillText(l,80,duoY+124+i*30));

  // Right card: Hidden contrast or highlight
  ctx.fillStyle=P.card;fillRound(ctx,552,duoY,476,duoH,20);
  ctx.strokeStyle=P.line;ctx.lineWidth=1.5;strokeRound(ctx,552,duoY,476,duoH,20);
  ctx.fillStyle=P.accent2;ctx.font=`800 21px ${sans}`;ctx.fillText('✦ 你的闪光亮点',580,duoY+40);
  ctx.fillStyle=P.ink;ctx.font=`600 25px ${serif}`;
  wrap(ctx,p.strength,420).slice(0,2).forEach((l,i)=>ctx.fillText(l,580,duoY+84+i*34));
  ctx.fillStyle=P.muted;ctx.font=`400 20px ${sans}`;
  const eggShort=p.egg||p.vibe||'';
  wrap(ctx,eggShort,420).slice(0,1).forEach(l=>ctx.fillText('· '+l,580,duoY+158));

  // Footer strip
  ctx.fillStyle=P.muted;ctx.font=`500 22px ${sans}`;
  ctx.fillText(`${D.title}  ·  长按保存分享`,60,1388);
  ctx.textAlign='right';ctx.fillText('原创趣味探索 · 非专业心理测评',1020,1388);
  ctx.textAlign='left';
  return c;
}

function showPoster(){
  if(!report) return;
  const status=document.getElementById('posterStatus'),
        area=document.getElementById('posterArea'),
        download=document.getElementById('downloadPoster');
  status.textContent='';area.innerHTML='';download.disabled=true;
  try{
    if(posterURL) URL.revokeObjectURL(posterURL);
    posterURL=null;
    const canvas=makePoster();
    const img=document.createElement('img');
    img.className='poster';img.alt='可保存的专属结果海报';
    img.src=canvas.toDataURL('image/png');
    area.append(img);
    canvas.toBlob(blob=>{
      posterURL=blob?URL.createObjectURL(blob):img.src;
      download.disabled=false;
    },'image/png');
    if(!posterDialog.open) posterDialog.showModal();
  }catch(e){
    status.textContent='当前浏览器不支持生成海报，可直接截图保存结果页。';
    if(!posterDialog.open) posterDialog.showModal();
  }
}

document.getElementById('closePoster').onclick=()=>posterDialog.close();
document.getElementById('downloadPoster').onclick=()=>{
  if(!posterURL||!report) return;
  const a=document.createElement('a');a.href=posterURL;a.download=D.kind+'-'+report.p.name+'.png';
  document.body.append(a);a.click();a.remove();
  document.getElementById('posterStatus').textContent='若微信/小红书内未自动下载，请直接长按上方图片保存。';
};
document.getElementById('closeCopy').onclick=()=>copyDialog.close();
document.getElementById('selectCopyBtn').onclick=()=>{
  const ta=document.getElementById('copyTextarea');ta.focus();ta.select();
};
home();
</script>
