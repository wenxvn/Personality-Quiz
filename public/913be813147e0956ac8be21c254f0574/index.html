<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b85437">
<meta name="description" content="如果不用上班，你天生适合开一家什么小店 · 24道理想生活选择，领取你的专属复古个体营业执照、店主经营雷达与3:4街角小店海报。">
<title>如果不用上班，你天生适合开一家什么小店 · DREAM SHOP LAB</title>
<style>
:root{
  --bg:#efe8da;--paper:#faf5eb;--card:#fffdf7;--ink:#2b211b;--muted:#756558;
  --accent:#b85437;--sage:#2d5e4e;--mustard:#d49735;--line:#ded2be;--soft:#f2eadb;
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --mono:"SF Mono","Menlo","Monaco","Consolas",monospace;
  --sans:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.68;-webkit-tap-highlight-color:transparent;min-height:100vh;
  background-image:linear-gradient(90deg,rgba(184,84,55,.045) 1px,transparent 1px),linear-gradient(rgba(184,84,55,.045) 1px,transparent 1px);background-size:28px 28px}
main{width:min(100%,660px);padding:14px 14px max(28px,env(safe-area-inset-bottom));margin:auto}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 12px;padding-bottom:10px;border-bottom:1.5px solid var(--line)}
.brand{font-family:var(--mono);font-size:11px;letter-spacing:2px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:6px}
.brand::before{content:"☀";font-size:14px;color:var(--mustard)}
.issue{font-family:var(--mono);font-size:10.5px;color:var(--muted);white-space:nowrap;letter-spacing:.04em}
.sound-btn{background:var(--card);border:1.5px solid var(--line);color:var(--accent)}
section.panel{border:1.5px solid var(--line);border-radius:24px;background:var(--card);padding:clamp(16px,4vw,28px);box-shadow:0 20px 52px rgba(43,33,27,.10);overflow:hidden;animation:enter .3s cubic-bezier(.22,1,.36,1)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1,h2,h3,p{margin:0}
h1{font-family:var(--serif);font-size:clamp(25px,6.3vw,38px);font-weight:800;line-height:1.28;letter-spacing:.02em;color:var(--ink);text-wrap:balance}
h2{font-family:var(--serif);font-size:clamp(20px,5vw,25px);line-height:1.48;font-weight:700}
h3{font-family:var(--serif);font-size:17px;margin-bottom:9px;font-weight:700}
.eyebrow{font-family:var(--mono);color:var(--accent);font-size:10.5px;letter-spacing:1.8px;font-weight:800;margin:13px 0 6px;text-transform:uppercase}
.lead{font-size:14px;line-height:1.78;margin:9px 0 14px;color:#4a3c33;text-wrap:pretty}
.muted{font-size:12px;color:var(--muted)}
.hero{position:relative;isolation:isolate;height:clamp(166px,42vw,230px);background:#2d5e4e;border-radius:18px;overflow:hidden;color:#fff;border:1.5px solid rgba(43,33,27,.18)}
.hero svg{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(24,18,14,.04) 0%,rgba(24,18,14,.58) 100%);z-index:-1}
.hero-badge{position:absolute;top:12px;right:12px;padding:4px 10px;border-radius:99px;border:1px solid rgba(255,244,224,.55);background:rgba(43,33,27,.5);backdrop-filter:blur(6px);font-family:var(--mono);font-size:10px;letter-spacing:1.2px;font-weight:700;color:#fff7e8}
.hero-copy{position:absolute;bottom:14px;left:16px;right:16px}
.hero-copy small{font-family:var(--mono);font-size:9.5px;letter-spacing:2.2px;color:#f6dca8;display:block;margin-bottom:2px}
.hero-copy strong{display:block;font-family:var(--serif);font-size:clamp(22px,5.6vw,32px);letter-spacing:2.5px;line-height:1.22}
.open-sway{transform-origin:396px 140px;animation:openSway 3.4s ease-in-out infinite alternate}
@keyframes openSway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.steam-curl{animation:steamUp 4.5s ease-in-out infinite alternate}
@keyframes steamUp{from{transform:translateY(5px);opacity:.25}to{transform:translateY(-8px);opacity:.72}}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 15px}
.pill{font-size:11.5px;padding:4px 11px;border:1px solid var(--line);border-radius:99px;background:var(--paper);color:var(--ink);font-weight:600}
.pill.accent{border-color:rgba(184,84,55,.35);background:#faebe5;color:var(--accent);font-weight:700}
.teaser-wrap{margin:15px 0 12px;padding-top:13px;border-top:1.5px dashed var(--line)}
.teaser-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
.teaser-head span{font-family:var(--mono);font-size:11px;letter-spacing:1px;color:var(--sage);font-weight:800}
.teaser-head small{font-size:11px;color:var(--muted)}
.teasers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.teaser{padding:0 0 9px;border-radius:12px;background:var(--paper);border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column;text-align:left}
.teaser:hover{border-color:var(--accent);box-shadow:0 6px 16px rgba(43,33,27,.08)}
.teaser-awning{height:9px;width:100%}
.teaser-in{padding:8px 8px 0;display:flex;flex-direction:column;gap:3px}
.teaser b{font-family:var(--serif);font-size:12.5px;color:var(--ink);line-height:1.32}
.teaser span{font-family:var(--mono);font-size:9.5px;color:var(--accent);font-weight:700}
.teaser small{font-size:10px;color:var(--muted);line-height:1.38;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:var(--card);border:1.5px solid var(--line);border-radius:13px;padding:12px 15px;min-height:46px;touch-action:manipulation;transition:transform .12s,border-color .18s,background .18s,box-shadow .18s}
button:active:not(:disabled){transform:scale(.986)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.38;cursor:not-allowed}
.primary{background:linear-gradient(135deg,#c75e3e,#a6472b);color:#fffdf8;border-color:var(--accent);font-weight:800;width:100%;text-align:center;box-shadow:0 8px 20px rgba(184,84,55,.26)}
.primary:hover:not(:disabled){filter:brightness(1.06)}
.secondary{width:100%;text-align:center;background:var(--paper);font-weight:700}
.subtle{background:transparent;border:0;text-align:center;color:var(--muted);font-size:12px;padding:7px;min-height:34px}
.subtle:hover{color:var(--accent)}
.stack{display:grid;gap:9px}
.actions-row{display:grid;grid-template-columns:1.25fr 1fr;gap:10px}
.notice{font-size:11.5px;color:var(--muted);line-height:1.66;margin-top:12px}
/* Quiz */
.question-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;color:var(--sage);font-weight:800}
.auto-toggle{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--paper);color:var(--muted);font-family:var(--sans);font-size:11px;font-weight:700;min-height:28px}
.auto-toggle.on{border-color:var(--sage);color:var(--sage);background:#e7f2ed}
.progress{height:6px;background:var(--soft);overflow:hidden;border-radius:12px;margin:9px 0 8px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--sage),var(--mustard));border-radius:12px;transition:width .28s cubic-bezier(.22,1,.36,1)}
.chapter-dots span{background:var(--sage)}
.chapter-bar{display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:12px;background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--mustard);margin:10px 0 18px}
.chapter-num{font-family:var(--serif);font-size:20px;font-weight:800;color:var(--accent);line-height:1}
.chapter-bar strong{display:block;font-size:13px;color:var(--ink)}
.chapter-bar span{display:block;font-size:11.5px;color:var(--muted);line-height:1.45}
.options{display:grid;gap:10px;margin:18px 0 20px}
.option{display:flex;text-align:left;align-items:center;gap:12px;min-height:58px;width:100%;padding:12px 14px;line-height:1.52;background:var(--card)}
.option .letter{display:grid;place-items:center;flex:0 0 29px;height:29px;border-radius:9px;background:var(--paper);color:var(--accent);font-family:var(--mono);font-weight:800;font-size:12px;border:1px solid var(--line);transition:all .16s}
.option.selected{border-color:var(--accent);background:#fcf0ea;box-shadow:0 4px 14px rgba(184,84,55,.15),inset 0 0 0 1px var(--accent);transform:translateX(2px)}
.option.selected .letter{background:var(--accent);color:#fff;border-color:var(--accent)}
.option .check{margin-left:auto;color:var(--accent);font-weight:800;font-size:15px}
.nav{display:grid;grid-template-columns:1fr 1.6fr;gap:10px}
/* Ritual */
.calc-box{text-align:center;padding:34px 10px 26px}
.sign-hang{width:130px;margin:0 auto 20px;transform-origin:top center;animation:swing 1.15s ease-in-out infinite alternate}
.sign-rope{width:64px;height:22px;margin:0 auto;border-left:2px solid var(--ink);border-right:2px solid var(--ink);transform:perspective(40px) rotateX(35deg)}
.sign-board{background:var(--sage);color:#fff8eb;border:2.5px solid var(--ink);border-radius:10px;padding:10px 8px;font-family:var(--mono);font-weight:900;font-size:18px;letter-spacing:3px;box-shadow:0 8px 18px rgba(43,33,27,.16)}
.sign-board small{display:block;font-size:9px;letter-spacing:1.4px;color:#f6dca8;margin-top:2px;font-weight:700}
@keyframes swing{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.calc-step{font-family:var(--serif);font-size:19px;color:var(--ink);margin-bottom:8px;min-height:1.6em}
.calc-sub{font-size:12px;color:var(--muted)}
/* Result Shopfront */
.license-card{border:2px solid var(--ink);border-radius:18px;overflow:hidden;background:var(--paper);position:relative;box-shadow:0 10px 28px rgba(43,33,27,.10)}
.shopfront-visual{width:100%;display:block;background:#261e19;border-bottom:2px solid var(--ink)}
.shopfront-visual svg{width:100%;height:auto;display:block}
.license-body{padding:18px 18px 16px;position:relative}
.lic-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;color:var(--muted);padding-bottom:10px;border-bottom:1px dashed var(--line)}
.fit-badge{padding:3px 10px;border-radius:99px;background:var(--shop-accent,var(--accent));color:#fff;font-weight:800;font-size:11px}
.shop-name{font-family:var(--serif);font-size:clamp(24px,6.4vw,35px);font-weight:800;line-height:1.28;color:var(--ink);margin:10px 0 8px;padding-right:74px}
.official-stamp{position:absolute;top:46px;right:14px;width:72px;height:72px;border-radius:50%;border:2.5px solid #c63b2d;color:#c63b2d;display:grid;place-items:center;text-align:center;font-family:var(--serif);font-size:11px;font-weight:900;line-height:1.2;transform:rotate(11deg);background:rgba(250,245,235,.88);box-shadow:inset 0 0 0 2px rgba(198,59,45,.25)}
.lic-grid{display:grid;gap:7px;margin:12px 0;padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.lic-row{display:grid;grid-template-columns:76px 1fr;gap:8px;font-size:13px;line-height:1.55}
.lic-row span{font-family:var(--mono);font-size:11px;font-weight:800;color:var(--shop-accent,var(--accent));padding-top:2px}
.lic-row strong{color:var(--ink);font-weight:700}
.quote-box{margin-top:12px;padding:11px 14px;border-left:4px solid var(--mustard);background:var(--card);border-radius:0 10px 10px 0;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.quote{font-family:var(--serif);font-size:16px;color:var(--shop-accent,var(--accent));line-height:1.65;font-weight:700}
.block{padding:20px 0;border-bottom:1.5px dashed var(--line)}
.block:last-of-type{border:0;padding-bottom:10px}
.block p{font-size:14.5px;line-height:1.86;color:#3d3028}
.kicker{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--mustard);font-weight:800;margin-bottom:4px;text-transform:uppercase}
.talent-card{margin-top:13px;padding:14px 15px;border-radius:13px;background:#eef6f1;border:1.5px solid #bdd9cb}
.talent-card b{display:block;font-family:var(--mono);font-size:11.5px;color:#225944;margin-bottom:4px;letter-spacing:.05em}
.talent-card p{font-size:13.5px;line-height:1.78;color:#203a30}
.guest-card{margin-top:12px;padding:14px 15px;border-radius:13px;background:var(--paper);border:1.5px dashed var(--mustard)}
.guest-card b{display:block;font-family:var(--mono);font-size:11.5px;color:#996515;margin-bottom:5px}
.guest-card p{font-size:13.5px;line-height:1.78;color:#47382b}
.radar-wrap{background:var(--paper);border:1px solid var(--line)}
.axis{margin:14px 0}
.axis-head,.axis-labels{display:flex;justify-content:space-between;gap:10px;font-size:12px}
.axis-head strong{font-size:13px}
.axis-head span{font-family:var(--mono);color:var(--shop-accent,var(--accent));font-weight:800}
.axis-labels{color:var(--muted);font-size:11.5px}
.track{position:relative;height:9px;border-radius:9px;background:var(--soft);margin:7px 0;border:1px solid var(--line)}
.track::before{content:"";position:absolute;left:50%;width:1px;height:9px;background:#cbbda7}
.track i{position:absolute;width:16px;height:16px;top:-4px;border-radius:50%;background:var(--shop-accent,var(--accent));border:2.5px solid var(--card);box-shadow:0 0 0 1.5px var(--shop-accent,var(--accent));transform:translateX(-50%)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.mini{padding:14px;border-radius:13px;background:var(--paper);border:1px solid var(--line)}
.mini b{display:block;font-family:var(--mono);color:var(--shop-accent,var(--accent));font-size:11px;margin-bottom:5px}
.mini .partner-name{font-family:var(--serif);font-size:15.5px;font-weight:800;color:var(--ink);margin-bottom:4px;line-height:1.38}
.mini p{font-size:13px;line-height:1.68;color:#4a3c33}
.chem-box{background:var(--paper);border:1.5px solid var(--line)}
.chem-select{border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.chem-out{background:var(--card);border:1px solid var(--line)}
.chem-pct{color:var(--shop-accent,var(--accent))}
.chem-bar{background:var(--soft)}
.chem-bar i{background:linear-gradient(90deg,var(--sage),var(--mustard))}
.chem-copy-btn{background:#faebe5;border-color:rgba(184,84,55,.4);color:var(--accent)}
.dex-bar{background:var(--paper);border:1.5px dashed var(--mustard)}
.dex-open-btn{background:var(--card);border-color:var(--accent);color:var(--accent)}
.dex-card{background:var(--paper);border:1px solid var(--line)}
.dex-card.unlocked{background:#fff;border-color:var(--accent)}
.rank{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px}
.rank:last-child{border:0}
.rank-left{display:flex;align-items:center;gap:10px}
.swatch{width:13px;height:13px;border-radius:4px;border:1px solid rgba(0,0,0,.18);flex:none}
.rank small{display:block;font-size:11px;color:var(--muted)}
.rank .pct{font-family:var(--mono);font-size:11.5px;font-weight:800;color:var(--accent);background:#faebe5;padding:3px 9px;border-radius:99px}
.status-bar{font-family:var(--mono);font-size:12px;color:var(--sage);text-align:center;min-height:1.4em;margin:4px 0 6px;font-weight:700}
.footer{text-align:center;margin:16px 0 0;font-size:11px;color:var(--muted);line-height:1.75}
.poster{width:100%;max-width:360px;margin:10px auto;border-radius:12px;display:block;border:1px solid var(--line);box-shadow:0 12px 30px rgba(0,0,0,.16)}
.theme-chip{background:var(--paper);border:1.5px solid var(--line);color:var(--muted)}
.theme-chip.active{background:#faebe5;border-color:var(--accent);color:var(--accent)}
.sig-input{border:1.5px solid var(--line);background:var(--paper);color:var(--ink)}
.sig-apply{background:#faebe5;border-color:var(--accent);color:var(--accent)}
.quiz-toast{background:#2d5e4e;color:#fff8eb}
dialog{width:min(calc(100% - 26px),460px);max-height:90dvh;overflow:auto;border:2px solid var(--ink);border-radius:20px;padding:20px;background:var(--card);color:var(--ink);box-shadow:0 24px 60px rgba(43,33,27,.28)}
dialog::backdrop{background:rgba(32,24,18,.64);backdrop-filter:blur(4px)}
.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.dialog-head button{min-height:36px;padding:4px 13px;font-size:13px}
.copy-area{width:100%;min-height:155px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);padding:12px;font:inherit;font-size:13px;line-height:1.7;margin:10px 0}

/* === Header Controls & Sound Button === */
.header-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.sound-btn{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:700;min-height:28px;line-height:1;letter-spacing:.04em}
.sound-btn.muted{opacity:.62}
/* === CTA Shimmer & Interactive Foil Tilt === */
.primary{position:relative;overflow:hidden}
.primary::after{content:"";position:absolute;top:0;left:-120%;width:60%;height:100%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.26),transparent);transform:skewX(-18deg);animation:btnSheen 4.4s ease-in-out infinite;pointer-events:none}
@keyframes btnSheen{0%,68%{left:-120%}100%{left:165%}}
.foil-tilt{transition:transform .22s ease-out;position:relative}
.foil-tilt::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:radial-gradient(circle at var(--mx,50%) var(--my,20%),rgba(255,255,255,.16),transparent 54%);opacity:0;transition:opacity .25s}
.foil-tilt:hover::after{opacity:1}
/* === Interactive Teaser Cards === */
.teaser{cursor:pointer;transition:transform .16s ease,border-color .18s ease,box-shadow .18s ease}
.teaser:hover{transform:translateY(-2px)}
.teaser:active{transform:scale(.98)}
/* === Chapter Dots & Keyboard Hint === */
.chapter-dots{display:flex;gap:5px;margin:8px 0 4px}
.chapter-dots span{flex:1;height:4px;border-radius:99px;opacity:.22;transition:opacity .25s,transform .25s}
.chapter-dots span.done{opacity:.72}
.chapter-dots span.now{opacity:1;transform:scaleY(1.35)}
.kbd-hint{display:none;text-align:center;font-size:11px;opacity:.65;margin-top:8px}
@media(hover:hover) and (pointer:fine){.kbd-hint{display:block}}
/* === Radar Box === */
.radar-wrap{display:flex;justify-content:center;align-items:center;margin:10px 0 14px;padding:10px;border-radius:16px}
.radar-svg{width:min(280px,100%);height:auto;display:block}
.radar-poly{transform-origin:140px 122px;animation:radarPop .55s cubic-bezier(.22,1,.36,1)}
@keyframes radarPop{from{opacity:0;transform:scale(.45)}to{opacity:1;transform:scale(1)}}
/* === Friend Compatibility Checker Widget === */
.chem-box{margin-top:14px;padding:15px;border-radius:15px}
.chem-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px;flex-wrap:wrap}
.chem-head strong{font-size:13.5px}
.chem-head span{font-size:11px;opacity:.75}
.chem-select{width:100%;min-height:44px;padding:9px 12px;border-radius:11px;font:inherit;font-size:13.5px;cursor:pointer}
.chem-out{margin-top:12px;padding:13px 14px;border-radius:12px;animation:enter .24s ease-out}
.chem-score-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.chem-verdict{font-weight:800;font-size:14px}
.chem-pct{font-weight:900;font-size:20px;line-height:1}
.chem-bar{height:7px;border-radius:99px;overflow:hidden;margin:6px 0 9px}
.chem-bar i{display:block;height:100%;border-radius:99px;transition:width .4s cubic-bezier(.22,1,.36,1)}
.chem-copy-btn{margin-top:10px;width:100%;min-height:38px;padding:7px 12px;font-size:12.5px;font-weight:700;border-radius:10px}
/* === Collection Dex Button & Grid === */
.dex-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:14px;margin-top:12px}
.dex-bar-info strong{display:block;font-size:13px}
.dex-bar-info span{display:block;font-size:11.5px;opacity:.75}
.dex-open-btn{min-height:36px;padding:6px 14px;font-size:12px;font-weight:700;border-radius:99px;flex-shrink:0}
.dex-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}

const SFX = (() => {

      o.frequency.setValueAtTime(freq, t);
      if (endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, t + dur);

      g.gain.linearRampToValueAtTime(gainVal, t + 0.012);

      o.start(t); o.stop(t + dur + 0.02);

  }
  const PRESETS = {

/* === Celebratory Particle Burst (Respects Reduced Motion) === */
function celebrateBurst(colors, style = 'spark') {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  try {
    const cv = document.createElement('canvas');
    cv.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999';
    cv.width = window.innerWidth; cv.height = window.innerHeight;
    document.body.append(cv);
    const ctx = cv.getContext('2d');
    const parts = [];
    const cx = cv.width / 2, cy = Math.min(cv.height * 0.36, 280);
    for (let i = 0; i < 42; i++) {
      const ang = (Math.PI * 2 * i) / 42 + (Math.random() - 0.5) * 0.35;
      const spd = 2.6 + Math.random() * 5.8;
      parts.push({
        x: cx + (Math.random() - 0.5) * 40,
        y: cy + (Math.random() - 0.5) * 20,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - 2.4,
        r: 3 + Math.random() * 4.5,
        rot: Math.random() * Math.PI * 2,
        vr: (Math.random() - 0.5) * 0.2,
        color: colors[i % colors.length],
        life: 1,
        decay: 0.015 + Math.random() * 0.012
      });
    }
    let raf;
    function tick() {
      ctx.clearRect(0, 0, cv.width, cv.height);
      let alive = 0;
      for (const p of parts) {
        if (p.life <= 0) continue;
        alive++;
        p.x += p.vx; p.y += p.vy; p.vy += 0.13; p.vx *= 0.985; p.rot += p.vr; p.life -= p.decay;
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        if (style === 'petal') {
          ctx.beginPath(); ctx.ellipse(0, 0, p.r * 1.4, p.r * 0.72, 0, 0, Math.PI * 2); ctx.fill();
        } else if (style === 'star') {
          ctx.beginPath();
          for (let s = 0; s < 4; s++) {
            const a = s * Math.PI / 2;
            ctx.lineTo(Math.cos(a) * p.r * 1.5, Math.sin(a) * p.r * 1.5);
            ctx.lineTo(Math.cos(a + Math.PI / 4) * p.r * 0.45, Math.sin(a + Math.PI / 4) * p.r * 0.45);
          }
          ctx.closePath(); ctx.fill();
        } else if (style === 'bubble') {
          ctx.strokeStyle = p.color; ctx.lineWidth = 1.6;
          ctx.beginPath(); ctx.arc(0, 0, p.r * 1.15, 0, Math.PI * 2); ctx.stroke();
        } else {
          ctx.fillRect(-p.r, -p.r * 0.55, p.r * 2, p.r * 1.1);
        }
        ctx.restore();
      }
      if (alive > 0) raf = requestAnimationFrame(tick);
      else cv.remove();
    }
    raf = requestAnimationFrame(tick);
    setTimeout(() => { cancelAnimationFrame(raf); cv.remove(); }, 2200);
  } catch {}
}

/* === Subtle 3D Foil Tilt on Result Hero Card === */
function bindCardTilt(el) {
  if (!el || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
  el.classList.add('foil-tilt');
  const onMove = e => {
    const r = el.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width;
    const py = (e.clientY - r.top) / r.height;
    const rx = (0.5 - py) * 5.5, ry = (px - 0.5) * 6.5;
    el.style.transform = `perspective(900px) rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg)`;
    el.style.setProperty('--mx', (px * 100).toFixed(1) + '%');
    el.style.setProperty('--my', (py * 100).toFixed(1) + '%');
  };
  const onLeave = () => {
    el.style.transform = '';
    el.style.setProperty('--mx', '50%');
    el.style.setProperty('--my', '20%');
  };
  el.addEventListener('pointermove', onMove);
  el.addEventListener('pointerleave', onLeave);
}

/* === Dynamic Multi-Axis SVG Radar Chart (4 or 6 Axes) === */
function buildRadarSVG(labels, ratios, opts = {}) {
  const n = labels.length, cx = 140, cy = 122, R = 74;
  const stroke = opts.stroke || 'var(--accent)';
  const fill = opts.fill || 'var(--accent)';
  const grid = opts.grid || 'rgba(128,128,128,0.22)';
  const labelColor = opts.labelColor || 'currentColor';
  const pt = (i, r) => {
    const a = -Math.PI / 2 + (Math.PI * 2 * i) / n;
    return [cx + Math.cos(a) * r, cy + Math.sin(a) * r];
  };
  let rings = '';
  [0.34, 0.67, 1].forEach(f => {
    const pts = Array.from({ length: n }, (_, i) => pt(i, R * f).map(x => x.toFixed(1)).join(',')).join(' ');
    rings += `<polygon points="${pts}" fill="none" stroke="${grid}" stroke-width="1"/>`;
  });
  let spokes = '';
  for (let i = 0; i < n; i++) {
    const [x, y] = pt(i, R);
    spokes += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${grid}" stroke-width="1"/>`;
  }
  const clamped = ratios.map(r => Math.max(0.18, Math.min(1, r)));
  const polyPts = clamped.map((r, i) => pt(i, R * r).map(x => x.toFixed(1)).join(',')).join(' ');
  const dots = clamped.map((r, i) => {
    const [x, y] = pt(i, R * r);
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.2" fill="${stroke}" stroke="${opts.dotRing || '#fff'}" stroke-width="1.8"/>`;
  }).join('');
  const texts = labels.map((lb, i) => {
    const [x, y] = pt(i, R + 22);
    const anchor = Math.abs(x - cx) < 10 ? 'middle' : x < cx ? 'end' : 'start';
    const dy = y < cy - 30 ? -2 : y > cy + 30 ? 8 : 4;
    return `<text x="${x.toFixed(1)}" y="${(y + dy).toFixed(1)}" text-anchor="${anchor}" font-size="11" font-weight="700" fill="${labelColor}">${esc(lb)}</text>`;
  }).join('');
  return `<svg class="radar-svg" viewBox="0 0 280 244" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="多维人格雷达图">
    ${rings}${spokes}
    <polygon class="radar-poly" points="${polyPts}" fill="${fill}" fill-opacity="0.24" stroke="${stroke}" stroke-width="2.2" stroke-linejoin="round"/>
    ${dots}${texts}
  </svg>`;
}

/* === Canvas Mini Radar Drawing Helper (for 3:4 Posters) === */
function drawCanvasRadar(ctx, cx, cy, R, labels, ratios, stroke, fill, grid, textCol) {
  const n = labels.length;
  const pt = (i, r) => {
    const a = -Math.PI / 2 + (Math.PI * 2 * i) / n;
    return [cx + Math.cos(a) * r, cy + Math.sin(a) * r];
  };
  ctx.save();
  [0.35, 0.68, 1].forEach(f => {
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const [x, y] = pt(i, R * f);
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.closePath(); ctx.strokeStyle = grid; ctx.lineWidth = 1.4; ctx.stroke();
  });
  for (let i = 0; i < n; i++) {
    const [x, y] = pt(i, R);
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(x, y); ctx.strokeStyle = grid; ctx.lineWidth = 1.2; ctx.stroke();
  }
  ctx.beginPath();
  ratios.forEach((r, i) => {
    const [x, y] = pt(i, R * Math.max(0.2, Math.min(1, r)));
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  });
  ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
  ctx.strokeStyle = stroke; ctx.lineWidth = 3; ctx.stroke();
  ratios.forEach((r, i) => {
    const [x, y] = pt(i, R * Math.max(0.2, Math.min(1, r)));
    ctx.beginPath(); ctx.arc(x, y, 5.5, 0, Math.PI * 2); ctx.fillStyle = stroke; ctx.fill();
  });
  ctx.fillStyle = textCol; ctx.font = '700 18px "PingFang SC","Microsoft YaHei",sans-serif';
  labels.forEach((lb, i) => {
    const [x, y] = pt(i, R + 24);
    ctx.textAlign = Math.abs(x - cx) < 12 ? 'center' : x < cx ? 'right' : 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(lb, x, y);
  });
  ctx.restore();
}

/* === Isolated Local Collection Dex Helpers === */
function getUnlocked() {
  try {
    const raw = JSON.parse(localStorage.getItem(STORAGE + ':dex') || '[]');
    return Array.isArray(raw) ? raw : [];
  } catch { return []; }
}
function recordUnlock(name) {
  try {
    const list = getUnlocked();
    if (!list.includes(name)) { list.push(name); localStorage.setItem(STORAGE + ':dex', JSON.stringify(list)); }
    return list;
  } catch { return [name]; }
}

/* === Vector Pair Compatibility Calculator === */
function calcVectorChem(pA, pB, axes, labelsCfg = {}) {
  if (pA.name === pB.name) {
    return {
      score: 94,
      verdict: labelsCfg.same || '✦ 镜像双生 · 灵魂复刻',
      desc: `两个「${pA.name}」相遇就像照镜子——不用多余解释就能一秒接住彼此的梗与节奏，连沉默的频率都惊人一致！`
    };
  }
  if (pA.match && pA.match[0] === pB.name) {
    return { score: 99, verdict: labelsCfg.match || '♥ 天选官配 · 满分同频', desc: pA.match[1] };
  }
  if (pB.match && pB.match[0] === pA.name) {
    return { score: 97, verdict: labelsCfg.match || '♥ 双向奔赴 · 绝佳搭子', desc: pB.match[1] };
  }
  if (pA.clash && pA.clash[0] === pB.name) {
    return { score: 54, verdict: labelsCfg.clash || '⚡ 宿命反差 · 欢喜冤家', desc: pA.clash[1] };
  }
  if (pB.clash && pB.clash[0] === pA.name) {
    return { score: 56, verdict: labelsCfg.clash || '⚡ 高能反差 · 奇妙碰撞', desc: pB.clash[1] };
  }
  const vecA = pA.vector, vecB = pB.vector;
  const diffs = vecA.map((x, i) => ({ i, d: Math.abs(x - vecB[i]) }));
  const avgDiff = diffs.reduce((s, x) => s + x.d, 0) / diffs.length;
  const sim = Math.max(0, 1 - avgDiff / 3);
  const hashSeed = [...(pA.name + pB.name)].reduce((a, c) => (a * 31 + c.charCodeAt(0)) % 997, 7);
  const score = Math.round(Math.max(62, Math.min(95, 65 + sim * 27 + (hashSeed % 5))));
  const closest = diffs.slice().sort((a, b) => a.d - b.d)[0];
  const farthest = diffs.slice().sort((a, b) => b.d - a.d)[0];
  let verdict = '🌿 舒服同频 · 轻松相处';
  if (score >= 88) verdict = '✦ 默契神搭 · 能量共振';
  else if (score >= 78) verdict = '♥ 互补合拍 · 越处越甜';
  else if (score < 70) verdict = '🔥 跨频火花 · 新鲜感拉满';
  const desc = `你们在「${axes[closest.i][0]}」维度上天然同频，很容易快速聊到一块；而在「${axes[farthest.i][0]}」上的不同视角，正好能给彼此带来意想不到的新鲜灵感。`;
  return { score, verdict, desc };
}

/* === Toast Notification === */
let toastTimer = null;
function showToast(msg) {
  let el = document.getElementById('quizToast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'quizToast';
    el.className = 'quiz-toast';
    el.setAttribute('role', 'status');
    document.body.append(el);
  }
  el.textContent = msg;
  el.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2100);
}

function compute(input){
  if(input.length!==N||input.some(v=>!Number.isInteger(v)||v<0||v>3)) throw Error('Incomplete answers');
  const sums=D.axes.map(()=>0), cnts=D.axes.map(()=>0);
  const wSums=D.axes.map(()=>0), wCnts=D.axes.map(()=>0);
  D.questions.forEach((q,i)=>{
    const sc=q.options[input[i]].score;
    sums[q.axis]+=sc; cnts[q.axis]++;
    const w=1+i*0.012;
    wSums[q.axis]+=sc*w; wCnts[q.axis]+=w;
  });
  const v=sums.map((s,i)=>s/cnts[i]);
  const vw=wSums.map((s,i)=>s/wCnts[i]);
  const ranked=D.profiles.map((p,i)=>{
    const center=p.vector.map(x=>x-1.5);
    const norm=Math.hypot(...center)||1;
    const radius=Math.sqrt(vw.length)*0.52+0.12*(norm-Math.sqrt(vw.length));
    const cal=center.map(x=>1.5+x*radius/norm);
    const d=cal.reduce((s,x,j)=>s+(x-vw[j])**2,0);
    const rawSim=Math.max(0,1-Math.sqrt(d/(4.2*vw.length)));
    const fit=Math.round(Math.max(68,Math.min(98,68+rawSim*30)));
    return {p,i,d,fit};
  });
  ranked.sort((a,b)=>a.d-b.d||a.i-b.i);
  for(let k=1;k<Math.min(4,ranked.length);k++){
    if(ranked[k].fit>=ranked[k-1].fit) ranked[k].fit=Math.max(62,ranked[k-1].fit-2);
  }
  const licNo=`NO.2026-${ranked[0].p.no}${String(Math.round((v[0]*3+v[1]*5+v[2]*7+v[3]*11)*19+100)).slice(-3)}`;
  return {v,ranked,p:ranked[0].p,licNo};
}

function wrap(ctx,text,max){const out=[];let line='';for(const ch of text){if(line&&ctx.measureText(line+ch).width>max){out.push(line);line=ch;}else line+=ch;}if(line) out.push(line);return out;}
function rPath(ctx,x,y,w,h,r){ctx.beginPath();if(typeof ctx.roundRect==='function') ctx.roundRect(x,y,w,h,r);else{r=Math.min(r,w/2,h/2);ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}}
function fillR(ctx,x,y,w,h,r){rPath(ctx,x,y,w,h,r);ctx.fill();}
function strokeR(ctx,x,y,w,h,r){rPath(ctx,x,y,w,h,r);ctx.stroke();}

function makePoster(themeIdx = 0, sig = ''){

  const sans='"PingFang SC","Microsoft YaHei",sans-serif', serif='"Noto Serif SC","Songti SC","SimSun",serif', mono='"SF Mono","Menlo","Consolas",monospace';
  const dark = themeIdx === 1;
  const BG = dark ? '#1a1512' : '#efe8da';
  const CARD = dark ? '#241e1a' : '#fffdf7';
  const SOFT = dark ? '#2e2621' : '#faf5eb';
  const INK = dark ? '#f7efe3' : '#2b211b';
  const MUTED = dark ? '#bdaea0' : '#756558';
  const ACC = dark ? '#f0a27a' : p.accent;
  const LINE = dark ? 'rgba(240,200,130,0.28)' : '#ded2be';

  ctx.fillStyle=BG;ctx.fillRect(0,0,1080,1440);

function renderPosterCanvas(){
  if(!report) return;
  const status=document.getElementById('posterStatus'),area=document.getElementById('posterArea'),download=document.getElementById('downloadPoster'),sig=(document.getElementById('sigInput')?.value||'').trim().slice(0,10);
  status.textContent='';area.innerHTML='';download.disabled=true;
  try{
    if(posterURL) URL.revokeObjectURL(posterURL);
    posterURL=null;
    const canvas=makePoster(posterTheme,sig);
    const img=document.createElement('img');img.className='poster';img.alt='可保存的3:4理想小店营业执照海报';img.src=canvas.toDataURL('image/png');
    area.append(img);
    canvas.toBlob(blob=>{posterURL=blob?URL.createObjectURL(blob):img.src;download.disabled=false;},'image/png');
  }catch(e){status.textContent='当前浏览器不支持生成海报，可直接截图保存结果页。';}
}
function showPoster(){if(!report) return;SFX.click(3);renderPosterCanvas();if(!posterDialog.open) posterDialog.showModal();}

document.querySelectorAll('[data-ptheme]').forEach(btn=>{
  btn.onclick=()=>{SFX.click(1);posterTheme=Number(btn.dataset.ptheme)||0;document.querySelectorAll('[data-ptheme]').forEach(x=>x.classList.toggle('active',x===btn));renderPosterCanvas();};
});
document.getElementById('sigApply').onclick=()=>{SFX.click(2);renderPosterCanvas();document.getElementById('posterStatus').textContent='✓ 主理人署名已印上营业执照！';};
document.getElementById('closePoster').onclick=()=>posterDialog.close();
document.getElementById('downloadPoster').onclick=()=>{
  if(!posterURL||!report) return;
  const a=document.createElement('a');a.href=posterURL;a.download='理想小店-'+report.p.name+'.png';
  document.body.append(a);a.click();a.remove();
  document.getElementById('posterStatus').textContent='若微信/小红书内未自动下载，请直接长按上方营业执照保存。';
};
document.getElementById('closeCopy').onclick=()=>copyDialog.close();
document.getElementById('closePeek').onclick=()=>peekDialog.close();
document.getElementById('closeDex').onclick=()=>dexDialog.close();
document.getElementById('selectCopyBtn').onclick=()=>{const ta=document.getElementById('copyTextarea');ta.focus();ta.select();};
document.addEventListener('keydown',e=>{
  if(screen!=='question'||posterDialog.open||copyDialog.open||peekDialog.open||dexDialog.open) return;
  if(e.target&&/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  const map={'1':0,'2':1,'3':2,'4':3,'a':0,'b':1,'c':2,'d':3,'A':0,'B':1,'C':2,'D':3};
  if(e.key in map){e.preventDefault();choose(map[e.key]);}
  else if(e.key==='ArrowLeft'||e.key==='Backspace'){e.preventDefault();back();}
  else if(e.key==='ArrowRight'||e.key==='Enter'){if(answers[idx]!==null){e.preventDefault();next();}}
});
initSoundToggle();
home();
