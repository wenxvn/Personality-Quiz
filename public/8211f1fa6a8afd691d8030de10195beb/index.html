<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7b2c4b">
<meta name="description" content="你的隐藏恋爱人格 · 原创高质感趣味探索测试，无需登录，数据仅在本地浏览器处理。">
<title>你的隐藏恋爱人格</title>
<style>
:root{
  
      --ink:#391f2b;--accent:#842e50;--accent2:#c7875e;--paper:#fbf2f4;
      --soft:#f5dfe7;--line:#e7cbd6;--card:#fffcfd;--muted:#7b5b6a;
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.68;-webkit-tap-highlight-color:transparent;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:
  radial-gradient(ellipse at 92% 0%,var(--soft),transparent 58%),
  radial-gradient(ellipse at 8% 100%,color-mix(in srgb,var(--accent2) 15%,transparent),transparent 54%);z-index:-1}
main{width:min(100%,660px);padding:14px 14px max(28px,env(safe-area-inset-bottom));margin:auto}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.brand{font-size:11px;letter-spacing:2.2px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:6px}
.brand::before{content:"✦";color:var(--accent2);font-size:13px}
.issue{font-size:11px;color:var(--muted);white-space:nowrap;letter-spacing:.04em}
.sound-btn{background:var(--card);border:1px solid var(--line);color:var(--accent)}
section.panel{border:1px solid var(--line);border-radius:24px;background:var(--card);padding:clamp(16px,4vw,28px);box-shadow:0 22px 54px rgba(32,24,20,.09);overflow:hidden;animation:enter .28s cubic-bezier(.22,1,.36,1)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1,h2,h3,p{margin:0}
h1{font-family:var(--serif);font-size:clamp(28px,7.2vw,42px);font-weight:800;line-height:1.24;letter-spacing:.03em;text-wrap:balance}
h2{font-family:var(--serif);font-size:clamp(20px,5vw,26px);line-height:1.46;font-weight:700}
h3{font-family:var(--serif);font-size:17px;margin-bottom:9px;font-weight:700}
.eyebrow{color:var(--accent);font-size:10.5px;letter-spacing:2.2px;font-weight:800;margin:13px 0 6px;text-transform:uppercase}
.lead{font-size:14px;line-height:1.78;margin:9px 0 14px;color:color-mix(in srgb,var(--ink) 86%,var(--muted));text-wrap:pretty}
.muted{font-size:12px;color:var(--muted)}
.hero{position:relative;isolation:isolate;height:clamp(164px,42vw,224px);background:var(--accent);border-radius:18px;overflow:hidden;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.hero svg{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.04) 0%,rgba(0,0,0,.46) 100%);z-index:-1}
.hero-badge{position:absolute;top:12px;right:12px;padding:4px 10px;border-radius:99px;border:1px solid rgba(255,255,255,.45);background:rgba(0,0,0,.26);backdrop-filter:blur(6px);font-size:10px;letter-spacing:1.4px;font-weight:700;color:#fff}
.hero-copy{position:absolute;bottom:14px;left:16px;right:16px}
.hero-copy small{font-size:9.5px;letter-spacing:2.8px;opacity:.9;display:block;margin-bottom:2px}
.hero-copy strong{display:block;font-family:var(--serif);font-size:clamp(22px,5.6vw,32px);letter-spacing:3px;line-height:1.22}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 15px}
.pill{font-size:11.5px;padding:4px 11px;border:1px solid var(--line);border-radius:100px;background:var(--paper);color:var(--ink);font-weight:600}
.pill.accent{border-color:color-mix(in srgb,var(--accent) 34%,var(--line));background:var(--soft);color:var(--accent);font-weight:700}
.teaser-wrap{margin:15px 0 12px;padding-top:13px;border-top:1px dashed var(--line)}
.teaser-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
.teaser-head span{font-size:11px;letter-spacing:1.4px;color:var(--accent);font-weight:800}
.teaser-head small{font-size:11px;color:var(--muted)}
.teasers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.teaser{padding:10px 9px;border-radius:13px;background:var(--paper);border:1px solid var(--line);display:flex;flex-direction:column;gap:3px;text-align:left}
.teaser:hover{border-color:var(--accent);box-shadow:0 6px 16px rgba(32,24,20,.07)}
.teaser b{font-family:var(--serif);font-size:14px;color:var(--ink);line-height:1.28}
.teaser span{font-size:10.5px;color:var(--accent);font-weight:700}
.teaser small{font-size:10.5px;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 15px;min-height:46px;touch-action:manipulation;transition:transform .12s,border-color .18s,background .18s,box-shadow .18s}
button:active:not(:disabled){transform:scale(.985)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.4;cursor:not-allowed}
.primary{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 82%,#000));color:#fff;border-color:var(--accent);font-weight:750;width:100%;text-align:center;box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 28%,transparent)}
.primary:hover:not(:disabled){filter:brightness(1.06)}
.secondary{width:100%;text-align:center;background:var(--paper);font-weight:600}
.subtle{background:transparent;border:0;text-align:center;color:var(--muted);font-size:12px;padding:7px;min-height:34px}
.subtle:hover{color:var(--accent)}
.stack{display:grid;gap:9px}
.actions-row{display:grid;grid-template-columns:1.25fr 1fr;gap:10px}
.notice{font-size:11.5px;color:var(--muted);line-height:1.66;margin-top:12px}
/* Quiz screen */
.question-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--accent);font-weight:750;letter-spacing:.06em}
.auto-toggle{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--paper);color:var(--muted);font-size:11px;font-weight:600;min-height:28px;cursor:pointer}
.auto-toggle.on{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));color:var(--accent);background:var(--soft)}
.progress{height:6px;background:var(--soft);overflow:hidden;border-radius:12px;margin:9px 0 8px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:12px;transition:width .28s cubic-bezier(.22,1,.36,1)}
.chapter-dots span{background:var(--accent)}
.chapter-bar{display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:13px;background:var(--paper);border:1px solid var(--line);margin:10px 0 18px}
.chapter-num{font-family:var(--serif);font-size:20px;font-weight:800;color:var(--accent2);line-height:1}
.chapter-bar strong{display:block;font-size:13px;color:var(--ink)}
.chapter-bar span{display:block;font-size:11px;color:var(--muted);line-height:1.45}
.options{display:grid;gap:10px;margin:18px 0 20px}
.option{display:flex;text-align:left;align-items:center;gap:12px;min-height:58px;width:100%;padding:12px 14px;line-height:1.52;background:var(--card)}
.option .letter{display:grid;place-items:center;flex:0 0 30px;height:30px;border-radius:10px;background:var(--paper);color:var(--accent);font-weight:800;font-size:12px;border:1px solid var(--line);transition:all .18s}
.option.selected{border-color:var(--accent);box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 18%,transparent),inset 0 0 0 1px var(--accent);background:var(--soft);transform:translateX(2px)}
.option.selected .letter{background:var(--accent);color:#fff;border-color:var(--accent)}
.option .check{margin-left:auto;color:var(--accent);font-weight:800;font-size:15px}
.nav{display:grid;grid-template-columns:1fr 1.6fr;gap:10px}
/* Calculating ritual screen */
.calc-box{text-align:center;padding:38px 10px 30px}
.calc-ring{width:70px;height:70px;margin:0 auto 20px;border-radius:50%;border:3px solid var(--soft);border-top-color:var(--accent);border-right-color:var(--accent2);animation:spin 1s linear infinite;position:relative}
.calc-ring::after{content:"💌";position:absolute;inset:0;display:grid;place-items:center;font-size:22px;animation:spinRev 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinRev{to{transform:rotate(-360deg)}}
.calc-step{font-family:var(--serif);font-size:19px;color:var(--ink);margin-bottom:8px;min-height:1.6em}
.calc-sub{font-size:12px;color:var(--muted)}
/* Result Cover */
.result-cover{border:1px solid var(--line);border-radius:20px;padding:14px;background:var(--paper);position:relative}
.result-cover .hero{height:164px}
.result-stamp{position:absolute;top:24px;right:24px;padding:5px 11px;border:1.5px solid rgba(255,255,255,.78);border-radius:8px;font-family:var(--serif);font-size:11px;letter-spacing:2px;color:#fff;background:rgba(0,0,0,.28);backdrop-filter:blur(4px);transform:rotate(3deg)}
.result-name-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:6px 0 8px}
.result-name{font-family:var(--serif);font-size:clamp(32px,8.2vw,48px);line-height:1.2;letter-spacing:.03em}
.fit-badge{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border-radius:99px;background:var(--accent);color:#fff;font-size:12px;font-weight:750;white-space:nowrap}
.quote-box{position:relative;margin:12px 0 6px;padding:12px 14px;border-left:3px solid var(--accent2);background:var(--card);border-radius:0 12px 12px 0}
.quote{font-family:var(--serif);font-size:16.5px;color:var(--accent);line-height:1.62;font-weight:600}
.result-cover .intro{padding:8px 6px 4px}
.block{padding:20px 0;border-bottom:1px solid var(--line)}
.block:last-of-type{border:0;padding-bottom:12px}
.block p{font-size:14.5px;line-height:1.86;color:color-mix(in srgb,var(--ink) 92%,var(--muted))}
.kicker{font-size:10px;letter-spacing:2.2px;color:var(--accent2);font-weight:800;margin-bottom:5px;text-transform:uppercase}
.contrast-card{margin-top:13px;padding:13px 15px;border-radius:14px;background:linear-gradient(135deg,var(--soft),var(--paper));border:1px solid var(--line)}
.contrast-card b{display:block;font-size:12px;color:var(--accent);margin-bottom:4px;letter-spacing:.04em}
.contrast-card p{font-size:13.5px;line-height:1.75}
.radar-wrap{background:var(--paper);border:1px solid var(--line)}
.axis{margin:14px 0}
.axis-head,.axis-labels{display:flex;justify-content:space-between;gap:10px;font-size:12px}
.axis-head strong{font-size:13px}
.axis-head span{color:var(--accent);font-weight:700}
.axis-labels{color:var(--muted)}
.track{position:relative;height:9px;border-radius:9px;background:var(--soft);margin:7px 0}
.track::before{content:"";position:absolute;left:50%;width:1px;height:9px;background:var(--line)}
.track i{position:absolute;width:16px;height:16px;top:-3.5px;border-radius:50%;background:var(--accent);border:2.5px solid var(--card);box-shadow:0 0 0 1.5px var(--accent);transform:translateX(-50%)}
.rank{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.rank:last-child{border:0}
.rank small{display:block;font-size:11px;color:var(--muted)}
.rank .pct{font-size:12px;font-weight:700;color:var(--accent);background:var(--soft);padding:3px 9px;border-radius:99px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.mini{padding:14px;border-radius:14px;background:var(--paper);border:1px solid var(--line)}
.mini b{display:block;color:var(--accent);font-size:12px;margin-bottom:5px}
.mini .partner-name{font-family:var(--serif);font-size:18px;font-weight:800;color:var(--ink);margin-bottom:4px}
.mini p{font-size:13px;line-height:1.68}
.chem-box{background:var(--paper);border:1px solid var(--line)}
.chem-select{border:1px solid var(--line);background:var(--card);color:var(--ink)}
.chem-out{background:var(--card);border:1px solid var(--line)}
.chem-pct{color:var(--accent)}
.chem-bar{background:var(--soft)}
.chem-bar i{background:linear-gradient(90deg,var(--accent),var(--accent2))}
.chem-copy-btn{background:var(--soft);border-color:color-mix(in srgb,var(--accent) 32%,var(--line));color:var(--accent)}
.dex-bar{background:var(--paper);border:1px dashed var(--accent2)}
.dex-open-btn{background:var(--card);border-color:var(--accent);color:var(--accent)}
.dex-card{background:var(--paper);border:1px solid var(--line)}
.dex-card.unlocked{background:var(--soft);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.egg-box{padding:14px 16px;border-radius:14px;background:var(--paper);border:1px dashed var(--accent2);margin-top:10px}
.egg-box b{display:block;font-size:12px;color:var(--accent2);margin-bottom:4px;letter-spacing:.05em}
.egg-box p{font-size:14px}
.status-bar{font-size:12px;color:var(--accent);text-align:center;min-height:1.4em;margin:4px 0 6px;font-weight:600}
.footer{text-align:center;margin:16px 0 0;font-size:11px;color:var(--muted);line-height:1.75}
.poster{width:100%;max-width:360px;margin:10px auto;border-radius:14px;display:block;border:1px solid var(--line);box-shadow:0 12px 30px rgba(0,0,0,.14)}
.theme-chip{background:var(--paper);border:1px solid var(--line);color:var(--muted)}
.theme-chip.active{background:var(--soft);border-color:var(--accent);color:var(--accent)}
.sig-input{border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.sig-apply{background:var(--soft);border-color:var(--accent);color:var(--accent)}
dialog{width:min(calc(100% - 26px),460px);max-height:90dvh;overflow:auto;border:1px solid var(--line);border-radius:22px;padding:20px;background:var(--card);color:var(--ink);box-shadow:0 24px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(20,16,22,.62);backdrop-filter:blur(4px)}
.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.dialog-head button{min-height:36px;padding:4px 13px;font-size:13px}
.copy-area{width:100%;min-height:150px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:12px;font:inherit;font-size:13px;line-height:1.7;margin:10px 0}

/* === Header Controls & Sound Button === */
.header-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.sound-btn{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:700;min-height:28px;line-height:1;letter-spacing:.04em}
.sound-btn.muted{opacity:.62}
/* === CTA Shimmer & Interactive Foil Tilt === */
.primary{position:relative;overflow:hidden}
.primary::after{content:"";position:absolute;top:0;left:-120%;width:60%;height:100%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.26),transparent);transform:skewX(-18deg);animation:btnSheen 4.4s ease-in-out infinite;pointer-events:none}
@keyframes btnSheen{0%,68%{left:-120%}100%{left:165%}}
.foil-tilt{transition:transform .22s ease-out;position:relative}
.foil-tilt::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:radial-gradient(circle at var(--mx,50%) var(--my,20%),rgba(255,255,255,.16),transparent 54%);opacity:0;transition:opacity .25s}
.foil-tilt:hover::after{opacity:1}
/* === Interactive Teaser Cards === */
.teaser{cursor:pointer;transition:transform .16s ease,border-color .18s ease,box-shadow .18s ease}
.teaser:hover{transform:translateY(-2px)}
.teaser:active{transform:scale(.98)}
/* === Chapter Dots & Keyboard Hint === */
.chapter-dots{display:flex;gap:5px;margin:8px 0 4px}
.chapter-dots span{flex:1;height:4px;border-radius:99px;opacity:.22;transition:opacity .25s,transform .25s}
.chapter-dots span.done{opacity:.72}
.chapter-dots span.now{opacity:1;transform:scaleY(1.35)}
.kbd-hint{display:none;text-align:center;font-size:11px;opacity:.65;margin-top:8px}
@media(hover:hover) and (pointer:fine){.kbd-hint{display:block}}
/* === Radar Box === */
.radar-wrap{display:flex;justify-content:center;align-items:center;margin:10px 0 14px;padding:10px;border-radius:16px}
.radar-svg{width:min(280px,100%);height:auto;display:block}
.radar-poly{transform-origin:140px 122px;animation:radarPop .55s cubic-bezier(.22,1,.36,1)}
@keyframes radarPop{from{opacity:0;transform:scale(.45)}to{opacity:1;transform:scale(1)}}
/* === Friend Compatibility Checker Widget === */
.chem-box{margin-top:14px;padding:15px;border-radius:15px}
.chem-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px;flex-wrap:wrap}
.chem-head strong{font-size:13.5px}
.chem-head span{font-size:11px;opacity:.75}
.chem-select{width:100%;min-height:44px;padding:9px 12px;border-radius:11px;font:inherit;font-size:13.5px;cursor:pointer}
.chem-out{margin-top:12px;padding:13px 14px;border-radius:12px;animation:enter .24s ease-out}
.chem-score-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.chem-verdict{font-weight:800;font-size:14px}
.chem-pct{font-weight:900;font-size:20px;line-height:1}
.chem-bar{height:7px;border-radius:99px;overflow:hidden;margin:6px 0 9px}
.chem-bar i{display:block;height:100%;border-radius:99px;transition:width .4s cubic-bezier(.22,1,.36,1)}
.chem-copy-btn{margin-top:10px;width:100%;min-height:38px;padding:7px 12px;font-size:12.5px;font-weight:700;border-radius:10px}
/* === Collection Dex Button & Grid === */
.dex-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:14px;margin-top:12px}
.dex-bar-info strong{display:block;font-size:13px}
.dex-bar-info span{display:block;font-size:11.5px;opacity:.75}
.dex-open-btn{min-height:36px;padding:6px 14px;font-size:12px;font-weight:700;border-radius:99px;flex-shrink:0}
.dex-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.dex-card{padding:11px 10px;border-radius:12px;display:flex;flex-direction:column;gap:4px}
.dex-card.locked{opacity:.58;border-style:dashed!important}
.dex-card b{font-size:13px;line-height:1.35}
.dex-card small{font-size:11px;line-height:1.45;opacity:.8}
/* === Poster Customization Controls === */
.poster-tools{display:grid;gap:9px;margin:10px 0 8px}
.poster-themes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.theme-chip{min-height:36px;padding:6px 10px;font-size:12px;font-weight:700;border-radius:10px;text-align:center}
.sig-row{display:flex;gap:8px;align-items:center}
.sig-input{flex:1;min-height:38px;padding:6px 11px;border-radius:10px;font:inherit;font-size:13px}
.sig-apply{min-height:38px;padding:6px 13px;font-size:12px;font-weight:700;border-radius:10px;flex-shrink:0}
/* === Chapter Toast === */
.quiz-toast{position:fixed;top:16px;left:50%;transform:translate(-50%,-18px);opacity:0;pointer-events:none;z-index:999;padding:8px 16px;border-radius:99px;font-size:12.5px;font-weight:700;box-shadow:0 10px 28px rgba(0,0,0,.22);transition:opacity .25s,transform .25s;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.quiz-toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:440px){.dex-grid{grid-template-columns:1fr}}

      section.panel{position:relative;border:1.5px solid var(--line);border-radius:26px;box-shadow:0 24px 60px rgba(132,46,80,.10)}

，不沟通容易互相委屈。"],"vibe":"心动开关：各自专注喜欢的事后，默契抬头分享同一片晚霞"},{"name":"温柔陪伴者","vector":[3,1,1,2],"tag":"恋爱人格","quote":"最动人的浪漫，是有人一起过日常。","insight":"你相信最顶级的浪漫藏在“一起吃很多顿饭、聊很多句废话”里。你擅长营造温暖妥帖的相处氛围，愿意把耐心与温柔倾注在日常点滴中，是伴侣疲惫时最想奔赴的港湾。","strength":"持续关心、善于陪伴","caution":"别将陪伴频率自动等同于爱意","action":"与对方商量各自喜欢的独处及共处比例","motif":"温柔与日常","no":"03","tags":["烟火浪漫","情绪港湾","细水长流"],"contrast":"平时总在迁就和照顾别人，其实自己心里也住着一个渴望被偏爱、被主动抱紧的小孩。","match":["慢热守护者","同样追求细水长流的踏实爱意，互相滋养不内耗。"],"clash":["理性观察者","你渴望温暖回应，对方习惯先冷静分析，偶尔会让你觉得有点冷。"],"vibe":"心动开关：下班后一起逛超市买菜，并肩散步不用看手机"},{"name":"直球行动派","vector":[2,3,3,3],"tag":"恋爱人格","quote":"喜欢就说，想见就约。","insight":"喜欢就要大声说，想见就立刻出发，有误会绝不留过夜！你在感情里坦荡滚烫，讨厌弯弯绕绕的猜忌游戏。和你谈恋爱几乎没有内耗，因为你的偏爱永远光明正大、有迹可循。","strength":"坦率、行动力强","caution":"给对方时间和选择空间","action":"发出邀请后留出对方自主回答的余地","motif":"热烈与坦率","no":"04","tags":["明目张胆偏爱","高能直球","绝不冷战"],"contrast":"外表勇敢热烈、好像永远充满能量，其实最怕一片真心砸出去只收到模棱两可的敷衍。","match":["热情分享家","双向直球、热烈明媚，每天都像在演高甜偶像剧。"],"clash":["细腻理想家","你想立刻说开解决，对方需要安静消化情绪，节奏容易撞车。"],"vibe":"心动开关：对方同样坦荡接住你的热情，从不玩欲擒故纵"},{"name":"理性观察者","vector":[0,0,0,0],"tag":"恋爱人格","quote":"先读懂彼此，再写下一页。","insight":"你不会轻易被荷尔蒙冲昏头脑，习惯先静静观察彼此的三观、人品与相处舒适度。不是你冷漠，而是你对感情极其慎重——经过理性筛选后依然选择的人，往往能得到你最深沉笃定的信任。","strength":"审慎、尊重自己的节奏","caution":"过久的观察可能让心意显得不明确","action":"用一句具体的话告诉对方你正在认真了解这段关系","motif":"理性与留白","no":"05","tags":["清醒深情","慢火甄别","极低内耗"],"contrast":"前期冷静克制像在做尽职调查，一旦真正交付真心，反而比谁都专一护短。","match":["坦诚沟通者","同样重逻辑与边界，有话直说不翻旧账，相处极度舒服。"],"clash":["浪漫幻想家","你重现实契合，对方重情绪浓度，偶尔会觉得彼此不在一个频道。"],"vibe":"心动开关：情绪稳定、逻辑清晰，且能进行深度灵魂对话"},{"name":"浪漫幻想家","vector":[3,2,2,1],"tag":"恋爱人格","quote":"把普通的一天，也过成值得记住的故事。","insight":"你天生拥有把普通周二过成纪念日的能力。你看重眼神里的星光、藏在细节里的仪式感，以及两个人心照不宣的独家记忆。和你相爱，世界会自动蒙上一层温柔的电影滤镜。","strength":"善于制造共同回忆","caution":"别让理想化期待遮住真实差异","action":"一起选择一个双方都喜欢的简单仪式","motif":"浪漫与星光","no":"06","tags":["仪式感天花板","情绪浓度高","故事感恋人"],"contrast":"外表浪漫感性、像个理想主义诗人，其实对对方是不是真心投入，直觉敏锐得可怕。","match":["热情分享家","一个擅长制造浪漫，一个擅长给出满格回应，情绪价值拉满。"],"clash":["理性观察者","你期待惊喜与共振，对方习惯务实冷静，容易让你觉得少点火花。"],"vibe":"心动开关：突然递来的一支花、手写卡片和记得你的每句梦话"},{"name":"安静倾听者","vector":[2,0,1,2],"tag":"恋爱人格","quote":"有些爱，不必喧哗也能听见。","insight":"你是感情里最稀缺的“情绪承托者”。你不一定说最多的话，但总能敏锐察觉伴侣没说出口的委屈与疲惫。在你身边，对方不需要伪装坚强，可以放心卸下所有防备。","strength":"耐心、体察细节","caution":"不要只听对方而忽略自己的需要","action":"在倾听后也分享自己的感受和想法","motif":"倾听与柔光","no":"07","tags":["共情力满格","温柔接住","静默深情"],"contrast":"总能把别人的心事听得明明白白，轮到自己受委屈时却习惯悄悄咽下，怕给对方添麻烦。","match":["坦诚沟通者","对方会主动问你的感受，引导你把心事说出来，双向治愈。"],"clash":["自由旅人","你习惯默默守候，对方习惯各自精彩，容易让你悄悄积攒失落。"],"vibe":"心动开关：对方突然停下来认真问你“那你今天开心吗”"},{"name":"热情分享家","vector":[3,2.8,2.8,1.8],"tag":"恋爱人格","quote":"我想把今天的每一点快乐，都分享给你。","insight":"路上看见一只可爱的猫、中午吃到一碗好吃的面，你第一反应就是拍给喜欢的人。对你来说，分享欲就是最高级的浪漫——你渴望把鲜活的日常一点点织进两个人的共同世界里。","strength":"热情、善于创造互动","caution":"双方不一定总有同样的社交能量","action":"先询问对方什么时候有空，再分享一件趣事","motif":"分享与晴天","no":"08","tags":["分享欲=爱意","小太阳体质","高频互动"],"contrast":"看起来元气满满、永远秒回，其实内心特别在意“碎碎念有没有被认真接住”。","match":["直球行动派","分享欲遇上行动力，句句有回应、件件有着落。"],"clash":["理性观察者","你兴致勃勃发十条消息，对方回一个“嗯不错”，瞬间浇灭热情。"],"vibe":"心动开关：每一条奇奇怪怪的废话，都能收到认真的接梗和回应"},{"name":"稳健同行者","vector":[2,2,1,1],"tag":"恋爱人格","quote":"不必跑得太快，只要一起走得稳。","insight":"你在亲密与空间、感性与理性之间有着难得的成熟平衡。你不追求大起大落的虐恋，更相信细水长流的协作与共同成长——把爱落到柴米油盐和共同目标里，走得稳比跑得快更重要。","strength":"平衡承诺和日常协作","caution":"别因追求稳定而推迟必要的谈话","action":"每隔一段时间交流双方近期的相处感受","motif":"稳定与同行","no":"09","tags":["长期伴侣顶配","情绪稳压器","双向奔赴"],"contrast":"看似淡定务实、像个情绪稳定的大人，其实在信任的人面前也会露出柔软撒娇的一面。","match":["温柔陪伴者","步调一致、三观契合，是能把日子越过越踏实的模范搭档。"],"clash":["独立探索者","你偏爱安稳确定的规划，对方热爱随时出发的新鲜感，需要磨合。"],"vibe":"心动开关：遇到分歧时不逃避不指责，而是说“我们一起想办法”"},{"name":"独立探索者","vector":[0,2,3,1],"tag":"恋爱人格","quote":"我有自己的远方，也愿与你相遇。","insight":"你需要一个能一起看世界、而不是把彼此困在原地的人。你有自己的热爱与野心，在心动时也会大方主动出击；最好的关系不是彼此捆绑，而是牵着手去解锁更辽阔的人生副本。","strength":"独立、探索力强","caution":"新鲜感和长期投入需要兼顾","action":"在个人计划之外安排可持续的共同活动","motif":"独立与探索","no":"10","tags":["鲜活有趣","成长型恋爱","灵魂共振"],"contrast":"平时独立飒爽、看起来百毒不侵，其实只要遇到真正欣赏你野心的人，瞬间变得温柔。","match":["自由旅人","同样热爱探索与独立，既是恋人也是最默契的冒险搭子。"],"clash":["细腻理想家","你向前奔跑看风景，对方渴望停下来深情凝视，容易产生落差。"],"vibe":"心动开关：支持你的奇思妙想，并愿意一起尝试人生新体验"},{"name":"坦诚沟通者","vector":[1,3,2,3],"tag":"恋爱人格","quote":"真正的靠近，从说清楚开始。","insight":"你坚信“猜来猜去消耗爱，说清楚才能真正靠近”。你愿意坦率表达需求，也尊重对方的底线；发生矛盾时不冷暴力、不翻旧账，只对事不对人地一起找到让两个人都舒服的解法。","strength":"善于提出需求、共同解决问题","caution":"避免把沟通变成急于得出结论","action":"讨论前确认双方是否有精力进行对话","motif":"坦诚与边界","no":"11","tags":["反内耗专家","清晰边界","高质量亲密"],"contrast":"表面理性通透、像个情感导师，其实内心极其柔软，只是习惯用清晰表达来保护关系。","match":["理性观察者","沟通零障碍、尊重彼此节奏，把亲密关系处得清澈又长久。"],"clash":["慢热守护者","你希望有问题当面摊开聊，对方需要躲起来慢慢消化，容易着急。"],"vibe":"心动开关：吵架也能好好说话，把“我需要什么”坦诚摆在桌面上"},{"name":"细腻理想家","vector":[3,0,0,0],"tag":"恋爱人格","quote":"温柔不是猜中所有心事，而是愿意认真感受。","insight":"你对情感的纯度与精神契合有着极高的向往。你不会轻易敞开心扉，但一旦确认眼前人值得托付，你会释放出如月光般温柔绵长的深情，连空气里最细微的情绪波动都能温柔接住。","strength":"细腻、珍惜连接","caution":"不要期待对方自动察觉所有感受","action":"把一个尚未说出口的期待转成具体请求","motif":"细腻与月光","no":"12","tags":["灵魂共鸣控","月光般深情","极度敏感温柔"],"contrast":"外壳安静清冷、自带一层保护色，内心却藏着一片只为懂你的人开放的星空。","match":["安静倾听者","无须多言就能读懂你的细腻心事，给你最深层的精神安抚。"],"clash":["直球行动派","对方节奏太快太直白，偶尔会让你来不及做好心理准备。"],"vibe":"心动开关：在人群里悄悄递来的一个懂你的眼神"}],"brand":"LOVE ATLAS","heroTitle":"心动档案","heroSub":"THE WAY YOU LOVE","intro":"你习惯如何靠近一个人，又怎样守护自己的空间？从日常相处的选择中，发现自己的关系偏好。单身也可以按理想情境作答。","disclaimer":"结果不诊断依恋类型、心理状态或关系质量，不决定你适合谁。","labels":["你的隐藏恋爱人格画像","一个可以尝试的相处小练习","宿命恋人匹配 & 反差CP"],"art":"<svg viewBox=\"0 0 640 260\" preserveAspectRatio=\"xMidYMid slice\" xmlns=\"http://www.w3.org/2000/svg\">\n      <defs>\n        <linearGradient id=\"lSky\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop stop-color=\"#3c1324\"/><stop offset=\".52\" stop-color=\"#6d2644\"/><stop offset=\"1\" stop-color=\"#a85a6f\"/></linearGradient>\n        <radialGradient id=\"lGlow\" cx=\"75%\" cy=\"46%\" r=\"50%\"><stop stop-color=\"#f7c8ae\" stop-opacity=\".46\"/><stop offset=\"1\" stop-color=\"#f7c8ae\" stop-opacity=\"0\"/></radialGradient>\n        <linearGradient id=\"lHeart\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop stop-color=\"#fce0cc\"/><stop offset=\"1\" stop-color=\"#d6917d\"/></linearGradient>\n      </defs>\n      <rect width=\"640\" height=\"260\" fill=\"url(#lSky)\"/>\n      <circle cx=\"478\" cy=\"118\" r=\"165\" fill=\"url(#lGlow)\"/>\n      <!-- Celestial He /* === Thematic Web Audio Sound Engine (Pure Offline Synth) === */
const SFX = (() => {
  let ctx = null, muted = false;
  try { muted = localStorage.getItem(STORAGE + ':mute') === '1'; } catch {}
  function ac() {
    if (muted) return null;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      if (!ctx) ctx = new AC();
      if (ctx.state === 'suspended') ctx.resume().catch(() => {});
      return ctx;
    } catch { return null; }
  }
  function tone(freq, dur, type = 'sine', gainVal = 0.055, delay = 0, endFreq = null) {
    const c = ac(); if (!c) return;
    try {
      const t = c.currentTime + delay;
      const o = c.createOscillator(), g = c.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      if (endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(gainVal, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(c.destination);
      o.start(t); o.stop(t + dur + 0.02);
    } catch {}
  }
  const PRESETS = {
    city:    { notes: [523.25, 587.33, 659.25, 783.99], wave: 'triangle', gain: 0.05 },
    love:    { notes: [587.33, 659.25, 739.99, 880.00], wave: 'sine',     gain: 0.048 },
    ancient: { notes: [440.00, 493.88, 587.33, 659.25], wave: 'triangle', gain: 0.052 },
    scent:   { notes: [659.25, 739.99, 880.00, 987.77], wave: 'sine',     gain: 0.042 },
    qc:      { notes: [620, 740, 860, 980],             wave: 'square',   gain: 0.024 },
    shop:    { notes: [523.25, 659.25, 783.99, 1046.5], wave: 'triangle', gain: 0.046 },
    museum:  { notes: [392.00, 440.00, 523.25, 587.33], wave: 'sine',     gain: 0.052 },
    rpg:     { notes: [523.25, 659.25, 783.99, 1046.5], wave: 'triangle', gain: 0.045 },
    cosmos:  { notes: [587.33, 739.99, 880.00, 1174.6], wave: 'sine',     gain: 0.042 }
  };
  const P = PRESETS["love"] || PRESETS.city;
  return {
    isMuted: () => muted,
    toggle() {
      muted = !muted;
      try { localStorage.setItem(STORAGE + ':mute', muted ? '1' : '0'); } catch {}
      if (!muted) this.click(1);
      return muted;
    },
    click(i = 0) {
      const f = P.notes[Math.abs(i) % P.notes.length];
      tone(f, 0.16, P.wave, P.gain);
      if (false) {
        tone(f * 2, 0.22, 'sine', P.gain * 0.35, 0.015);
      }
    },
    start() {
      tone(P.notes[0], 0.14, P.wave, P.gain, 0);
      tone(P.notes[2], 0.22, 'sine', P.gain * 0.9, 0.07);
    },
    back() {
      tone(P.notes[0] * 0.85, 0.11, 'sine', P.gain * 0.7);
    },
    chapter() {
      tone(P.notes[1], 0.16, 'sine', P.gain * 0.8, 0);
      tone(P.notes[3], 0.28, 'sine', P.gain * 0.75, 0.09);
    },
    reveal() {
      P.notes.forEach((f, k) => tone(f, 0.32, k === 3 ? 'sine' : P.wave, P.gain * 0.9, k * 0.08));
    }
  };
})();

/* === Celebratory Particle Burst (Respects Reduced Motion) === */
function celebrateBurst(colors, style = 'spark') {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  try {
    const cv = document.createElement('canvas');
    cv.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999';
    cv.width = window.innerWidth; cv.height = window.innerHeight;
    document.body.append(cv);
    const ctx = cv.getContext('2d');
    const parts = [];
    const cx = cv.width / 2, cy = Math.min(cv.height * 0.36, 280);
    for (let i = 0; i < 42; i++) {
      const ang = (Math.PI * 2 * i) / 42 + (Math.random() - 0.5) * 0.35;
      const spd = 2.6 + Math.random() * 5.8;
      parts.push({
        x: cx + (Math.random() - 0.5) * 40,
        y: cy + (Math.random() - 0.5) * 20,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - 2.4,
        r: 3 + Math.random() * 4.5,
        rot: Math.random() * Math.PI * 2,
        vr: (Math.random() - 0.5) * 0.2,
        color: colors[i % colors.length],
        life: 1,
        decay: 0.015 + Math.random() * 0.012
      });
    }
    let raf;
    function tick() {
      ctx.clearRect(0, 0, cv.width, cv.height);
      let alive = 0;
      for (const p of parts) {
        if (p.life <= 0) continue;
        alive++;
        p.x += p.vx; p.y += p.vy; p.vy += 0.13; p.vx *= 0.985; p.rot += p.vr; p.life -= p.decay;
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        if (style === 'petal') {
          ctx.beginPath(); ctx.ellipse(0, 0, p.r * 1.4, p.r * 0.72, 0, 0, Math.PI * 2); ctx.fill();
        } else if (style === 'star') {
          ctx.beginPath();
          for (let s = 0; s < 4; s++) {
            const a = s * Math.PI / 2;
            ctx.lineTo(Math.cos(a) * p.r * 1.5, Math.sin(a) * p.r * 1.5);
            ctx.lineTo(Math.cos(a + Math.PI / 4) * p.r * 0.45, Math.sin(a + Math.PI / 4) * p.r * 0.45);
          }
          ctx.closePath(); ctx.fill();
        } else if (style === 'bubble') {
          ctx.strokeStyle = p.color; ctx.lineWidth = 1.6;
          ctx.beginPath(); ctx.arc(0, 0, p.r * 1.15, 0, Math.PI * 2); ctx.stroke();
        } else {
          ctx.fillRect(-p.r, -p.r * 0.55, p.r * 2, p.r * 1.1);
        }
        ctx.restore();
      }
      if (alive > 0) raf = requestAnimationFrame(tick);
      else cv.remove();
    }
    raf = requestAnimationFrame(tick);
    setTimeout(() => { cancelAnimationFrame(raf); cv.remove(); }, 2200);
  } catch {}
}

/* === Subtle 3D Foil Tilt on Result Hero Card === */
function bindCardTilt(el) {
  if (!el || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
  el.classList.add('foil-tilt');
  const onMove = e => {
    const r = el.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width;
    const py = (e.clientY - r.top) / r.height;
    const rx = (0.5 - py) * 5.5, ry = (px - 0.5) * 6.5;
    el.style.transform = `perspective(900px) rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg)`;
    el.style.setProperty('--mx', (px * 100).toFixed(1) + '%');
    el.style.setProperty('--my', (py * 100).toFixed(1) + '%');
  };
  const onLeave = () => {
    el.style.transform = '';
    el.style.setProperty('--mx', '50%');
    el.style.setProperty('--my', '20%');
  };
  el.addEventListener('pointermove', onMove);
  el.addEventListener('pointerleave', onLeave);
}

/* === Dynamic Multi-Axis SVG Radar Chart (4 or 6 Axes) === */
function buildRadarSVG(labels, ratios, opts = {}) {
  const n = labels.length, cx = 140, cy = 122, R = 74;
  const stroke = opts.stroke || 'var(--accent)';
  const fill = opts.fill || 'var(--accent)';
  const grid = opts.grid || 'rgba(128,128,128,0.22)';
  const labelColor = opts.labelColor || 'currentColor';
  const pt = (i, r) => {
    const a = -Math.PI / 2 + (Math.PI * 2 * i) / n;
    return [cx + Math.cos(a) * r, cy + Math.sin(a) * r];
  };
  let rings = '';
  [0.34, 0.67, 1].forEach(f => {
    const pts = Array.from({ length: n }, (_, i) => pt(i, R * f).map(x => x.toFixed(1)).join(',')).join(' ');
    rings += `<polygon points="${pts}" fill="none" stroke="${grid}" stroke-width="1"/>`;
  });
  let spokes = '';
  for (let i = 0; i < n; i++) {
    const [x, y] = pt(i, R);
    spokes += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${grid}" stroke-width="1"/>`;
  }
  const clamped = ratios.map(r => Math.max(0.18, Math.min(1, r)));
  const polyPts = clamped.map((r, i) => pt(i, R * r).map(x => x.toFixed(1)).join(',')).join(' ');
  const dots = clamped.map((r, i) => {
    const [x, y] = pt(i, R * r);
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.2" fill="${stroke}" stroke="${opts.dotRing || '#fff'}" stroke-width="1.8"/>`;
  }).join('');
  const texts = labels.map((lb, i) => {
    const [x, y] = pt(i, R + 22);
    const anchor = Math.abs(x - cx) < 10 ? 'middle' : x < cx ? 'end' : 'start';
    const dy = y < cy - 30 ? -2 : y > cy + 30 ? 8 : 4;
    return `<text x="${x.toFixed(1)}" y="${(y + dy).toFixed(1)}" text-anchor="${anchor}" font-size="11" font-weight="700" fill="${labelColor}">${esc(lb)}</text>`;
  }).join('');
  return `<svg class="radar-svg" viewBox="0 0 280 244" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="多维人格雷达图">
    ${rings}${spokes}
    <polygon class="radar-poly" points="${polyPts}" fill="${fill}" fill-opacity="0.24" stroke="${stroke}" stroke-width="2.2" stroke-linejoin="round"/>
    ${dots}${texts}
  </svg>`;
}

/* === Canvas Mini Radar Drawing Helper (for 3:4 Posters) === */
function drawCanvasRadar(ctx, cx, cy, R, labels, ratios, stroke, fill, grid, textCol) {
  const n = labels.length;
  const pt = (i, r) => {
    const a = -Math.PI / 2 + (Math.PI * 2 * i) / n;
    return [cx + Math.cos(a) * r, cy + Math.sin(a) * r];
  };
  ctx.save();
  [0.35, 0.68, 1].forEach(f => {
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const [x, y] = pt(i, R * f);
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.closePath(); ctx.strokeStyle = grid; ctx.lineWidth = 1.4; ctx.stroke();
  });
  for (let i = 0; i < n; i++) {
    const [x, y] = pt(i, R);
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(x, y); ctx.strokeStyle = grid; ctx.lineWidth = 1.2; ctx.stroke();
  }
  ctx.beginPath();
  ratios.forEach((r, i) => {
    const [x, y] = pt(i, R * Math.max(0.2, Math.min(1, r)));
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  });
  ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
  ctx.strokeStyle = stroke; ctx.lineWidth = 3; ctx.stroke();
  ratios.forEach((r, i) => {
    const [x, y] = pt(i, R * Math.max(0.2, Math.min(1, r)));
    ctx.beginPath(); ctx.arc(x, y, 5.5, 0, Math.PI * 2); ctx.fillStyle = stroke; ctx.fill();
  });
  ctx.fillStyle = textCol; ctx.font = '700 18px "PingFang SC","Microsoft YaHei",sans-serif';
  labels.forEach((lb, i) => {
    const [x, y] = pt(i, R + 24);
    ctx.textAlign = Math.abs(x - cx) < 12 ? 'center' : x < cx ? 'right' : 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(lb, x, y);
  });
  ctx.restore();
}

/* === Isolated Local Collection Dex Helpers === */
function getUnlocked() {
  try {
    const raw = JSON.parse(localStorage.getItem(STORAGE + ':dex') || '[]');
    return Array.isArray(raw) ? raw : [];
  } catch { return []; }
}
function recordUnlock(name) {
  try {
    const list = getUnlocked();
    if (!list.includes(name)) { list.push(name); localStorage.setItem(STORAGE + ':dex', JSON.stringify(list)); }
    return list;
  } catch { return [name]; }
}

/* === Vector Pair Compatibility Calculator === */
function calcVectorChem(pA, pB, axes, labelsCfg = {}) {
  if (pA.name === pB.name) {
    return {
      score: 94,
      verdict: labelsCfg.same || '✦ 镜像双生 · 灵魂复刻',
      desc: `两个「${pA.name}」相遇就像照镜子——不用多余解释就能一秒接住彼此的梗与节奏，连沉默的频率都惊人一致！`
    };
  }
  if (pA.match && pA.match[0] === pB.name) {
    return { score: 99, verdict: labelsCfg.match || '♥ 天选官配 · 满分同频', desc: pA.match[1] };
  }
  if (pB.match && pB.match[0] === pA.name) {
    return { score: 97, verdict: labelsCfg.match || '♥ 双向奔赴 · 绝佳搭子', desc: pB.match[1] };
  }
  if (pA.clash && pA.clash[0] === pB.name) {
    return { score: 54, verdict: labelsCfg.clash || '⚡ 宿命反差 · 欢喜冤家', desc: pA.clash[1] };
  }
  if (pB.clash && pB.clash[0] === pA.name) {
    return { score: 56, verdict: labelsCfg.clash || '⚡ 高能反差 · 奇妙碰撞', desc: pB.clash[1] };
  }
  const vecA = pA.vector, vecB = pB.vector;
  const diffs = vecA.map((x, i) => ({ i, d: Math.abs(x - vecB[i]) }));
  const avgDiff = diffs.reduce((s, x) => s + x.d, 0) / diffs.length;
  const sim = Math.max(0, 1 - avgDiff / 3);
  const hashSeed = [...(pA.name + pB.name)].reduce((a, c) => (a * 31 + c.charCodeAt(0)) % 997, 7);
  const score = Math.round(Math.max(62, Math.min(95, 65 + sim * 27 + (hashSeed % 5))));
  const closest = diffs.slice().sort((a, b) => a.d - b.d)[0];
  const farthest = diffs.slice().sort((a, b) => b.d - a.d)[0];
  let verdict = '🌿 舒服同频 · 轻松相处';
  if (score >= 88) verdict = '✦ 默契神搭 · 能量共振';
  else if (score >= 78) verdict = '♥ 互补合拍 · 越处越甜';
  else if (score < 70) verdict = '🔥 跨频火花 · 新鲜感拉满';
  const desc = `你们在「${axes[closest.i][0]}」维度上天然同频，很容易快速聊到一块；而在「${axes[farthest.i][0]}」上的不同视角，正好能给彼此带来意想不到的新鲜灵感。`;
  return { score, verdict, desc };
}

function start(){
  if(screen==='home'&&restore()?.answers.some(v=>v!==null)&&!confirm('开始新测试将清除上次进度，继续吗？')) return;
  SFX.start();
  idx=0;answers=Array(N).fill(null);report=null;lastChapter=0;stash();question(true);
}

function resume(){
  SFX.start();
  const saved=restore();if(!saved)return start();
  idx=saved.idx;answers=saved.answers;
  if(answers.every(v=>v!==null)){result(false);return;}
  if(answers.slice(0,idx).some(v=>v===null)) idx=answers.indexOf(null);
  lastChapter=getChapter(idx).ci;
  question(true);
}

function toggleAuto(){SFX.click(0);autoNext=!autoNext;stash();question(false);}

function getChapter(qIdx){
  const chs=D.chapters;
  const per=Math.ceil(N/chs.length);
  const ci=Math.min(chs.length-1,Math.floor(qIdx/per));
  return {ci,num:String(ci+1).padStart(2,'0'),...chs[ci]};
}

function question(move=false){
  if(autoTimer){clearTimeout(autoTimer);autoTimer=null;}

function compute(input){
  if(input.length!==N||input.some(v=>!Number.isInteger(v)||v<0||v>3)) throw Error('Incomplete answers');
  const sums=D.axes.map(()=>0), counts=D.axes.map(()=>0);
  D.questions.forEach((q,i)=>{sums[q.axis]+=q.options[input[i]].score;counts[q.axis]++;});
  const v=sums.map((s,i)=>s/counts[i]);
  const ranked=D.profiles.map((p,i)=>{
    const center=p.vector.map(x=>x-1.5);
    const norm=Math.hypot(...center)||1;
    const radius=Math.sqrt(v.length)*0.5+0.15*(norm-Math.sqrt(v.length));
    const calibrated=center.map(x=>1.5+x*radius/norm);
    const d=calibrated.reduce((s,x,j)=>s+(x-v[j])**2,0);
    const rawSim=Math.max(0,1-Math.sqrt(d/(4.2*v.length)));
    const fit=Math.round(Math.max(62,Math.min(98,66+rawSim*32)));
    return {p,i,d,fit};
  });
  ranked.sort((a,b)=>a.d-b.d||a.i-b.i);
  for(let k=1;k<Math.min(4,ranked.length);k++){
    if(ranked[k].fit>=ranked[k-1].fit) ranked[k].fit=Math.max(60,ranked[k-1].fit-2);
  }
  return {v,ranked,p:ranked[0].p};
}

function wrap(ctx,text,max){
  const out=[];let line='';
  for(const ch of text){
    if(line&&ctx.measureText(line+ch).width>max){out.push(line);line=ch;}
    else line+=ch;
  }
  if(line) out.push(line);
  return out;
}
function roundedPath(ctx,x,y,w,h,r){
  ctx.beginPath();
  if(typeof ctx.roundRect==='function') ctx.roundRect(x,y,w,h,r);
  else{r=Math.min(r,w/2,h/2);ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
}
function fillRound(ctx,x,y,w,h,r){roundedPath(ctx,x,y,w,h,r);ctx.fill();}
function strokeRound(ctx,x,y,w,h,r){roundedPath(ctx,x,y,w,h,r);ctx.stroke();}

  ctx.fillStyle = INK; ctx.font = `400 24px ${sans}`;
  wrap(ctx, p.contrast, 900).slice(0, 2).forEach((l, i) => ctx.fillText(l, 88, 998 + i * 36));

  // Duo Match / Clash
  const dy = 1078, dh = 232;
  ctx.fillStyle = CARD; fillRound(ctx, 56, dy, 472, dh, 20);
  ctx.strokeStyle = LINE; ctx.lineWidth = 1.5; strokeRound(ctx, 56, dy, 472, dh, 20);
  ctx.fillStyle = ACC; ctx.font = `800 21px ${sans}`; ctx.fillText('♥ 宿命甜度搭子', 84, dy + 42);
  ctx.fillStyle = INK; ctx.font = `800 34px ${serif}`; ctx.fillText(p.match[0], 84, dy + 94);
  ctx.fillStyle = MUTED; ctx.font = `400 21px ${sans}`;
  wrap(ctx, p.match[1], 416).slice(0, 3).forEach((l, i) => ctx.fillText(l, 84, dy + 138 + i * 30));

  ctx.fillStyle = CARD; fillRound(ctx, 552, dy, 472, dh, 20);
  ctx.strokeStyle = LINE; ctx.lineWidth = 1.5; strokeRound(ctx, 552, dy, 472, dh, 20);
  ctx.fillStyle = GOLD; ctx.font = `800 21px ${sans}`; ctx.fillText('⚡ 容易错拍的碰撞型', 580, dy + 42);
  ctx.fillStyle = INK; ctx.font = `800 34px ${serif}`; ctx.fillText(p.clash[0], 580, dy + 94);
  ctx.fillStyle = MUTED; ctx.font = `400 21px ${sans}`;
  wrap(ctx, p.clash[1], 416).slice(0, 3).forEach((l, i) => ctx.fillText(l, 580, dy + 138 + i * 30));

  ctx.fillStyle = MUTED; ctx.font = `500 21px ${sans}`;
  ctx.fillText(`${D.title}  ·  长按保存发给在意的人`, 64, 1372);
  ctx.textAlign = 'right'; ctx.fillText('LOVE ATLAS · 原创趣味探索', 1016, 1372);
  ctx.textAlign = 'left';
  return c;
}

function renderPosterCanvas(){
  if(!report) return;
  const status=document.getElementById('posterStatus'),
        area=document.getElementById('posterArea'),
        download=document.getElementById('downloadPoster'),
        sig=(document.getElementById('sigInput')?.value||'').trim().slice(0,12);
  status.textContent='';area.innerHTML='';download.disabled=true;
  try{
    if(posterURL) URL.revokeObjectURL(posterURL);
    posterURL=null;
    const canvas=makePoster(posterTheme,sig);
    const img=document.createElement('img');
    img.className='poster';img.alt='可保存的专属结果海报';
    img.src=canvas.toDataURL('image/png');
    area.append(img);
    canvas.toBlob(blob=>{
      posterURL=blob?URL.createObjectURL(blob):img.src;
      download.disabled=false;
    },'image/png');
  }catch(e){
    status.textContent='当前浏览器不支持生成海报，可直接截图保存结果页。';
  }
}

function showPoster(){
  if(!report) return;
  SFX.click(3);
  renderPosterCanvas();
  if(!posterDialog.open) posterDialog.showModal();
}

document.querySelectorAll('[data-ptheme]').forEach(btn=>{
  btn.onclick=()=>{
    SFX.click(1);
    posterTheme=Number(btn.dataset.ptheme)||0;
    document.querySelectorAll('[data-ptheme]').forEach(x=>x.classList.toggle('active',x===btn));
    renderPosterCanvas();
  };
});
document.getElementById('sigApply').onclick=()=>{SFX.click(2);renderPosterCanvas();document.getElementById('posterStatus').textContent='✓ 海报已更新！';};
document.getElementById('closePoster').onclick=()=>posterDialog.close();
document.getElementById('downloadPoster').onclick=()=>{
  if(!posterURL||!report) return;
  const a=document.createElement('a');a.href=posterURL;a.download=D.kind+'-'+report.p.name+'.png';
  document.body.append(a);a.click();a.remove();
  document.getElementById('posterStatus').textContent='若微信/小红书内未自动下载，请直接长按上方图片保存。';
};
document.getElementById('closeCopy').onclick=()=>copyDialog.close();
document.getElementById('closePeek').onclick=()=>peekDialog.close();
document.getElementById('closeDex').onclick=()=>dexDialog.close();
document.getElementById('selectCopyBtn').onclick=()=>{
  const ta=document.getElementById('copyTextarea');ta.focus();ta.select();
};
document.addEventListener('keydown',e=>{
  if(screen!=='question'||posterDialog.open||copyDialog.open||peekDialog.open||dexDialog.open) return;
  if(e.target&&/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  const map={'1':0,'2':1,'3':2,'4':3,'a':0,'b':1,'c':2,'d':3,'A':0,'B':1,'C':2,'D':3};
  if(e.key in map){e.preventDefault();choose(map[e.key]);}
  else if(e.key==='ArrowLeft'||e.key==='Backspace'){e.preventDefault();back();}
  else if(e.key==='ArrowRight'||e.key==='Enter'){if(answers[idx]!==null){e.preventDefault();next();}}
});
initSoundToggle();
home();
</script>
