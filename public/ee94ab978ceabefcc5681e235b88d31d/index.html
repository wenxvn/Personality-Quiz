<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111316">
<meta name="description" content="如果把你放进博物馆，你是哪件「镇馆之宝」 · 24道馆藏情境探索，点亮你的16件原创器物展柜与3:4高级博物馆铭牌海报。">
<title>如果把你放进博物馆，你是哪件「镇馆之宝」 · SOUL MUSEUM</title>
<style>
:root{
  color-scheme:dark;
  --bg:#111316;--panel:#181b20;--panel2:#20242b;--ink:#f4efe6;--muted:#b4aea3;
  --brass:#d5b374;--brass-soft:rgba(213,179,116,.15);--line:rgba(213,179,116,.24);
  --line-dim:rgba(255,255,255,.10);--crimson:#c95c4b;
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --mono:"SF Mono","Menlo","Monaco","Consolas",monospace;
  --sans:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.7;-webkit-tap-highlight-color:transparent;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:
  radial-gradient(ellipse at 50% -10%,rgba(213,179,116,.16),transparent 58%),
  radial-gradient(ellipse at 85% 105%,rgba(125,168,158,.10),transparent 48%);z-index:-1}
main{width:min(100%,660px);padding:18px 16px max(34px,env(safe-area-inset-bottom));margin:auto}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 16px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--mono);font-size:11px;letter-spacing:2.4px;font-weight:800;color:var(--brass);display:flex;align-items:center;gap:7px}
.brand::before{content:"❖";font-size:13px;color:var(--brass)}
.issue{font-family:var(--mono);font-size:10.5px;color:var(--muted);white-space:nowrap;letter-spacing:.08em}
section.panel{border:1px solid var(--line);border-radius:24px;background:linear-gradient(180deg,var(--panel),#14171c);padding:clamp(18px,4.2vw,30px);box-shadow:0 26px 64px rgba(0,0,0,.48);overflow:hidden;animation:enter .3s cubic-bezier(.22,1,.36,1)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1,h2,h3,p{margin:0}
h1{font-family:var(--serif);font-size:clamp(28px,7.2vw,42px);font-weight:700;line-height:1.28;letter-spacing:.03em;color:var(--ink)}
h2{font-family:var(--serif);font-size:clamp(20px,5vw,26px);line-height:1.5;font-weight:700;color:var(--ink)}
h3{font-family:var(--serif);font-size:17px;margin-bottom:9px;font-weight:700;color:var(--ink)}
.eyebrow{font-family:var(--mono);color:var(--brass);font-size:10.5px;letter-spacing:2.2px;font-weight:700;margin:16px 0 7px;text-transform:uppercase}
.lead{font-size:14.5px;line-height:1.86;margin:12px 0 18px;color:var(--muted)}
.muted{font-size:12px;color:var(--muted)}
/* Museum Hero Showcase */
.hero{position:relative;isolation:isolate;height:clamp(198px,48vw,252px);background:#101216;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.hero svg{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,16,20,.04) 0%,rgba(14,16,20,.68) 100%);z-index:-1}
.hero-badge{position:absolute;top:14px;right:14px;padding:4px 11px;border-radius:99px;border:1px solid rgba(213,179,116,.52);background:rgba(17,19,22,.62);backdrop-filter:blur(6px);font-family:var(--mono);font-size:10px;letter-spacing:1.4px;font-weight:700;color:var(--brass)}
.hero-copy{position:absolute;bottom:16px;left:18px;right:16px}
.hero-copy small{font-family:var(--mono);font-size:10px;letter-spacing:2.8px;color:var(--brass);display:block;margin-bottom:3px}
.hero-copy strong{display:block;font-family:var(--serif);font-size:clamp(24px,6vw,33px);letter-spacing:3px;line-height:1.25;color:#fff}
.pills{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 20px}
.pill{font-size:12px;padding:5px 12px;border:1px solid var(--line-dim);border-radius:99px;background:rgba(255,255,255,.04);color:var(--muted);font-weight:500}
.pill.brass{border-color:rgba(213,179,116,.44);background:var(--brass-soft);color:var(--brass);font-weight:700}
.teaser-wrap{margin:22px 0 20px;padding-top:16px;border-top:1px dashed var(--line)}
.teaser-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.teaser-head span{font-family:var(--mono);font-size:11px;letter-spacing:1.5px;color:var(--brass);font-weight:700}
.teaser-head small{font-size:11px;color:var(--muted)}
.teasers{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.teaser{padding:12px 10px;border-radius:12px;background:var(--panel2);border:1px solid var(--line-dim);display:flex;flex-direction:column;gap:4px}
.teaser-bar{width:24px;height:4px;border-radius:99px;margin-bottom:3px}
.teaser b{font-family:var(--serif);font-size:13.5px;color:var(--ink);line-height:1.35}
.teaser span{font-size:10.5px;color:var(--brass)}
.teaser small{font-size:11px;color:var(--muted);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:var(--panel2);border:1px solid var(--line-dim);border-radius:13px;padding:13px 16px;min-height:48px;touch-action:manipulation;transition:transform .12s,border-color .18s,background .18s,box-shadow .18s}
button:active:not(:disabled){transform:scale(.988)}
button:focus-visible{outline:2.5px solid var(--brass);outline-offset:3px}
button:hover:not(:disabled){border-color:var(--brass)}
button:disabled{opacity:.36;cursor:not-allowed}
.primary{background:linear-gradient(135deg,#e1c387,#c39c58);color:#181410;border-color:transparent;font-weight:800;width:100%;text-align:center;box-shadow:0 8px 24px rgba(213,179,116,.22)}
.primary:hover:not(:disabled){filter:brightness(1.06)}
.secondary{width:100%;text-align:center;background:rgba(255,255,255,.04);border-color:var(--line)}
.subtle{background:transparent;border:0;text-align:center;color:var(--muted);font-size:12px;padding:8px;min-height:36px}
.subtle:hover{color:var(--brass)}
.stack{display:grid;gap:10px}
.actions-row{display:grid;grid-template-columns:1.25fr 1fr;gap:10px}
.notice{font-size:12px;color:var(--muted);line-height:1.72;margin-top:14px}
/* Quiz Screen */
.question-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;color:var(--brass);font-weight:700}
.auto-toggle{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;border:1px solid var(--line-dim);background:rgba(255,255,255,.04);color:var(--muted);font-family:var(--sans);font-size:11px;font-weight:600;min-height:28px}
.auto-toggle.on{border-color:rgba(213,179,116,.5);color:var(--brass);background:var(--brass-soft)}
.progress{height:5px;background:rgba(255,255,255,.08);overflow:hidden;border-radius:12px;margin:11px 0 18px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#95b8ae,var(--brass));border-radius:12px;transition:width .28s cubic-bezier(.22,1,.36,1)}
.chapter-bar{display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--line-dim);border-left:3px solid var(--brass);margin-bottom:20px}
.chapter-num{font-family:var(--serif);font-size:20px;font-weight:700;color:var(--brass);line-height:1}
.chapter-bar strong{display:block;font-size:13px;color:var(--ink)}
.chapter-bar span{display:block;font-size:11.5px;color:var(--muted);line-height:1.45}
.options{display:grid;gap:10px;margin:20px 0 22px}
.option{display:flex;text-align:left;align-items:center;gap:12px;min-height:60px;width:100%;padding:13px 14px;line-height:1.55;background:var(--panel2);color:var(--ink)}
.option .letter{display:grid;place-items:center;flex:0 0 29px;height:29px;border-radius:50%;background:rgba(255,255,255,.05);color:var(--brass);font-family:var(--mono);font-weight:800;font-size:12px;border:1px solid var(--line);transition:all .16s}
.option.selected{border-color:var(--brass);background:rgba(213,179,116,.13);box-shadow:0 6px 20px rgba(213,179,116,.12)}
.option.selected .letter{background:var(--brass);color:#181410;border-color:var(--brass)}
.option .check{margin-left:auto;color:var(--brass);font-weight:800;font-size:15px}
.nav{display:grid;grid-template-columns:1fr 1.6fr;gap:10px}
/* Spotlight Appraisal Ritual */
.calc-box{text-align:center;padding:40px 10px 30px}
.beam-wrap{width:110px;height:96px;margin:0 auto 20px;position:relative}
.beam{position:absolute;inset:0;background:conic-gradient(from 160deg at 50% 0%,rgba(213,179,116,.38),rgba(213,179,116,.04) 40deg,transparent 42deg);clip-path:polygon(44% 0,56% 0,100% 100%,0 100%);animation:pulse 1.2s ease-in-out infinite alternate}
.pedestal{position:absolute;bottom:0;left:22px;right:22px;height:14px;border:1.5px solid var(--brass);border-radius:3px;background:var(--panel2)}
.relic-gem{position:absolute;bottom:22px;left:50%;width:28px;height:28px;margin-left:-14px;border:2px solid var(--brass);transform:rotate(45deg);background:rgba(213,179,116,.18);animation:floatGem 1.2s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.45}to{opacity:1}}
@keyframes floatGem{from{transform:rotate(45deg) translateY(2px)}to{transform:rotate(45deg) translateY(-5px)}}
.calc-step{font-family:var(--serif);font-size:19px;color:var(--ink);margin-bottom:8px;min-height:1.6em}
.calc-sub{font-size:12px;color:var(--muted)}
/* Result Glass Vitrine & Brass Plaque */
.vitrine-card{border:1px solid var(--line);border-radius:20px;overflow:hidden;background:radial-gradient(ellipse at 50% 0%,color-mix(in srgb,var(--relic-glow,var(--brass)) 26%,transparent),transparent 62%),#12151a}
.vitrine-head{display:flex;justify-content:space-between;align-items:center;padding:13px 18px;border-bottom:1px solid rgba(255,255,255,.07);font-family:var(--mono);font-size:10.5px;color:var(--brass);letter-spacing:1.2px}
.fit-pill{padding:3px 10px;border-radius:99px;background:rgba(213,179,116,.16);border:1px solid rgba(213,179,116,.46);color:var(--brass);font-weight:800}
.vitrine-stage{position:relative;padding:18px 16px 12px;text-align:center}
.vitrine-stage svg{width:176px;height:186px;display:block;margin:0 auto;filter:drop-shadow(0 16px 26px rgba(0,0,0,.6))}
.plinth{width:146px;height:10px;margin:-4px auto 0;border-radius:3px;background:linear-gradient(90deg,#292d35,#3e434d,#292d35);border:1px solid rgba(213,179,116,.38)}
.plaque{margin:14px 16px 16px;padding:16px 16px 14px;border:1px solid rgba(213,179,116,.42);border-radius:12px;background:linear-gradient(160deg,rgba(213,179,116,.10),rgba(24,27,32,.92));position:relative}
.plaque::before,.plaque::after{content:"•";position:absolute;top:6px;color:rgba(213,179,116,.55);font-size:12px}
.plaque::before{left:10px}.plaque::after{right:10px}
.plaque-era{font-family:var(--mono);font-size:11px;letter-spacing:1.8px;color:var(--brass);text-align:center;margin-bottom:5px}
.relic-name{font-family:var(--serif);font-size:clamp(24px,6.4vw,34px);line-height:1.3;text-align:center;color:#fff;margin:2px 0 10px}
.plaque .pills{justify-content:center;margin:0 0 12px}
.quote-box{padding:11px 14px;border-top:1px solid rgba(213,179,116,.24);text-align:center}
.quote{font-family:var(--serif);font-size:16px;color:var(--brass);line-height:1.68}
/* Sections */
.block{padding:21px 0;border-bottom:1px solid var(--line-dim)}
.block:last-of-type{border:0;padding-bottom:10px}
.block p{font-size:14.5px;line-height:1.88;color:#dcd6cc}
.kicker{font-family:var(--mono);font-size:10px;letter-spacing:2.2px;color:var(--brass);font-weight:700;margin-bottom:5px;text-transform:uppercase}
.repair-card{margin-top:13px;padding:14px 15px;border-radius:12px;background:rgba(213,179,116,.08);border:1px solid rgba(213,179,116,.34)}
.repair-card b{display:block;font-family:var(--mono);font-size:11.5px;color:var(--brass);margin-bottom:5px;letter-spacing:.06em}
.repair-card p{font-size:13.5px;line-height:1.78;color:#efe9df}
.notice-plaque{margin-top:12px;padding:13px 15px;border-radius:12px;background:rgba(201,92,75,.11);border:1px dashed rgba(201,92,75,.52)}
.notice-plaque b{display:block;font-family:var(--mono);font-size:11px;color:#eb8978;margin-bottom:4px;letter-spacing:.08em}
.notice-plaque p{font-size:13.5px;color:#f4dfd9;line-height:1.72}
.axis{margin:15px 0}
.axis-head,.axis-labels{display:flex;justify-content:space-between;gap:10px;font-size:12px}
.axis-head strong{font-size:13px;color:var(--ink)}
.axis-head span{font-family:var(--mono);color:var(--brass);font-weight:700}
.axis-labels{color:var(--muted);font-size:11.5px}
.track{position:relative;height:8px;border-radius:9px;background:rgba(255,255,255,.08);margin:8px 0}
.track::before{content:"";position:absolute;left:50%;width:1px;height:8px;background:rgba(255,255,255,.2)}
.track i{position:absolute;width:15px;height:15px;top:-3.5px;border-radius:50%;background:var(--brass);border:2.5px solid var(--panel);box-shadow:0 0 0 1.5px var(--brass);transform:translateX(-50%)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.mini{padding:14px;border-radius:13px;background:var(--panel2);border:1px solid var(--line-dim)}
.mini b{display:block;font-family:var(--mono);color:var(--brass);font-size:11px;margin-bottom:6px}
.mini .partner-name{font-family:var(--serif);font-size:15.5px;font-weight:700;color:#fff;margin-bottom:5px;line-height:1.38}
.mini p{font-size:13px;line-height:1.68;color:var(--muted)}
.rank{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-dim);font-size:14px}
.rank:last-child{border:0}
.rank-left{display:flex;align-items:center;gap:10px}
.swatch{width:12px;height:12px;border-radius:50%;border:1px solid rgba(255,255,255,.3);flex:none}
.rank small{display:block;font-size:11px;color:var(--muted)}
.rank .pct{font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--brass);background:var(--brass-soft);padding:3px 9px;border-radius:99px}
.status-bar{font-family:var(--mono);font-size:12px;color:var(--brass);text-align:center;min-height:1.4em;margin:4px 0 6px;font-weight:700}
.footer{text-align:center;margin:20px 0 0;font-size:11px;color:var(--muted);line-height:1.8}
.poster{width:100%;max-width:360px;margin:10px auto;border-radius:12px;display:block;border:1px solid var(--line);box-shadow:0 14px 36px rgba(0,0,0,.5)}
dialog{width:min(calc(100% - 26px),460px);max-height:90dvh;overflow:auto;border:1px solid var(--line);border-radius:20px;padding:20px;background:var(--panel);color:var(--ink);box-shadow:0 26px 70px rgba(0,0,0,.7)}
dialog::backdrop{background:rgba(6,7,10,.78);backdrop-filter:blur(4px)}
.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.dialog-head button{min-height:36px;padding:4px 13px;font-size:13px}
.copy-area{width:100%;min-height:155px;border-radius:10px;border:1px solid var(--line);background:#12151a;color:var(--ink);padding:12px;font:inherit;font-size:13px;line-height:1.7;margin:10px 0}
@media(max-width:460px){
  main{padding:14px 12px 28px}
  .teasers,.duo,.actions-row{grid-template-columns:1fr}
  .option{font-size:14px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <header>
    <span class="brand">SOUL MUSEUM</span>
    <span class="issue">HALL 03 · 镇馆之宝特展</span>
  </header>
  <div id="app"></div>
  <footer class="footer">SOUL MUSEUM ARCHIVE · 原创东方美学趣味测试，非专业心理测评<br>无需登录 · 所有答题记录仅保存在你的本地浏览器</footer>
</main>

<dialog id="posterDialog" aria-labelledby="posterTitle">
  <div class="dialog-head">
    <h3 id="posterTitle">你的 3:4 镇馆之宝展柜海报</h3>
    <button id="closePoster" type="button">关闭</button>
  </div>
  <p class="muted">1080 × 1440 暗调美术馆珍藏卡 · 手机长按图片保存，电脑点击下方下载。</p>
  <div id="posterArea"></div>
  <div class="stack" style="margin-top:12px">
    <button class="primary" id="downloadPoster">下载高清 PNG 展柜海报</button>
  </div>
  <p class="status-bar" id="posterStatus" role="status"></p>
</dialog>

<dialog id="copyDialog" aria-labelledby="copyTitle">
  <div class="dialog-head">
    <h3 id="copyTitle">复制小红书分享文案</h3>
    <button id="closeCopy" type="button">关闭</button>
  </div>
  <p class="muted">长按或全选下方文案复制，搭配暗调展柜海报发笔记更容易引发围观晒馆藏。</p>
  <textarea id="copyTextarea" class="copy-area" readonly></textarea>
  <button class="primary" id="selectCopyBtn" type="button">全选文案</button>

<script>

function start(){

}

function resume(){
  const saved=restore();if(!saved)return start();
  idx=saved.idx;answers=saved.answers;
  if(answers.every(v=>v!==null)){result();return;}
  if(answers.slice(0,idx).some(v=>v===null)) idx=answers.indexOf(null);

function choose(i){
  if(screen!=='question'||!Number.isInteger(i)||i<0||i>3) return;
  answers[idx]=i;stash();

  btns.forEach((b,k)=>{

    if(sel&&!ck){ck=document.createElement('span');ck.className='check';ck.setAttribute('aria-hidden','true');ck.textContent='✓';b.append(ck);}
    if(!sel&&ck) ck.remove();
  });
  const nextBtn=app.querySelector('.nav .primary');
  if(nextBtn) nextBtn.disabled=false;
  const count=answers.filter(v=>v!==null).length;
  const pct=Math.round((count/N)*100);

  if(bar) bar.style.width=Math.max(4,pct)+'%';
  if(autoNext){

      else if(answers.some(v=>v===null)){idx=answers.indexOf(null);stash();question(true);}

function compute(input){
  if(input.length!==N||input.some(v=>!Number.isInteger(v)||v<0||v>3)) throw Error('Incomplete answers');
  const sums=D.axes.map(()=>0), cnts=D.axes.map(()=>0);
  const wSums=D.axes.map(()=>0), wCnts=D.axes.map(()=>0);
  D.questions.forEach((q,i)=>{
    const sc=q.options[input[i]].score;
    sums[q.axis]+=sc; cnts[q.axis]++;
    const w=1+i*0.012;
    wSums[q.axis]+=sc*w; wCnts[q.axis]+=w;
  });
  const v=sums.map((s,i)=>s/cnts[i]);
  const vw=wSums.map((s,i)=>s/wCnts[i]);
  const ranked=D.profiles.map((p,i)=>{
    const center=p.vector.map(x=>x-1.5);
    const norm=Math.hypot(...center)||1;
    const radius=Math.sqrt(vw.length)*0.52+0.12*(norm-Math.sqrt(vw.length));
    const cal=center.map(x=>1.5+x*radius/norm);
    const d=cal.reduce((s,x,j)=>s+(x-vw[j])**2,0);
    const rawSim=Math.max(0,1-Math.sqrt(d/(4.2*vw.length)));
    const fit=Math.round(Math.max(68,Math.min(98,68+rawSim*30)));
    return {p,i,d,fit};
  });
  ranked.sort((a,b)=>a.d-b.d||a.i-b.i);
  for(let k=1;k<Math.min(4,ranked.length);k++){
    if(ranked[k].fit>=ranked[k-1].fit) ranked[k].fit=Math.max(62,ranked[k-1].fit-2);
  }
  return {v,ranked,p:ranked[0].p};
}

function tendency(a,v){return v<1.18?a[1]:v>1.82?a[2]:'刚柔并济'}

async function copyShare(){

  const hook=D.shareHook.replace('{name}',p.name);
  const text=`${hook}\n${p.acc} | ${p.era} | 契合度 ${ranked[0].fit}%\n「${p.quote}」\n${p.notice}\n\n♥ 我的最佳联展搭档是【${p.match[0]}】，快来测测你是哪件镇馆之宝，评论区组个特展👇\n${D.shareTags}`;
  const st=document.getElementById('copyStatus');

}

function wrap(ctx,text,max){
  const out=[];let line='';
  for(const ch of text){
    if(line&&ctx.measureText(line+ch).width>max){out.push(line);line=ch;}
    else line+=ch;
  }
  if(line) out.push(line);
  return out;
}
function rPath(ctx,x,y,w,h,r){
  ctx.beginPath();
  if(typeof ctx.roundRect==='function') ctx.roundRect(x,y,w,h,r);
  else{r=Math.min(r,w/2,h/2);ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
}
function fillR(ctx,x,y,w,h,r){rPath(ctx,x,y,w,h,r);ctx.fill();}
function strokeR(ctx,x,y,w,h,r){rPath(ctx,x,y,w,h,r);ctx.stroke();}

// Native Canvas renderer for all 8 artifact silhouettes (100% reliable in WeChat/XHS WebViews)
function drawCanvasArtifact(ctx, cx, cy, scale, p){
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(scale, scale);
  const grad=ctx.createLinearGradient(-70,-70,70,80);
  grad.addColorStop(0,p.color2);grad.addColorStop(0.55,p.color1);grad.addColorStop(1,'#181c24');

  // Plinth shadow
  ctx.fillStyle='rgba(0,0,0,0.48)';ctx.beginPath();ctx.ellipse(0,82,58,10,0,0,Math.PI*2);ctx.fill();

  ctx.strokeStyle=p.color2;ctx.lineWidth=2.4;ctx.lineJoin='round';ctx.lineCap='round';
  if(p.shape==='vase'){
    ctx.fillStyle=grad;ctx.beginPath();
    ctx.moveTo(-18,-74);ctx.lineTo(18,-74);ctx.lineTo(14,-56);
    ctx.bezierCurveTo(50,-42,56,-2,40,42);ctx.lineTo(26,78);ctx.lineTo(-26,78);ctx.lineTo(-40,42);
    ctx.bezierCurveTo(-56,-2,-50,-42,-14,-56);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle=p.color2;ctx.beginPath();ctx.ellipse(0,-74,18,4.5,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#f2d594';ctx.lineWidth=1.8;ctx.beginPath();
    ctx.moveTo(-12,-34);ctx.lineTo(8,-10);ctx.lineTo(-6,18);ctx.lineTo(12,44);ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,0.36)';ctx.lineWidth=4.5;ctx.beginPath();
    ctx.moveTo(-28,-38);ctx.quadraticCurveTo(-38,0,-26,38);ctx.stroke();
  } else if(p.shape==='jade'){
    ctx.fillStyle=grad;ctx.beginPath();ctx.arc(0,0,68,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.save();ctx.setLineDash([7,6]);ctx.strokeStyle=p.color2;ctx.globalAlpha=0.55;ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(0,0,50,0,Math.PI*2);ctx.stroke();ctx.restore();
    ctx.fillStyle='#13161c';ctx.beginPath();ctx.arc(0,0,22,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.fillStyle='#d5b374';ctx.beginPath();ctx.arc(0,-80,6,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#d5b374';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(0,-74);ctx.lineTo(0,-66);ctx.stroke();
  } else if(p.shape==='box'){
    ctx.fillStyle=p.color1;ctx.beginPath();ctx.moveTo(-58,-36);ctx.lineTo(-46,-52);ctx.lineTo(46,-52);ctx.lineTo(58,-36);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle=grad;fillR(ctx,-68,-36,136,108,10);strokeR(ctx,-68,-36,136,108,10);
    ctx.strokeStyle='#15181e';ctx.lineWidth=3.5;ctx.beginPath();ctx.moveTo(-68,0);ctx.lineTo(68,0);ctx.stroke();
    ctx.strokeStyle=p.color2;ctx.lineWidth=1.4;strokeR(ctx,-55,-24,110,84,4);
    ctx.fillStyle='#d5b374';ctx.beginPath();ctx.arc(0,0,15,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#15181e';ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle='#15181e';ctx.beginPath();ctx.arc(0,0,5.5,0,Math.PI*2);ctx.fill();
  } else if(p.shape==='cup'){
    ctx.fillStyle=grad;ctx.beginPath();
    ctx.moveTo(-54,-56);ctx.lineTo(54,-56);ctx.lineTo(40,14);ctx.quadraticCurveTo(32,36,0,36);ctx.quadraticCurveTo(-32,36,-40,14);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle=p.color2;ctx.globalAlpha=0.55;ctx.beginPath();ctx.ellipse(0,-56,54,10,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.stroke();
    ctx.fillStyle=p.color2;ctx.beginPath();ctx.moveTo(-10,36);ctx.lineTo(10,36);ctx.lineTo(15,70);ctx.lineTo(-15,70);ctx.closePath();ctx.fill();
    ctx.fillStyle=p.color1;ctx.beginPath();ctx.ellipse(0,72,36,9,0,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,0.38)';ctx.lineWidth=4.5;ctx.beginPath();ctx.moveTo(-36,-42);ctx.lineTo(-28,12);ctx.stroke();
  } else if(p.shape==='scroll'){
    ctx.fillStyle=grad;fillR(ctx,-58,-58,116,124,4);strokeR(ctx,-58,-58,116,124,4);
    ctx.fillStyle='#2c241e';ctx.strokeStyle='#d5b374';ctx.lineWidth=2;
    fillR(ctx,-72,-66,17,140,6);strokeR(ctx,-72,-66,17,140,6);
    fillR(ctx,55,-66,17,140,6);strokeR(ctx,55,-66,17,140,6);
    ctx.strokeStyle='rgba(24,20,16,0.58)';ctx.lineWidth=2.5;
    [32,16,0,-16].forEach((lx,k)=>{ctx.beginPath();ctx.moveTo(lx,-38);ctx.lineTo(lx,38-k*5);ctx.stroke();});
    ctx.fillStyle='#c9493b';fillR(ctx,-40,24,18,18,2);
  } else if(p.shape==='mirror'){
    ctx.fillStyle=grad;ctx.beginPath();ctx.arc(0,0,68,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.strokeStyle='rgba(20,22,28,0.5)';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(0,0,54,0,Math.PI*2);ctx.stroke();
    ctx.save();ctx.setLineDash([5,5]);ctx.strokeStyle=p.color2;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,0,42,0,Math.PI*2);ctx.stroke();ctx.restore();
    ctx.fillStyle=p.color2;ctx.beginPath();ctx.arc(0,0,14,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#f5d58c';ctx.lineWidth=2.6;ctx.beginPath();ctx.moveTo(-42,-36);ctx.lineTo(-10,-12);ctx.lineTo(-20,16);ctx.lineTo(18,28);ctx.lineTo(42,46);ctx.stroke();
  } else if(p.shape==='ding'){
    ctx.strokeStyle=p.color2;ctx.lineWidth=5.5;
    ctx.beginPath();ctx.moveTo(-46,-30);ctx.lineTo(-46,-58);ctx.quadraticCurveTo(-46,-70,-34,-70);ctx.quadraticCurveTo(-24,-70,-24,-58);ctx.lineTo(-24,-34);ctx.stroke();
    ctx.beginPath();ctx.moveTo(24,-34);ctx.lineTo(24,-58);ctx.quadraticCurveTo(24,-70,34,-70);ctx.quadraticCurveTo(46,-70,46,-58);ctx.lineTo(46,-30);ctx.stroke();
    ctx.fillStyle=p.color1;ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(-38,34);ctx.lineTo(-44,76);ctx.lineTo(-28,76);ctx.lineTo(-22,36);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.moveTo(38,34);ctx.lineTo(44,76);ctx.lineTo(28,76);ctx.lineTo(22,36);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle=grad;ctx.beginPath();ctx.moveTo(-58,-34);ctx.lineTo(58,-34);ctx.lineTo(58,8);ctx.quadraticCurveTo(58,46,0,46);ctx.quadraticCurveTo(-58,46,-58,8);ctx.closePath();ctx.fill();ctx.stroke();
    strokeR(ctx,-48,-22,96,26,3);
    ctx.fillStyle=p.color2;ctx.beginPath();ctx.arc(-18,-9,5.5,0,Math.PI*2);ctx.arc(18,-9,5.5,0,Math.PI*2);ctx.fill();
  } else {
    // astrolabe
    ctx.fillStyle=p.color2;ctx.beginPath();ctx.moveTo(-28,76);ctx.lineTo(28,76);ctx.lineTo(14,56);ctx.lineTo(-14,56);ctx.closePath();ctx.fill();
    ctx.strokeStyle=p.color1;ctx.lineWidth=5.5;ctx.beginPath();ctx.arc(0,-4,62,0,Math.PI*2);ctx.stroke();
    ctx.strokeStyle=p.color2;ctx.lineWidth=2.2;ctx.beginPath();ctx.arc(0,-4,50,0,Math.PI*2);ctx.stroke();
    ctx.save();ctx.translate(0,-4);ctx.rotate(-0.48);ctx.beginPath();ctx.ellipse(0,0,60,22,0,0,Math.PI*2);ctx.stroke();ctx.restore();
    ctx.save();ctx.translate(0,-4);ctx.rotate(0.48);ctx.strokeStyle=p.color1;ctx.beginPath();ctx.ellipse(0,0,60,22,0,0,Math.PI*2);ctx.stroke();ctx.restore();
    ctx.strokeStyle='#f6e0aa';ctx.lineWidth=2.2;ctx.beginPath();ctx.moveTo(-52,48);ctx.lineTo(52,-56);ctx.stroke();
    ctx.fillStyle=grad;ctx.beginPath();ctx.arc(0,-4,12,0,Math.PI*2);ctx.fill();ctx.stroke();
  }
  ctx.restore();
}

function makePoster(){
  const c=document.createElement('canvas');c.width=1080;c.height=1440;
  const ctx=c.getContext('2d');if(!ctx) throw Error('Canvas unavailable');
  const {p,v,ranked}=report;
  const sans='"PingFang SC","Microsoft YaHei",sans-serif', serif='"Noto Serif SC","Songti SC","SimSun",serif', mono='"SF Mono","Menlo","Consolas",monospace';

  // Deep obsidian gallery backdrop
  const bg=ctx.createLinearGradient(0,0,0,1440);
  bg.addColorStop(0,'#171a20');bg.addColorStop(0.55,'#111317');bg.addColorStop(1,'#0c0d10');
  ctx.fillStyle=bg;ctx.fillRect(0,0,1080,1440);

  // Subtle brass museum outer frame
  ctx.strokeStyle='rgba(213,179,116,0.42)';ctx.lineWidth=2;strokeR(ctx,28,28,1024,1384,26);
  ctx.strokeStyle='rgba(213,179,116,0.16)';ctx.lineWidth=1;strokeR(ctx,40,40,1000,1360,20);

  // Top Header Metadata
  ctx.fillStyle='#d5b374';ctx.font=`700 22px ${mono}`;
  ctx.fillText('❖ SOUL MUSEUM  ·  镇馆之宝特展', 72, 92);
  ctx.textAlign='right';ctx.fillStyle='#b8b0a2';ctx.font=`700 20px ${mono}`;
  ctx.fillText(`${p.acc}  |  契合 ${ranked[0].fit}%`, 1008, 92);
  ctx.textAlign='left';

  // Illuminated Vitrine Hero Container
  const vy=122, vh=388;
  ctx.save();rPath(ctx,64,vy,952,vh,22);ctx.clip();
  ctx.fillStyle='#101216';ctx.fillRect(64,vy,952,vh);
  // Museum spotlight cone from ceiling
  const cone=ctx.createRadialGradient(255,vy+10,20,255,vy+190,280);
  cone.addColorStop(0,p.glow+'55');cone.addColorStop(0.65,p.glow+'18');cone.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=cone;ctx.fillRect(64,vy,952,vh);
  // Arch silhouette behind artifact
  ctx.strokeStyle='rgba(213,179,116,0.22)';ctx.lineWidth=1.6;
  ctx.beginPath();ctx.moveTo(125,vy+vh);ctx.lineTo(125,vy+140);ctx.arc(255,vy+140,130,Math.PI,0);ctx.lineTo(385,vy+vh);ctx.stroke();
  ctx.restore();
  ctx.strokeStyle='rgba(213,179,116,0.36)';ctx.lineWidth=1.6;strokeR(ctx,64,vy,952,vh,22);

  // Draw bespoke artifact inside left vitrine zone + plinth
  drawCanvasArtifact(ctx, 255, vy+182, 1.48, p);
  ctx.fillStyle='#232832';fillR(ctx,160,vy+316,190,18,4);
  ctx.strokeStyle='rgba(213,179,116,0.45)';ctx.lineWidth=1.5;strokeR(ctx,160,vy+316,190,18,4);

  // Right Brass Plaque Text inside Hero Vitrine
  const rx=428, rw=552;
  ctx.fillStyle='#d5b374';ctx.font=`700 22px ${mono}`;
  ctx.fillText(`ARCHIVE NO.${p.no}  ·  ${p.era}`, rx, vy+70);

  // Auto-wrapped artifact name (never clips!)
  const nameLines=wrap(ctx, p.name, rw);
  const nameSize=nameLines.length>1?46:52;
  ctx.fillStyle='#ffffff';ctx.font=`700 ${nameSize}px ${serif}`;
  nameLines.slice(0,2).forEach((l,i)=>ctx.fillText(l, rx, vy+138+i*60));

  // Hashtag pills
  const tagY = vy + (nameLines.length>1?232:186);
  let tx=rx;
  p.tags.forEach(t=>{
    const lbl='# '+t;ctx.font=`600 20px ${sans}`;
    const w=ctx.measureText(lbl).width+28;
    if(tx+w<995){
      ctx.fillStyle='rgba(213,179,116,0.14)';fillR(ctx,tx,tagY,w,38,19);
      ctx.strokeStyle='rgba(213,179,116,0.45)';ctx.lineWidth=1;strokeR(ctx,tx,tagY,w,38,19);
      ctx.fillStyle='#e8cfa0';ctx.fillText(lbl,tx+14,tagY+26);
      tx+=w+10;
    }
  });

  // Brass Quote inside vitrine bottom right
  const qy = tagY + 62;
  ctx.strokeStyle='rgba(213,179,116,0.32)';ctx.lineWidth=1.2;
  ctx.beginPath();ctx.moveTo(rx,qy-16);ctx.lineTo(980,qy-16);ctx.stroke();
  ctx.fillStyle='#f0d6a2';ctx.font=`600 26px ${serif}`;
  wrap(ctx,`「${p.quote}」`,rw).slice(0,2).forEach((l,i)=>ctx.fillText(l, rx, qy+18+i*38));

  // Section 1: Curator's Commentary & Restoration Log Card
  const c1y=536;
  ctx.fillStyle='#181b21';fillR(ctx,64,c1y,952,320,20);
  ctx.strokeStyle='rgba(213,179,116,0.26)';ctx.lineWidth=1.5;strokeR(ctx,64,c1y,952,320,20);
  ctx.fillStyle='#d5b374';ctx.font=`700 20px ${mono}`;
  ctx.fillText("CURATOR'S NOTE  ·  策展人私藏评语与修复记录", 96, c1y+42);
  ctx.fillStyle='#e8e2d8';ctx.font=`400 24px ${sans}`;
  wrap(ctx, p.insight, 888).slice(0,3).forEach((l,i)=>ctx.fillText(l, 96, c1y+84+i*37));

  // Repair log highlighted strip
  ctx.fillStyle='rgba(213,179,116,0.10)';fillR(ctx,92,c1y+198,896,98,12);
  ctx.strokeStyle='rgba(213,179,116,0.38)';ctx.lineWidth=1.2;strokeR(ctx,92,c1y+198,896,98,12);
  ctx.fillStyle='#f0d9ab';ctx.font=`500 22px ${sans}`;
  wrap(ctx, p.repair, 852).slice(0,2).forEach((l,i)=>ctx.fillText(l, 114, c1y+236+i*35));

  // Section 2: 4-Axis Appraisal Spectrum + Visitor Notice
  const c2y=878;
  ctx.fillStyle='#181b21';fillR(ctx,64,c2y,952,254,20);
  ctx.strokeStyle='rgba(255,255,255,0.10)';ctx.lineWidth=1.5;strokeR(ctx,64,c2y,952,254,20);
  ctx.fillStyle='#d5b374';ctx.font=`700 20px ${mono}`;
  ctx.fillText('APPRAISAL SPECTRUM  ·  四维器物鉴定', 96, c2y+40);

  D.axes.forEach((a,i)=>{
    const col=i%2, row=Math.floor(i/2);
    const ax=96+col*456, ay=c2y+82+row*64, aw=410;
    ctx.font=`600 19px ${sans}`;ctx.fillStyle='#f4efe6';ctx.textAlign='left';
    ctx.fillText(`${a[0]} · ${a[1]}`, ax, ay);
    ctx.textAlign='right';ctx.fillStyle='#a8a196';ctx.fillText(a[2], ax+aw, ay);
    ctx.textAlign='left';
    ctx.fillStyle='rgba(255,255,255,0.10)';fillR(ctx,ax,ay+12,aw,8,4);
    const px=ax+aw*Math.max(0.05,Math.min(0.95,v[i]/3));
    ctx.fillStyle='#d5b374';ctx.beginPath();ctx.arc(px,ay+16,9.5,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#181b21';ctx.lineWidth=2.5;ctx.stroke();
  });

  // Visitor Notice Ribbon inside bottom of c2
  ctx.fillStyle='rgba(201,92,75,0.16)';fillR(ctx,92,c2y+192,896,42,8);
  ctx.strokeStyle='rgba(201,92,75,0.48)';ctx.lineWidth=1;strokeR(ctx,92,c2y+192,896,42,8);
  ctx.fillStyle='#f4b4a8';ctx.font=`600 20px ${sans}`;
  ctx.fillText('⚠ ' + wrap(ctx, p.notice, 850)[0], 110, c2y+220);

  // Section 3: Co-Exhibition Duo Cards
  const c3y=1154, c3h=188;
  ctx.fillStyle='#1c2028';fillR(ctx,64,c3y,464,c3h,18);
  ctx.strokeStyle='rgba(213,179,116,0.34)';ctx.lineWidth=1.5;strokeR(ctx,64,c3y,464,c3h,18);
  ctx.fillStyle='#d5b374';ctx.font=`700 19px ${mono}`;ctx.fillText('♥ 最佳联展搭档', 92, c3y+38);
  ctx.fillStyle='#ffffff';ctx.font=`700 25px ${serif}`;
  wrap(ctx, p.match[0], 410).slice(0,2).forEach((l,i)=>ctx.fillText(l, 92, c3y+78+i*32));
  ctx.fillStyle='#b8b0a2';ctx.font=`400 19px ${sans}`;
  wrap(ctx, p.match[1], 410).slice(0,2).forEach((l,i)=>ctx.fillText(l, 92, c3y+138+i*26));

  ctx.fillStyle='#1c2028';fillR(ctx,552,c3y,464,c3h,18);
  ctx.strokeStyle='rgba(255,255,255,0.12)';ctx.lineWidth=1.5;strokeR(ctx,552,c3y,464,c3h,18);
  ctx.fillStyle='#eb8978';ctx.font=`700 19px ${mono}`;ctx.fillText('⚡ 严禁相邻展柜', 580, c3y+38);
  ctx.fillStyle='#ffffff';ctx.font=`700 25px ${serif}`;
  wrap(ctx, p.clash[0], 410).slice(0,2).forEach((l,i)=>ctx.fillText(l, 580, c3y+78+i*32));
  ctx.fillStyle='#b8b0a2';ctx.font=`400 19px ${sans}`;
  wrap(ctx, p.clash[1], 410).slice(0,2).forEach((l,i)=>ctx.fillText(l, 580, c3y+138+i*26));

  // Footer
  ctx.fillStyle='#968f83';ctx.font=`500 20px ${sans}`;
  ctx.fillText('如果把你放进博物馆，你是哪件「镇馆之宝」  ·  长按保存分享', 66, 1384);
  ctx.textAlign='right';ctx.fillText('SOUL MUSEUM · 原创趣味探索', 1014, 1384);
  ctx.textAlign='left';
  return c;
}

function showPoster(){
  if(!report) return;
  const status=document.getElementById('posterStatus'),
        area=document.getElementById('posterArea'),
        download=document.getElementById('downloadPoster');
  status.textContent='';area.innerHTML='';download.disabled=true;
  try{
    if(posterURL) URL.revokeObjectURL(posterURL);
    posterURL=null;
    const canvas=makePoster();
    const img=document.createElement('img');
    img.className='poster';img.alt='可保存的3:4镇馆之宝展柜海报';
    img.src=canvas.toDataURL('image/png');
    area.append(img);
    canvas.toBlob(blob=>{
      posterURL=blob?URL.createObjectURL(blob):img.src;
      download.disabled=false;
    },'image/png');
    if(!posterDialog.open) posterDialog.showModal();
  }catch(e){
    status.textContent='当前浏览器不支持生成海报，可直接截图保存结果页。';
    if(!posterDialog.open) posterDialog.showModal();
  }
}

document.getElementById('closePoster').onclick=()=>posterDialog.close();
document.getElementById('downloadPoster').onclick=()=>{
  if(!posterURL||!report) return;
  const a=document.createElement('a');a.href=posterURL;a.download='镇馆之宝-'+report.p.name+'.png';
  document.body.append(a);a.click();a.remove();
  document.getElementById('posterStatus').textContent='若微信/小红书内未自动下载，请直接长按上方展柜海报保存。';
};
document.getElementById('closeCopy').onclick=()=>copyDialog.close();
document.getElementById('selectCopyBtn').onclick=()=>{
  const ta=document.getElementById('copyTextarea');ta.focus();ta.select();
};
home();
</script>
