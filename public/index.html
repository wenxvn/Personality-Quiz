<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f4ee">
  <title>专属测试入口</title>
  <style>
    :root {
      --bg: #f6f2ea;
      --card: #fffdf9;
      --ink: #24211e;
      --muted: #6f6860;
      --accent: #8d5b3c;
      --gold: #c99a56;
      --line: #e4dacb;
      --serif: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
      --sans: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 85% 10%, rgba(201, 154, 86, 0.16), transparent 52%),
        radial-gradient(ellipse at 12% 92%, rgba(141, 91, 60, 0.10), transparent 50%),
        var(--bg);
      font-family: var(--sans);
      line-height: 1.7;
    }
    main {
      width: min(100%, 440px);
      padding: 36px 28px 30px;
      text-align: center;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(36, 33, 30, 0.08);
      position: relative;
    }
    main::after {
      content: "";
      position: absolute;
      inset: 8px;
      border: 1px solid rgba(201, 154, 86, 0.22);
      border-radius: 17px;
      pointer-events: none;
    }
    .mark {
      width: 52px;
      height: 52px;
      margin: 0 auto 16px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--accent);
      background: #f8f2e7;
      border: 1px solid var(--line);
      font-size: 22px;
    }
    .kicker {
      font-size: 10.5px;
      letter-spacing: 2.4px;
      font-weight: 800;
      color: var(--gold);
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 10px;
      font-family: var(--serif);
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    p {
      margin: 0;
      font-size: 14.5px;
      color: var(--muted);
    }
    .note {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px dashed var(--line);
      font-size: 12px;
      color: #8a8278;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✦</div>
    <div class="kicker">PRIVATE ACCESS</div>
    <h1>专属趣味测试入口</h1>
    <p>请使用收到的专属测试链接进入。</p>
    <p class="note">无需登录 · 原创趣味探索 · 所有答题数据仅保存在本地浏览器</p>
  </main>
</body>
</html>
