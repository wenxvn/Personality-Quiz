<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8d5332">
<meta name="description" content="测测你的灵魂专属香调 · 24道感官情境探索，调制属于你的16款原创高定沙龙香，含3:4小红书收藏级香水瓶海报。">
<title>测测你的灵魂专属香调 · SCENT ATELIER</title>
<style>
:root{
  --ink:#241d19;--accent:#8d5332;--accent2:#c19352;--paper:#f8f4ec;
  --soft:#efe6d8;--line:#dfd3c2;--card:#fffdf9;--muted:#746458;
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.68;-webkit-tap-highlight-color:transparent;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:
  radial-gradient(ellipse at 92% 0%,rgba(193,147,82,.18),transparent 54%),
  radial-gradient(ellipse at 8% 100%,rgba(141,83,50,.11),transparent 52%);z-index:-1}
main{width:min(100%,660px);padding:18px 16px max(34px,env(safe-area-inset-bottom));margin:auto}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 16px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.brand{font-size:11px;letter-spacing:2.6px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:7px}
.brand::before{content:"✦";color:var(--accent2);font-size:13px}
.issue{font-size:11px;color:var(--muted);white-space:nowrap;letter-spacing:.06em}
section.panel{border:1px solid var(--line);border-radius:26px;background:var(--card);padding:clamp(18px,4.2vw,30px);box-shadow:0 22px 54px rgba(36,29,25,.08);overflow:hidden;animation:enter .3s cubic-bezier(.22,1,.36,1)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1,h2,h3,p{margin:0}
h1{font-family:var(--serif);font-size:clamp(30px,7.8vw,45px);font-weight:800;line-height:1.25;letter-spacing:.03em}
h2{font-family:var(--serif);font-size:clamp(21px,5.2vw,27px);line-height:1.48;font-weight:700}
h3{font-family:var(--serif);font-size:17px;margin-bottom:9px;font-weight:700}
.eyebrow{color:var(--accent);font-size:10.5px;letter-spacing:2.4px;font-weight:800;margin:16px 0 7px;text-transform:uppercase}
.lead{font-size:15px;line-height:1.86;margin:12px 0 18px;color:color-mix(in srgb,var(--ink) 84%,var(--muted))}
.muted{font-size:12px;color:var(--muted)}
.hero{position:relative;isolation:isolate;height:clamp(192px,48vw,246px);background:#261f1b;border-radius:18px;overflow:hidden;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.hero svg{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(24,18,14,.06) 0%,rgba(24,18,14,.55) 100%);z-index:-1}
.hero-badge{position:absolute;top:14px;right:14px;padding:4px 11px;border-radius:99px;border:1px solid rgba(246,232,210,.45);background:rgba(28,21,17,.36);backdrop-filter:blur(6px);font-size:10px;letter-spacing:1.6px;font-weight:700;color:#f7ebd8}
.hero-copy{position:absolute;bottom:17px;left:19px;right:16px}
.hero-copy small{font-size:10px;letter-spacing:3px;opacity:.9;display:block;margin-bottom:3px;color:#ead3b3}
.hero-copy strong{display:block;font-family:var(--serif);font-size:clamp(24px,6vw,34px);letter-spacing:3px;line-height:1.25}
.pills{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 20px}
.pill{font-size:12px;padding:5px 12px;border:1px solid var(--line);border-radius:100px;background:var(--paper);color:var(--ink);font-weight:500}
.pill.accent{border-color:color-mix(in srgb,var(--accent) 32%,var(--line));background:var(--soft);color:var(--accent);font-weight:700}
.teaser-wrap{margin:22px 0 20px;padding-top:16px;border-top:1px dashed var(--line)}
.teaser-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.teaser-head span{font-size:11px;letter-spacing:1.6px;color:var(--accent);font-weight:800}
.teaser-head small{font-size:11px;color:var(--muted)}
.teasers{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.teaser{padding:12px 10px;border-radius:14px;background:var(--paper);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden}
.teaser-dot{width:26px;height:6px;border-radius:99px;margin-bottom:4px;border:1px solid rgba(0,0,0,.08)}
.teaser b{font-family:var(--serif);font-size:14.5px;color:var(--ink)}
.teaser span{font-size:10.5px;color:var(--accent);font-weight:600}
.teaser small{font-size:11px;color:var(--muted);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 16px;min-height:48px;touch-action:manipulation;transition:transform .12s,border-color .18s,background .18s,box-shadow .18s}
button:active:not(:disabled){transform:scale(.988)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.4;cursor:not-allowed}
.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:750;width:100%;text-align:center;box-shadow:0 8px 22px rgba(141,83,50,.24)}
.primary:hover:not(:disabled){filter:brightness(1.06)}
.secondary{width:100%;text-align:center;background:var(--paper)}
.subtle{background:transparent;border:0;text-align:center;color:var(--muted);font-size:12px;padding:8px;min-height:36px}
.subtle:hover{color:var(--accent)}
.stack{display:grid;gap:10px}
.actions-row{display:grid;grid-template-columns:1.25fr 1fr;gap:10px}
.notice{font-size:12px;color:var(--muted);line-height:1.72;margin-top:16px}
/* Quiz screen */
.question-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--accent);font-weight:750;letter-spacing:.06em}
.auto-toggle{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--paper);color:var(--muted);font-size:11px;font-weight:600;min-height:28px;cursor:pointer}
.auto-toggle.on{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));color:var(--accent);background:var(--soft)}
.progress{height:6px;background:var(--soft);overflow:hidden;border-radius:12px;margin:11px 0 18px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:12px;transition:width .28s cubic-bezier(.22,1,.36,1)}
.chapter-bar{display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:14px;background:var(--paper);border:1px solid var(--line);margin-bottom:20px}
.chapter-num{font-family:var(--serif);font-size:20px;font-weight:800;color:var(--accent2);line-height:1}
.chapter-bar strong{display:block;font-size:13px;color:var(--ink)}
.chapter-bar span{display:block;font-size:11px;color:var(--muted);line-height:1.45}
.options{display:grid;gap:10px;margin:20px 0 22px}
.option{display:flex;text-align:left;align-items:center;gap:12px;min-height:60px;width:100%;padding:13px 14px;line-height:1.55;background:var(--card)}
.option .letter{display:grid;place-items:center;flex:0 0 30px;height:30px;border-radius:10px;background:var(--paper);color:var(--accent);font-weight:800;font-size:12px;border:1px solid var(--line);transition:all .18s}
.option.selected{border-color:var(--accent);box-shadow:0 4px 14px rgba(141,83,50,.15),inset 0 0 0 1px var(--accent);background:var(--soft)}
.option.selected .letter{background:var(--accent);color:#fff;border-color:var(--accent)}
.option .check{margin-left:auto;color:var(--accent);font-weight:800;font-size:15px}
.nav{display:grid;grid-template-columns:1fr 1.6fr;gap:10px}
/* Calculating ritual */
.calc-box{text-align:center;padding:38px 10px 30px}
.calc-ring{width:68px;height:68px;margin:0 auto 20px;border-radius:50%;border:2.5px solid var(--soft);border-top-color:var(--accent);border-right-color:var(--accent2);animation:spin 1s linear infinite;position:relative}
.calc-ring::after{content:"✦";position:absolute;inset:0;display:grid;place-items:center;color:var(--accent2);font-size:18px;animation:spin-rev 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spin-rev{to{transform:rotate(-360deg)}}
.calc-step{font-family:var(--serif);font-size:19px;color:var(--ink);margin-bottom:8px;min-height:1.6em}
.calc-sub{font-size:12px;color:var(--muted)}
/* Result Perfume Showcase */
.flacon-card{border:1px solid var(--line);border-radius:22px;padding:18px 16px 16px;background:linear-gradient(165deg,var(--scent-tint,var(--paper)),var(--card));position:relative;overflow:hidden}
.flacon-top{display:grid;grid-template-columns:138px 1fr;gap:16px;align-items:center}
.bottle-stage{display:grid;place-items:center;padding:10px 4px;border-radius:16px;background:rgba(255,255,255,.68);border:1px solid var(--line)}
.bottle-stage svg{width:118px;height:178px;display:block;filter:drop-shadow(0 12px 16px rgba(36,29,25,.14))}
.flacon-meta .eyebrow{margin:0 0 6px}
.scent-en{font-size:11px;letter-spacing:2px;color:var(--muted);font-weight:600;margin-top:2px;text-transform:uppercase}
.result-name{font-family:var(--serif);font-size:clamp(28px,7.2vw,38px);line-height:1.22;letter-spacing:.03em;color:var(--ink);margin:2px 0}
.conc-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:10px 0 8px}
.fit-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 11px;border-radius:99px;background:var(--scent-deep,var(--accent));color:#fff;font-size:11.5px;font-weight:750;white-space:nowrap}
.conc-pill{font-size:11px;padding:4px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--muted);font-weight:600}
.quote-box{margin:14px 0 2px;padding:12px 14px;border-left:3px solid var(--accent2);background:var(--card);border-radius:0 12px 12px 0;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.quote{font-family:var(--serif);font-size:16.5px;color:var(--scent-deep,var(--accent));line-height:1.64;font-weight:600}
/* Olfactory Pyramid */
.pyramid{display:grid;gap:10px;margin-top:12px}
.note-tier{display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:start;padding:13px 14px;border-radius:14px;background:var(--paper);border:1px solid var(--line)}
.tier-badge{text-align:center;padding:6px 4px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.tier-badge strong{display:block;font-family:var(--serif);font-size:14px;color:var(--scent-deep,var(--accent));line-height:1.2}
.tier-badge span{display:block;font-size:9px;letter-spacing:1.4px;color:var(--accent2);font-weight:800;margin-top:2px}
.note-body strong{display:block;font-size:14px;color:var(--ink);margin-bottom:3px}
.note-body p{font-size:13px;line-height:1.68;color:var(--muted)}
.block{padding:22px 0;border-bottom:1px solid var(--line)}
.block:last-of-type{border:0;padding-bottom:14px}
.block p{font-size:14.5px;line-height:1.88;color:color-mix(in srgb,var(--ink) 92%,var(--muted))}
.kicker{font-size:10px;letter-spacing:2.2px;color:var(--accent2);font-weight:800;margin-bottom:5px;text-transform:uppercase}
.contrast-card{margin-top:13px;padding:13px 15px;border-radius:14px;background:linear-gradient(135deg,var(--soft),var(--paper));border:1px solid var(--line)}
.contrast-card b{display:block;font-size:12px;color:var(--accent);margin-bottom:4px;letter-spacing:.04em}
.contrast-card p{font-size:13.5px;line-height:1.75}
.axis{margin:15px 0}
.axis-head,.axis-labels{display:flex;justify-content:space-between;gap:10px;font-size:12px}
.axis-head strong{font-size:13px}
.axis-head span{color:var(--accent);font-weight:700}
.axis-labels{color:var(--muted)}
.track{position:relative;height:9px;border-radius:9px;background:var(--soft);margin:8px 0}
.track::before{content:"";position:absolute;left:50%;width:1px;height:9px;background:var(--line)}
.track i{position:absolute;width:16px;height:16px;top:-3.5px;border-radius:50%;background:var(--scent-deep,var(--accent));border:2.5px solid var(--card);box-shadow:0 0 0 1.5px var(--scent-deep,var(--accent));transform:translateX(-50%)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.mini{padding:14px;border-radius:14px;background:var(--paper);border:1px solid var(--line)}
.mini b{display:block;color:var(--accent);font-size:12px;margin-bottom:5px}
.partner-row{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.swatch{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.15);flex:none}
.mini .partner-name{font-family:var(--serif);font-size:17px;font-weight:800;color:var(--ink)}
.mini p{font-size:13px;line-height:1.68}
.egg-box{padding:14px 16px;border-radius:14px;background:var(--paper);border:1px dashed var(--accent2);margin-top:10px}
.egg-box b{display:block;font-size:12px;color:var(--accent2);margin-bottom:4px;letter-spacing:.05em}
.egg-box p{font-size:14px}
.rank{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.rank:last-child{border:0}
.rank-left{display:flex;align-items:center;gap:10px}
.rank small{display:block;font-size:11px;color:var(--muted)}
.rank .pct{font-size:12px;font-weight:700;color:var(--accent);background:var(--soft);padding:3px 9px;border-radius:99px}
.status-bar{font-size:12px;color:var(--accent);text-align:center;min-height:1.4em;margin:4px 0 6px;font-weight:600}
.footer{text-align:center;margin:20px 0 0;font-size:11px;color:var(--muted);line-height:1.8}
.poster{width:100%;max-width:360px;margin:10px auto;border-radius:14px;display:block;border:1px solid var(--line);box-shadow:0 12px 30px rgba(0,0,0,.14)}
dialog{width:min(calc(100% - 26px),460px);max-height:90dvh;overflow:auto;border:1px solid var(--line);border-radius:22px;padding:20px;background:var(--card);color:var(--ink);box-shadow:0 24px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(24,18,14,.62);backdrop-filter:blur(3px)}
.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.dialog-head button{min-height:36px;padding:4px 13px;font-size:13px}
.copy-area{width:100%;min-height:150px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:12px;font:inherit;font-size:13px;line-height:1.7;margin:10px 0}
@media(max-width:480px){
  main{padding:14px 12px 28px}
  .flacon-top{grid-template-columns:1fr;text-align:center}
  .bottle-stage{max-width:190px;margin:0 auto}
  .conc-row,.flacon-meta .pills{justify-content:center}
  .teasers,.duo,.actions-row{grid-template-columns:1fr}
  .note-tier{grid-template-columns:66px 1fr;gap:10px}
  .option{font-size:14px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <header>
    <span class="brand">SCENT ATELIER</span>
    <span class="issue">VOL. 05 · 沙龙调香室</span>
  </header>
  <div id="app"></div>
  <footer class="footer">原创高定香调趣味测试 · 仅供自我探索与娱乐分享，非专业心理测评<br>无需登录 · 所有答题记录仅保存在你的本地浏览器</footer>
</main>

<dialog id="posterDialog" aria-labelledby="posterTitle">
  <div class="dialog-head">
    <h3 id="posterTitle">你的沙龙香 3:4 收藏海报</h3>
    <button id="closePoster" type="button">关闭</button>
  </div>
  <p class="muted">1080 × 1440 高清瓶身卡 · 手机直接长按图片保存，电脑点击下方下载。</p>
  <div id="posterArea"></div>
  <div class="stack" style="margin-top:12px">
    <button class="primary" id="downloadPoster">下载高清 PNG 海报</button>
  </div>
  <p class="status-bar" id="posterStatus" role="status"></p>
</dialog>

<dialog id="copyDialog" aria-labelledby="copyTitle">
  <div class="dialog-head">
    <h3 id="copyTitle">复制小红书分享文案</h3>
    <button id="closeCopy" type="button">关闭</button>
  </div>
  <p class="muted">长按或全选下方文案复制，搭配香水海报发笔记更容易引发评论区找叠喷搭子。</p>
  <textarea id="copyTextarea" class="copy-area" readonly></textarea>
  <button class="primary" id="selectCopyBtn" type="button">全选文案</button>

function compute(input){
  if(input.length!==N||input.some(v=>!Number.isInteger(v)||v<0||v>3)) throw Error('Incomplete answers');
  const sums=D.axes.map(()=>0), cnts=D.axes.map(()=>0);
  const wSums=D.axes.map(()=>0), wCnts=D.axes.map(()=>0);
  D.questions.forEach((q,i)=>{
    const sc=q.options[input[i]].score;
    sums[q.axis]+=sc; cnts[q.axis]++;
    // Gentle progressive weight so exact midpoint ties naturally reflect the final chapter's distilled instinct
    const w=1+i*0.012;
    wSums[q.axis]+=sc*w; wCnts[q.axis]+=w;
  });
  const v=sums.map((s,i)=>s/cnts[i]);
  const vw=wSums.map((s,i)=>s/wCnts[i]);
  const ranked=D.profiles.map((p,i)=>{
    const center=p.vector.map(x=>x-1.5);
    const norm=Math.hypot(...center)||1;
    const radius=Math.sqrt(vw.length)*0.52+0.12*(norm-Math.sqrt(vw.length));
    const cal=center.map(x=>1.5+x*radius/norm);
    const d=cal.reduce((s,x,j)=>s+(x-vw[j])**2,0);
    const rawSim=Math.max(0,1-Math.sqrt(d/(4.2*vw.length)));
    const fit=Math.round(Math.max(68,Math.min(98,68+rawSim*30)));
    return {p,i,d,fit};
  });
  ranked.sort((a,b)=>a.d-b.d||a.i-b.i);
  for(let k=1;k<Math.min(4,ranked.length);k++){
    if(ranked[k].fit>=ranked[k-1].fit) ranked[k].fit=Math.max(62,ranked[k-1].fit-2);
  }
  return {v,ranked,p:ranked[0].p};
}

function wrap(ctx,text,max){
  const out=[];let line='';
  for(const ch of text){
    if(line&&ctx.measureText(line+ch).width>max){out.push(line);line=ch;}
    else line+=ch;
  }
  if(line) out.push(line);
  return out;
}
function rPath(ctx,x,y,w,h,r){
  ctx.beginPath();
  if(typeof ctx.roundRect==='function') ctx.roundRect(x,y,w,h,r);
  else{r=Math.min(r,w/2,h/2);ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
}
function fillR(ctx,x,y,w,h,r){rPath(ctx,x,y,w,h,r);ctx.fill();}
function strokeR(ctx,x,y,w,h,r){rPath(ctx,x,y,w,h,r);ctx.stroke();}

function drawCanvasBottle(ctx, ox, oy, p, serif, sans){
  ctx.save();
  ctx.translate(ox, oy);
  // Subtle pedestal glow
  const glow=ctx.createRadialGradient(115,175,20,115,175,140);
  glow.addColorStop(0,'rgba(255,255,255,0.28)');glow.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=glow;ctx.fillRect(-20,0,270,350);

  // Heavy matte cap
  ctx.fillStyle='#1a1411';fillR(ctx,78,12,74,52,8);
  ctx.fillStyle='rgba(255,255,255,0.14)';fillR(ctx,85,18,10,40,4);
  // Gold atomizer collar
  ctx.fillStyle='#cfa464';fillR(ctx,92,64,46,18,3);
  ctx.strokeStyle='rgba(255,248,232,0.55)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(92,73);ctx.lineTo(138,73);ctx.stroke();

  // Glass bottle body
  ctx.fillStyle='rgba(255,253,249,0.92)';
  ctx.strokeStyle='rgba(255,255,255,0.72)';ctx.lineWidth=3;
  fillR(ctx,26,82,178,244,24);strokeR(ctx,26,82,178,244,24);

  // Tinted perfume liquid inside
  const lg=ctx.createLinearGradient(36,126,194,316);
  lg.addColorStop(0,p.liquid);lg.addColorStop(1,p.deep);
  ctx.save();ctx.globalAlpha=0.88;ctx.fillStyle=lg;fillR(ctx,36,132,158,184,16);ctx.restore();
  // Liquid top sheen
  ctx.fillStyle='rgba(255,255,255,0.42)';ctx.beginPath();ctx.ellipse(115,132,78,6,0,0,Math.PI*2);ctx.fill();

  // Left specular reflection on glass
  ctx.strokeStyle='rgba(255,255,255,0.62)';ctx.lineWidth=6;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(43,104);ctx.lineTo(43,300);ctx.stroke();

  // Minimalist Le-Labo style apothecary label
  ctx.fillStyle='#fffdf8';fillR(ctx,50,152,130,136,5);
  ctx.strokeStyle='#d6c8b4';ctx.lineWidth=1.5;strokeR(ctx,50,152,130,136,5);
  ctx.strokeStyle='#ebe1d2';ctx.lineWidth=1;strokeR(ctx,56,158,118,124,2);

  ctx.textAlign='center';
  ctx.fillStyle=p.deep;ctx.font=`800 11px ${sans}`;ctx.fillText('SCENT ATELIER',115,176);
  ctx.strokeStyle='#dfd3c2';ctx.beginPath();ctx.moveTo(68,185);ctx.lineTo(162,185);ctx.stroke();

  ctx.fillStyle='#241d19';
  if(p.name.length<=5){
    ctx.font=`800 22px ${serif}`;ctx.fillText(p.name,115,217);
  }else{
    ctx.font=`800 18px ${serif}`;
    const mid=Math.ceil(p.name.length/2);
    ctx.fillText(p.name.slice(0,mid),115,210);
    ctx.fillText(p.name.slice(mid),115,233);
  }
  ctx.fillStyle='#78675b';ctx.font=`600 10px ${sans}`;
  ctx.fillText(`NO.${p.no} · ${p.conc.split('·')[0].trim()}`,115,256);
  ctx.fillStyle='#b88c4e';ctx.font=`600 9.5px ${sans}`;
  ctx.fillText('50 ML / 1.7 FL.OZ',115,273);
  ctx.textAlign='left';
  ctx.restore();
}

function makePoster(){
  const c=document.createElement('canvas');c.width=1080;c.height=1440;
  const ctx=c.getContext('2d');if(!ctx) throw Error('Canvas unavailable');
  const {p,v,ranked}=report;
  const sans='"PingFang SC","Microsoft YaHei",sans-serif', serif='"Noto Serif SC","Songti SC","SimSun",serif';

  // Warm alabaster editorial backdrop & double border
  ctx.fillStyle='#f8f4ec';ctx.fillRect(0,0,1080,1440);
  ctx.strokeStyle='#dfd3c2';ctx.lineWidth=2;strokeR(ctx,26,26,1028,1388,30);

  // Top Luxury Salon Showcase Card
  const hg=ctx.createLinearGradient(52,52,1028,452);
  hg.addColorStop(0,p.deep);hg.addColorStop(1,'#241d19');
  ctx.fillStyle=hg;fillR(ctx,52,52,976,396,26);
  ctx.save();rPath(ctx,52,52,976,396,26);ctx.clip();
  ctx.strokeStyle='rgba(255,255,255,0.12)';ctx.lineWidth=2;
  for(let i=0;i<6;i++){ctx.beginPath();ctx.ellipse(940,120,90+i*42,58+i*24,-0.35,0,Math.PI*2);ctx.stroke();}
  ctx.restore();

  // Draw bespoke bottle on left of hero card
  drawCanvasBottle(ctx, 84, 82, p, serif, sans);

  // Right typography block inside hero card
  const rx=352;
  ctx.fillStyle='rgba(255,244,228,0.85)';ctx.font=`700 21px ${sans}`;
  ctx.fillText(`SCENT ATELIER  ·  NO.${p.no}  ·  ${p.family}`, rx, 118);

  // Fragrance Name (auto-fit font size for 4-8 chars)
  const titleSize=p.name.length>6?54:62;
  ctx.fillStyle='#ffffff';ctx.font=`800 ${titleSize}px ${serif}`;
  ctx.fillText(`《${p.name}》`, rx-10, 200);

  ctx.fillStyle='rgba(240,224,200,0.88)';ctx.font=`600 21px ${sans}`;
  ctx.fillText(p.en, rx, 244);

  // Affinity + Conc badges
  ctx.fillStyle=p.liquid;fillR(ctx,rx,272,216,42,21);
  ctx.fillStyle='#1f1916';ctx.font=`800 21px ${sans}`;
  ctx.fillText(`✦ 灵魂契合 ${ranked[0].fit}%`, rx+20, 300);

  ctx.fillStyle='rgba(255,255,255,0.14)';fillR(ctx,rx+228,272,240,42,21);
  ctx.fillStyle='#fff6ea';ctx.font=`600 19px ${sans}`;
  ctx.fillText(p.conc, rx+248, 299);

  // 3 hashtag pills
  let tx=rx;
  p.tags.forEach(t=>{
    const lbl='# '+t;
    ctx.font=`600 20px ${sans}`;
    const w=ctx.measureText(lbl).width+30;
    if(tx+w<1005){
      ctx.fillStyle='rgba(255,255,255,0.12)';fillR(ctx,tx,340,w,38,19);
      ctx.strokeStyle='rgba(255,255,255,0.24)';ctx.lineWidth=1;strokeR(ctx,tx,340,w,38,19);
      ctx.fillStyle='#fff';ctx.fillText(lbl,tx+15,365);
      tx+=w+12;
    }
  });

  // Quote callout card
  ctx.fillStyle='#fffdf9';fillR(ctx,52,472,976,104,20);
  ctx.strokeStyle='#dfd3c2';ctx.lineWidth=1.5;strokeR(ctx,52,472,976,104,20);
  ctx.fillStyle='#c19352';fillR(ctx,52,472,10,104,5);
  ctx.fillStyle=p.deep;ctx.font=`700 30px ${serif}`;
  const qLines=wrap(ctx,`「${p.quote}」`,905).slice(0,2);
  const qStart=qLines.length===1?534:515;
  qLines.forEach((l,i)=>ctx.fillText(l,84,qStart+i*40));

  // Fragrance Pyramid Card (Top / Heart / Base)
  const py=600;
  ctx.fillStyle='#fffdf9';fillR(ctx,52,py,976,302,22);
  ctx.strokeStyle='#dfd3c2';ctx.lineWidth=1.5;strokeR(ctx,52,py,976,302,22);
  ctx.fillStyle='#c19352';ctx.font=`800 20px ${sans}`;
  ctx.fillText('OLFACTORY PYRAMID  ·  灵魂三调配方', 82, py+40);

  const tiers=[
    {cn:'前调',en:'TOP',data:p.top},
    {cn:'中调',en:'HEART',data:p.heart},
    {cn:'后调',en:'BASE',data:p.base}
  ];
  tiers.forEach((t,k)=>{
    const ty=py+64+k*76;
    ctx.fillStyle='#f4ede1';fillR(ctx,82,ty,116,58,12);
    ctx.fillStyle=p.deep;ctx.font=`800 23px ${serif}`;ctx.textAlign='center';
    ctx.fillText(t.cn,140,ty+29);
    ctx.fillStyle='#b88948';ctx.font=`800 13px ${sans}`;
    ctx.fillText(t.en,140,ty+49);
    ctx.textAlign='left';
    ctx.fillStyle='#241d19';ctx.font=`700 23px ${sans}`;
    ctx.fillText(t.data[0], 218, ty+24);
    ctx.fillStyle='#6c5d52';ctx.font=`400 20px ${sans}`;
    const descLine=wrap(ctx,t.data[1],780)[0];
    ctx.fillText(descLine, 218, ty+52);
  });

  // 4-Axis Scent Spectrum Card
  const sy=924;
  ctx.fillStyle='#fffdf9';fillR(ctx,52,sy,976,220,22);
  ctx.strokeStyle='#dfd3c2';ctx.lineWidth=1.5;strokeR(ctx,52,sy,976,220,22);
  ctx.fillStyle=p.deep;ctx.font=`800 20px ${sans}`;
  ctx.fillText('SCENT SPECTRUM  ·  四维气味光谱', 82, sy+38);
  D.axes.forEach((a,i)=>{
    const col=i%2, row=Math.floor(i/2);
    const ax=82+col*470, ay=sy+84+row*72, aw=420;
    ctx.font=`600 19px ${sans}`;ctx.fillStyle='#241d19';ctx.textAlign='left';
    ctx.fillText(`${a[0]} · ${a[1]}`,ax,ay);
    ctx.textAlign='right';ctx.fillStyle='#746458';ctx.fillText(a[2],ax+aw,ay);
    ctx.textAlign='left';
    ctx.fillStyle='#efe6d8';fillR(ctx,ax,ay+13,aw,9,4.5);
    const px=ax+aw*Math.max(0.05,Math.min(0.95,v[i]/3));
    ctx.fillStyle=p.deep;ctx.beginPath();ctx.arc(px,ay+17.5,10,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=2.5;ctx.stroke();
  });

  // Bottom Duo Cards: Layering Soulmate + Hidden Contrast
  const by=1166, bh=176;
  ctx.fillStyle=p.tint;fillR(ctx,52,by,476,bh,20);
  ctx.strokeStyle='#dfd3c2';ctx.lineWidth=1.5;strokeR(ctx,52,by,476,bh,20);
  ctx.fillStyle=p.deep;ctx.font=`800 20px ${sans}`;ctx.fillText('♥ 叠喷最绝灵魂搭子香',80,by+38);
  ctx.fillStyle='#241d19';ctx.font=`800 30px ${serif}`;ctx.fillText(`《${p.match[0]}》`,74,by+84);
  ctx.fillStyle='#6c5d52';ctx.font=`400 20px ${sans}`;
  wrap(ctx,p.match[1],420).slice(0,2).forEach((l,i)=>ctx.fillText(l,80,by+122+i*29));

  ctx.fillStyle='#fffdf9';fillR(ctx,552,by,476,bh,20);
  ctx.strokeStyle='#dfd3c2';ctx.lineWidth=1.5;strokeR(ctx,552,by,476,bh,20);
  ctx.fillStyle='#c19352';ctx.font=`800 20px ${sans}`;ctx.fillText('✦ 隐藏后调反差面',580,by+38);
  ctx.fillStyle='#241d19';ctx.font=`400 21px ${sans}`;
  wrap(ctx,p.contrast,420).slice(0,3).forEach((l,i)=>ctx.fillText(l,580,by+78+i*32));

  // Footer
  ctx.fillStyle='#746458';ctx.font=`500 21px ${sans}`;
  ctx.fillText('测测你的灵魂专属香调  ·  长按保存分享', 60, 1388);
  ctx.textAlign='right';ctx.fillText('SCENT ATELIER · 原创趣味探索', 1020, 1388);
  ctx.textAlign='left';
  return c;
}

function showPoster(){
  if(!report) return;
  const status=document.getElementById('posterStatus'),
        area=document.getElementById('posterArea'),
        download=document.getElementById('downloadPoster');
  status.textContent='';area.innerHTML='';download.disabled=true;
  try{
    if(posterURL) URL.revokeObjectURL(posterURL);
    posterURL=null;
    const canvas=makePoster();
    const img=document.createElement('img');
    img.className='poster';img.alt='可保存的专属沙龙香3:4海报';
    img.src=canvas.toDataURL('image/png');
    area.append(img);
    canvas.toBlob(blob=>{
      posterURL=blob?URL.createObjectURL(blob):img.src;
      download.disabled=false;
    },'image/png');
    if(!posterDialog.open) posterDialog.showModal();
  }catch(e){
    status.textContent='当前浏览器不支持生成海报，可直接截图保存结果页。';
    if(!posterDialog.open) posterDialog.showModal();
  }
}

document.getElementById('closePoster').onclick=()=>posterDialog.close();
document.getElementById('downloadPoster').onclick=()=>{
  if(!posterURL||!report) return;
  const a=document.createElement('a');a.href=posterURL;a.download='灵魂香调-'+report.p.name+'.png';
  document.body.append(a);a.click();a.remove();
  document.getElementById('posterStatus').textContent='若微信/小红书内未自动下载，请直接长按上方海报保存。';
};
document.getElementById('closeCopy').onclick=()=>copyDialog.close();
document.getElementById('selectCopyBtn').onclick=()=>{
  const ta=document.getElementById('copyTextarea');ta.focus();ta.select();
};
home();
