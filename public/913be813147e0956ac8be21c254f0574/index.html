<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b85437">
<meta name="description" content="如果不用上班，你天生适合开一家什么小店 · 24道理想生活选择，领取你的专属复古个体营业执照与3:4街角小店海报。">
<title>如果不用上班，你天生适合开一家什么小店 · DREAM SHOP LAB</title>
<style>
:root{
  --bg:#efe8da;--paper:#faf5eb;--card:#fffdf7;--ink:#2b211b;--muted:#756558;
  --accent:#b85437;--sage:#2d5e4e;--mustard:#d49735;--line:#ded2be;--soft:#f2eadb;
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --mono:"SF Mono","Menlo","Monaco","Consolas",monospace;
  --sans:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.68;-webkit-tap-highlight-color:transparent;min-height:100vh;
  background-image:linear-gradient(90deg,rgba(184,84,55,.04) 1px,transparent 1px),linear-gradient(rgba(184,84,55,.04) 1px,transparent 1px);background-size:28px 28px}
main{width:min(100%,660px);padding:18px 16px max(34px,env(safe-area-inset-bottom));margin:auto}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 16px;padding-bottom:12px;border-bottom:1.5px solid var(--line)}
.brand{font-family:var(--mono);font-size:11px;letter-spacing:2.2px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:7px}
.brand::before{content:"☀";font-size:14px;color:var(--mustard)}
.issue{font-family:var(--mono);font-size:10.5px;color:var(--muted);white-space:nowrap;letter-spacing:.06em}
section.panel{border:1.5px solid var(--line);border-radius:24px;background:var(--card);padding:clamp(18px,4.2vw,30px);box-shadow:0 20px 52px rgba(43,33,27,.09);overflow:hidden;animation:enter .3s cubic-bezier(.22,1,.36,1)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1,h2,h3,p{margin:0}
h1{font-family:var(--serif);font-size:clamp(28px,7.4vw,42px);font-weight:800;line-height:1.26;letter-spacing:.02em;color:var(--ink)}
h2{font-family:var(--serif);font-size:clamp(20px,5vw,26px);line-height:1.48;font-weight:700}
h3{font-family:var(--serif);font-size:17px;margin-bottom:9px;font-weight:700}
.eyebrow{font-family:var(--mono);color:var(--accent);font-size:10.5px;letter-spacing:2px;font-weight:800;margin:16px 0 7px;text-transform:uppercase}
.lead{font-size:14.5px;line-height:1.86;margin:12px 0 18px;color:#4a3c33}
.muted{font-size:12px;color:var(--muted)}
/* Street Corner Shop Hero */
.hero{position:relative;isolation:isolate;height:clamp(198px,48vw,250px);background:#2d5e4e;border-radius:18px;overflow:hidden;color:#fff;border:1.5px solid rgba(43,33,27,.14)}
.hero svg{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(24,18,14,.04) 0%,rgba(24,18,14,.58) 100%);z-index:-1}
.hero-badge{position:absolute;top:14px;right:14px;padding:4px 11px;border-radius:99px;border:1px solid rgba(255,244,224,.55);background:rgba(43,33,27,.45);backdrop-filter:blur(6px);font-family:var(--mono);font-size:10px;letter-spacing:1.4px;font-weight:700;color:#fff7e8}
.hero-copy{position:absolute;bottom:16px;left:18px;right:16px}
.hero-copy small{font-family:var(--mono);font-size:10px;letter-spacing:2.4px;color:#f6dca8;display:block;margin-bottom:3px}
.hero-copy strong{display:block;font-family:var(--serif);font-size:clamp(24px,6vw,34px);letter-spacing:2.5px;line-height:1.25}
.pills{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 20px}
.pill{font-size:12px;padding:5px 12px;border:1px solid var(--line);border-radius:99px;background:var(--paper);color:var(--ink);font-weight:600}
.pill.accent{border-color:rgba(184,84,55,.35);background:#faebe5;color:var(--accent);font-weight:700}
.teaser-wrap{margin:22px 0 20px;padding-top:16px;border-top:1.5px dashed var(--line)}
.teaser-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.teaser-head span{font-family:var(--mono);font-size:11px;letter-spacing:1.3px;color:var(--sage);font-weight:800}
.teaser-head small{font-size:11px;color:var(--muted)}
.teasers{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.teaser{padding:0 0 11px;border-radius:12px;background:var(--paper);border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column}
.teaser-awning{height:10px;width:100%}
.teaser-in{padding:9px 10px 0;display:flex;flex-direction:column;gap:4px}
.teaser b{font-family:var(--serif);font-size:13.5px;color:var(--ink);line-height:1.35}
.teaser span{font-family:var(--mono);font-size:10px;color:var(--accent);font-weight:700}
.teaser small{font-size:11px;color:var(--muted);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:var(--card);border:1.5px solid var(--line);border-radius:13px;padding:13px 16px;min-height:48px;touch-action:manipulation;transition:transform .12s,border-color .18s,background .18s,box-shadow .18s}
button:active:not(:disabled){transform:scale(.988)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.38;cursor:not-allowed}
.primary{background:var(--accent);color:#fffdf8;border-color:var(--accent);font-weight:800;width:100%;text-align:center;box-shadow:0 8px 20px rgba(184,84,55,.24)}
.primary:hover:not(:disabled){filter:brightness(1.06)}
.secondary{width:100%;text-align:center;background:var(--paper);font-weight:700}
.subtle{background:transparent;border:0;text-align:center;color:var(--muted);font-size:12px;padding:8px;min-height:36px}
.subtle:hover{color:var(--accent)}
.stack{display:grid;gap:10px}
.actions-row{display:grid;grid-template-columns:1.25fr 1fr;gap:10px}
.notice{font-size:12px;color:var(--muted);line-height:1.72;margin-top:14px}
/* Quiz */
.question-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;color:var(--sage);font-weight:800}
.auto-toggle{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--paper);color:var(--muted);font-family:var(--sans);font-size:11px;font-weight:700;min-height:28px}
.auto-toggle.on{border-color:var(--sage);color:var(--sage);background:#e7f2ed}
.progress{height:6px;background:var(--soft);overflow:hidden;border-radius:12px;margin:11px 0 18px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--sage),var(--mustard));border-radius:12px;transition:width .28s cubic-bezier(.22,1,.36,1)}
.chapter-bar{display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:12px;background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--mustard);margin-bottom:20px}
.chapter-num{font-family:var(--serif);font-size:20px;font-weight:800;color:var(--accent);line-height:1}
.chapter-bar strong{display:block;font-size:13px;color:var(--ink)}
.chapter-bar span{display:block;font-size:11.5px;color:var(--muted);line-height:1.45}
.options{display:grid;gap:10px;margin:20px 0 22px}
.option{display:flex;text-align:left;align-items:center;gap:12px;min-height:60px;width:100%;padding:13px 14px;line-height:1.55;background:var(--card)}
.option .letter{display:grid;place-items:center;flex:0 0 29px;height:29px;border-radius:9px;background:var(--paper);color:var(--accent);font-family:var(--mono);font-weight:800;font-size:12px;border:1px solid var(--line);transition:all .16s}
.option.selected{border-color:var(--accent);background:#fcf0ea;box-shadow:0 4px 14px rgba(184,84,55,.14),inset 0 0 0 1px var(--accent)}
.option.selected .letter{background:var(--accent);color:#fff;border-color:var(--accent)}
.option .check{margin-left:auto;color:var(--accent);font-weight:800;font-size:15px}
.nav{display:grid;grid-template-columns:1fr 1.6fr;gap:10px}
/* Opening Sign Swinging Ritual */
.calc-box{text-align:center;padding:34px 10px 26px}
.sign-hang{width:130px;margin:0 auto 20px;transform-origin:top center;animation:swing 1.15s ease-in-out infinite alternate}
.sign-rope{width:64px;height:22px;margin:0 auto;border-left:2px solid var(--ink);border-right:2px solid var(--ink);transform:perspective(40px) rotateX(35deg)}
.sign-board{background:var(--sage);color:#fff8eb;border:2.5px solid var(--ink);border-radius:10px;padding:10px 8px;font-family:var(--mono);font-weight:900;font-size:18px;letter-spacing:3px;box-shadow:0 8px 18px rgba(43,33,27,.16)}
.sign-board small{display:block;font-size:9px;letter-spacing:1.4px;color:#f6dca8;margin-top:2px;font-weight:700}
@keyframes swing{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.calc-step{font-family:var(--serif);font-size:19px;color:var(--ink);margin-bottom:8px;min-height:1.6em}
.calc-sub{font-size:12px;color:var(--muted)}
/* Result Shopfront & Vintage Business License */
.license-card{border:2px solid var(--ink);border-radius:18px;overflow:hidden;background:var(--paper);position:relative;box-shadow:0 10px 28px rgba(43,33,27,.09)}
.shopfront-visual{width:100%;display:block;background:#261e19;border-bottom:2px solid var(--ink)}
.shopfront-visual svg{width:100%;height:auto;display:block}
.license-body{padding:18px 18px 16px;position:relative}
.lic-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;color:var(--muted);padding-bottom:10px;border-bottom:1px dashed var(--line)}
.fit-badge{padding:3px 10px;border-radius:99px;background:var(--shop-accent,var(--accent));color:#fff;font-weight:800;font-size:11px}
.shop-name{font-family:var(--serif);font-size:clamp(25px,6.8vw,36px);font-weight:800;line-height:1.28;color:var(--ink);margin:10px 0 8px;padding-right:74px}
.official-stamp{position:absolute;top:46px;right:14px;width:72px;height:72px;border-radius:50%;border:2.5px solid #c63b2d;color:#c63b2d;display:grid;place-items:center;text-align:center;font-family:var(--serif);font-size:11px;font-weight:900;line-height:1.2;transform:rotate(11deg);background:rgba(250,245,235,.88);box-shadow:inset 0 0 0 2px rgba(198,59,45,.25)}
.lic-grid{display:grid;gap:7px;margin:12px 0;padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.lic-row{display:grid;grid-template-columns:76px 1fr;gap:8px;font-size:13px;line-height:1.55}
.lic-row span{font-family:var(--mono);font-size:11px;font-weight:800;color:var(--shop-accent,var(--accent));padding-top:2px}
.lic-row strong{color:var(--ink);font-weight:700}
.quote-box{margin-top:12px;padding:11px 14px;border-left:4px solid var(--mustard);background:var(--card);border-radius:0 10px 10px 0;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.quote{font-family:var(--serif);font-size:16px;color:var(--shop-accent,var(--accent));line-height:1.65;font-weight:700}
/* Content Blocks */
.block{padding:21px 0;border-bottom:1.5px dashed var(--line)}
.block:last-of-type{border:0;padding-bottom:10px}
.block p{font-size:14.5px;line-height:1.88;color:#3d3028}
.kicker{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--mustard);font-weight:800;margin-bottom:4px;text-transform:uppercase}
.talent-card{margin-top:13px;padding:14px 15px;border-radius:13px;background:#eef6f1;border:1.5px solid #bdd9cb}
.talent-card b{display:block;font-family:var(--mono);font-size:11.5px;color:#225944;margin-bottom:4px;letter-spacing:.05em}
.talent-card p{font-size:13.5px;line-height:1.78;color:#203a30}
.guest-card{margin-top:12px;padding:14px 15px;border-radius:13px;background:var(--paper);border:1.5px dashed var(--mustard)}
.guest-card b{display:block;font-family:var(--mono);font-size:11.5px;color:#996515;margin-bottom:5px}
.guest-card p{font-size:13.5px;line-height:1.78;color:#47382b}
.axis{margin:15px 0}
.axis-head,.axis-labels{display:flex;justify-content:space-between;gap:10px;font-size:12px}
.axis-head strong{font-size:13px}
.axis-head span{font-family:var(--mono);color:var(--shop-accent,var(--accent));font-weight:800}
.axis-labels{color:var(--muted);font-size:11.5px}
.track{position:relative;height:9px;border-radius:9px;background:var(--soft);margin:8px 0;border:1px solid var(--line)}
.track::before{content:"";position:absolute;left:50%;width:1px;height:9px;background:#cbbda7}
.track i{position:absolute;width:16px;height:16px;top:-4px;border-radius:50%;background:var(--shop-accent,var(--accent));border:2.5px solid var(--card);box-shadow:0 0 0 1.5px var(--shop-accent,var(--accent));transform:translateX(-50%)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.mini{padding:14px;border-radius:13px;background:var(--paper);border:1px solid var(--line)}
.mini b{display:block;font-family:var(--mono);color:var(--shop-accent,var(--accent));font-size:11px;margin-bottom:5px}
.mini .partner-name{font-family:var(--serif);font-size:15.5px;font-weight:800;color:var(--ink);margin-bottom:4px;line-height:1.38}
.mini p{font-size:13px;line-height:1.68;color:#4a3c33}
.rank{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px}
.rank:last-child{border:0}
.rank-left{display:flex;align-items:center;gap:10px}
.swatch{width:13px;height:13px;border-radius:4px;border:1px solid rgba(0,0,0,.18);flex:none}
.rank small{display:block;font-size:11px;color:var(--muted)}
.rank .pct{font-family:var(--mono);font-size:11.5px;font-weight:800;color:var(--accent);background:#faebe5;padding:3px 9px;border-radius:99px}
.status-bar{font-family:var(--mono);font-size:12px;color:var(--sage);text-align:center;min-height:1.4em;margin:4px 0 6px;font-weight:700}
.footer{text-align:center;margin:20px 0 0;font-size:11px;color:var(--muted);line-height:1.8}
.poster{width:100%;max-width:360px;margin:10px auto;border-radius:12px;display:block;border:1px solid var(--line);box-shadow:0 12px 30px rgba(0,0,0,.16)}
dialog{width:min(calc(100% - 26px),460px);max-height:90dvh;overflow:auto;border:2px solid var(--ink);border-radius:20px;padding:20px;background:var(--card);color:var(--ink);box-shadow:0 24px 60px rgba(43,33,27,.28)}
dialog::backdrop{background:rgba(32,24,18,.64);backdrop-filter:blur(3px)}
.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.dialog-head button{min-height:36px;padding:4px 13px;font-size:13px}
.copy-area{width:100%;min-height:155px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);padding:12px;font:inherit;font-size:13px;line-height:1.7;margin:10px 0}
@media(max-width:460px){
  main{padding:14px 12px 28px}
  .teasers,.duo,.actions-row{grid-template-columns:1fr}
  .shop-name{padding-right:0}
  .official-stamp{position:static;margin:8px 0 4px;width:auto;height:auto;border-radius:6px;padding:4px 10px;display:inline-block;transform:rotate(-2deg)}
  .option{font-size:14px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <header>
    <span class="brand">DREAM SHOP LAB</span>
    <span class="issue">VOL. 04 · 理想小店营业执照</span>
  </header>
  <div id="app"></div>
  <footer class="footer">DREAM SHOP BUREAU · 原创趣味理想生活测试，非专业心理或创业建议<br>无需登录 · 所有答题记录仅保存在你的本地浏览器</footer>
</main>

<dialog id="posterDialog" aria-labelledby="posterTitle">
  <div class="dialog-head">
    <h3 id="posterTitle">你的 3:4 理想小店营业执照海报</h3>
    <button id="closePoster" type="button">关闭</button>
  </div>
  <p class="muted">1080 × 1440 复古街角门头卡 · 手机直接长按图片保存，电脑点击下方下载。</p>
  <div id="posterArea"></div>
  <div class="stack" style="margin-top:12px">
    <button class="primary" id="downloadPoster">下载高清 PNG 营业执照</button>
  </div>
  <p class="status-bar" id="posterStatus" role="status"></p>
</dialog>

<dialog id="copyDialog" aria-labelledby="copyTitle">
  <div class="dialog-head">
    <h3 id="copyTitle">复制小红书分享文案</h3>
    <button id="closeCopy" type="button">关闭</button>
  </div>
  <p class="muted">长按或全选下方文案复制，搭配小店营业执照发笔记超容易引起打工人共鸣。</p>
  <textarea id="copyTextarea" class="copy-area" readonly></textarea>
  <button class="primary" id="selectCopyBtn" type="button">全选文案</button>

function compute(input){
  if(input.length!==N||input.some(v=>!Number.isInteger(v)||v<0||v>3)) throw Error('Incomplete answers');
  const sums=D.axes.map(()=>0), cnts=D.axes.map(()=>0);
  const wSums=D.axes.map(()=>0), wCnts=D.axes.map(()=>0);
  D.questions.forEach((q,i)=>{
    const sc=q.options[input[i]].score;
    sums[q.axis]+=sc; cnts[q.axis]++;
    const w=1+i*0.012;
    wSums[q.axis]+=sc*w; wCnts[q.axis]+=w;
  });
  const v=sums.map((s,i)=>s/cnts[i]);
  const vw=wSums.map((s,i)=>s/wCnts[i]);
  const ranked=D.profiles.map((p,i)=>{
    const center=p.vector.map(x=>x-1.5);
    const norm=Math.hypot(...center)||1;
    const radius=Math.sqrt(vw.length)*0.52+0.12*(norm-Math.sqrt(vw.length));
    const cal=center.map(x=>1.5+x*radius/norm);
    const d=cal.reduce((s,x,j)=>s+(x-vw[j])**2,0);
    const rawSim=Math.max(0,1-Math.sqrt(d/(4.2*vw.length)));
    const fit=Math.round(Math.max(68,Math.min(98,68+rawSim*30)));
    return {p,i,d,fit};
  });
  ranked.sort((a,b)=>a.d-b.d||a.i-b.i);
  for(let k=1;k<Math.min(4,ranked.length);k++){
    if(ranked[k].fit>=ranked[k-1].fit) ranked[k].fit=Math.max(62,ranked[k-1].fit-2);
  }
  const licNo=`NO.2026-${ranked[0].p.no}${String(Math.round((v[0]*3+v[1]*5+v[2]*7+v[3]*11)*19+100)).slice(-3)}`;
  return {v,ranked,p:ranked[0].p,licNo};
}

function wrap(ctx,text,max){
  const out=[];let line='';
  for(const ch of text){
    if(line&&ctx.measureText(line+ch).width>max){out.push(line);line=ch;}
    else line+=ch;
  }
  if(line) out.push(line);
  return out;
}
function rPath(ctx,x,y,w,h,r){
  ctx.beginPath();
  if(typeof ctx.roundRect==='function') ctx.roundRect(x,y,w,h,r);
  else{r=Math.min(r,w/2,h/2);ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
}
function fillR(ctx,x,y,w,h,r){rPath(ctx,x,y,w,h,r);ctx.fill();}
function strokeR(ctx,x,y,w,h,r){rPath(ctx,x,y,w,h,r);ctx.stroke();}

function makePoster(){
  const c=document.createElement('canvas');c.width=1080;c.height=1440;
  const ctx=c.getContext('2d');if(!ctx) throw Error('Canvas unavailable');
  const {p,v,ranked,licNo}=report;
  const sans='"PingFang SC","Microsoft YaHei",sans-serif', serif='"Noto Serif SC","Songti SC","SimSun",serif', mono='"SF Mono","Menlo","Consolas",monospace';

  // Warm kraft vintage backdrop with subtle grid
  ctx.fillStyle='#efe8da';ctx.fillRect(0,0,1080,1440);
  ctx.strokeStyle='rgba(184,84,55,0.06)';ctx.lineWidth=1;
  for(let gx=0;gx<1080;gx+=36){ctx.beginPath();ctx.moveTo(gx,0);ctx.lineTo(gx,1440);ctx.stroke();}
  for(let gy=0;gy<1440;gy+=36){ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(1080,gy);ctx.stroke();}

  // Outer Vintage Business License Board
  ctx.save();
  ctx.shadowColor='rgba(43,33,27,0.16)';ctx.shadowBlur=34;ctx.shadowOffsetY=12;
  ctx.fillStyle='#fffdf7';fillR(ctx,46,42,988,1356,24);
  ctx.restore();
  ctx.strokeStyle='#2b211b';ctx.lineWidth=3.5;strokeR(ctx,46,42,988,1356,24);

  // Scalloped Striped Shop Awning along top of license!
  const awX=48, awY=44, awW=984, awH=104, cnt=12, sw=awW/cnt;
  ctx.save();rPath(ctx,46,42,988,1356,24);ctx.clip();
  for(let i=0;i<cnt;i++){
    const sx=awX+i*sw;
    ctx.fillStyle=i%2===0?p.awning:p.stripe;
    ctx.beginPath();
    ctx.moveTo(sx,awY);ctx.lineTo(sx+sw,awY);ctx.lineTo(sx+sw,awY+awH-22);
    ctx.arc(sx+sw/2,awY+awH-22,sw/2,0,Math.PI);ctx.closePath();
    ctx.fill();
    ctx.strokeStyle='#2b211b';ctx.lineWidth=2;ctx.stroke();
  }
  ctx.restore();
  // Re-stroke top corners cleanly
  ctx.strokeStyle='#2b211b';ctx.lineWidth=3.5;strokeR(ctx,46,42,988,1356,24);

  // License Header Title Bar
  ctx.fillStyle=p.accent;ctx.font=`800 22px ${mono}`;
  ctx.fillText(`☀ 理想小店个体营业执照   ·   ${licNo}`, 88, 198);
  ctx.textAlign='right';ctx.fillStyle='#2b211b';ctx.font=`800 21px ${mono}`;
  ctx.fillText(`契合度 ${ranked[0].fit}%`, 992, 198);
  ctx.textAlign='left';

  ctx.strokeStyle='#ded2be';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(88,216);ctx.lineTo(992,216);ctx.stroke();

  // Shop Name (wrapped safely to avoid colliding with circular stamp)
  const nameLines=wrap(ctx, p.name, 670);
  const nameSize=nameLines.length>1?50:56;
  ctx.fillStyle='#2b211b';ctx.font=`800 ${nameSize}px ${serif}`;
  nameLines.slice(0,2).forEach((l,i)=>ctx.fillText(l, 88, 286+i*64));

  // Vintage Red Official Stamp on Top Right
  ctx.save();ctx.translate(888, 304);ctx.rotate(0.16);
  ctx.strokeStyle='#c63b2d';ctx.lineWidth=4.5;ctx.beginPath();ctx.arc(0,0,82,0,Math.PI*2);ctx.stroke();
  ctx.lineWidth=1.5;ctx.setLineDash([5,4]);ctx.beginPath();ctx.arc(0,0,70,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='rgba(255,253,247,0.92)';fillR(ctx,-74,-24,148,48,6);
  ctx.strokeStyle='#c63b2d';ctx.lineWidth=2.5;strokeR(ctx,-74,-24,148,48,6);
  ctx.fillStyle='#c63b2d';ctx.textAlign='center';
  ctx.font=`900 24px ${serif}`;ctx.fillText('核准开业', 0, 9);
  ctx.font=`800 15px ${sans}`;ctx.fillText('★ 告别早八 ★', 0, -40);
  ctx.font=`700 13px ${mono}`;ctx.fillText('DREAM SHOP', 0, 50);
  ctx.restore();ctx.textAlign='left';

  // Hashtag pills below name
  const pillY = nameLines.length>1 ? 378 : 326;
  let tx=88;
  p.tags.forEach(t=>{
    const lbl='# '+t;ctx.font=`700 20px ${sans}`;
    const w=ctx.measureText(lbl).width+30;
    if(tx+w<790){
      ctx.fillStyle='#faebe5';fillR(ctx,tx,pillY,w,38,19);
      ctx.strokeStyle='rgba(184,84,55,0.38)';ctx.lineWidth=1.2;strokeR(ctx,tx,pillY,w,38,19);
      ctx.fillStyle='#b85437';ctx.fillText(lbl,tx+15,pillY+26);
      tx+=w+10;
    }
  });

  // License Key-Value Info Box (Hours / Spot / Signature)
  const boxY = Math.max(438, pillY + 56);
  ctx.fillStyle='#faf5eb';fillR(ctx,84,boxY,912,188,16);
  ctx.strokeStyle='#ded2be';ctx.lineWidth=1.8;strokeR(ctx,84,boxY,912,188,16);
  const rows=[['营业时间',p.hours],['理想选址',p.spot],['镇店必点',p.signature]];
  rows.forEach((r,k)=>{
    const ry=boxY+48+k*56;
    ctx.fillStyle=p.accent;ctx.font=`800 21px ${mono}`;ctx.fillText(r[0], 112, ry);
    ctx.fillStyle='#2b211b';ctx.font=`700 23px ${sans}`;
    ctx.fillText(wrap(ctx,r[1],740)[0], 230, ry);
  });

  // Hanging Quote Banner
  const qY = boxY + 206;
  ctx.fillStyle='#fffdf7';fillR(ctx,84,qY,912,86,14);
  ctx.strokeStyle='#ded2be';ctx.lineWidth=1.5;strokeR(ctx,84,qY,912,86,14);
  ctx.fillStyle='#d49735';fillR(ctx,84,qY,10,86,5);
  ctx.fillStyle=p.accent;ctx.font=`700 26px ${serif}`;
  ctx.fillText(wrap(ctx,`「${p.quote}」`,850)[0], 116, qY+52);

  // Hidden Money-Making Talent + Regular Customer Card
  const tY = qY + 106;
  ctx.fillStyle='#eef6f1';fillR(ctx,84,tY,912,138,16);
  ctx.strokeStyle='#bdd9cb';ctx.lineWidth=1.8;strokeR(ctx,84,tY,912,138,16);
  ctx.fillStyle='#225944';ctx.font=`800 20px ${mono}`;ctx.fillText('✦ 你的隐藏搞钱天赋', 112, tY+38);
  ctx.fillStyle='#203a30';ctx.font=`500 23px ${sans}`;
  wrap(ctx,p.talent,856).slice(0,2).forEach((l,i)=>ctx.fillText(l, 112, tY+78+i*35));

  const gY = tY + 154;
  ctx.fillStyle='#faf5eb';fillR(ctx,84,gY,912,132,16);
  ctx.save();ctx.setLineDash([7,6]);ctx.strokeStyle='#d49735';ctx.lineWidth=1.8;strokeR(ctx,84,gY,912,132,16);ctx.restore();
  ctx.fillStyle='#996515';ctx.font=`800 20px ${mono}`;ctx.fillText('☕ 最容易吸引的怪咖常客', 112, gY+38);
  ctx.fillStyle='#47382b';ctx.font=`500 22px ${sans}`;
  wrap(ctx,p.guest,856).slice(0,2).forEach((l,i)=>ctx.fillText(l, 112, gY+76+i*34));

  // 4-Axis Shopkeeping DNA Compact Strip
  const aY = gY + 152;
  D.axes.forEach((a,i)=>{
    const col=i%2, row=Math.floor(i/2);
    const ax=88+col*464, ay=aY+26+row*58, aw=440;
    ctx.font=`700 18px ${sans}`;ctx.fillStyle='#2b211b';ctx.textAlign='left';
    ctx.fillText(`${a[0]} · ${a[1]}`, ax, ay);
    ctx.textAlign='right';ctx.fillStyle='#756558';ctx.fillText(a[2], ax+aw, ay);
    ctx.textAlign='left';
    ctx.fillStyle='#efe8da';fillR(ctx,ax,ay+10,aw,9,4.5);
    const px=ax+aw*Math.max(0.05,Math.min(0.95,v[i]/3));
    ctx.fillStyle=p.accent;ctx.beginPath();ctx.arc(px,ay+14.5,9.5,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#fffdf7';ctx.lineWidth=2.5;ctx.stroke();
  });

  // Bottom Neighbor Duo
  const nY = Math.min(1196, aY + 136), nH = 136;
  ctx.fillStyle='#faf5eb';fillR(ctx,84,nY,444,nH,14);
  ctx.strokeStyle='#ded2be';ctx.lineWidth=1.5;strokeR(ctx,84,nY,444,nH,14);
  ctx.fillStyle=p.accent;ctx.font=`800 18px ${mono}`;ctx.fillText('♥ 天选一条街合伙人', 108, nY+34);
  ctx.fillStyle='#2b211b';ctx.font=`800 23px ${serif}`;ctx.fillText(wrap(ctx,p.match[0],396)[0], 108, nY+72);
  ctx.fillStyle='#685a4e';ctx.font=`400 18px ${sans}`;ctx.fillText(wrap(ctx,p.match[1],396)[0], 108, nY+108);

  ctx.fillStyle='#faf5eb';fillR(ctx,552,nY,444,nH,14);
  ctx.strokeStyle='#ded2be';ctx.lineWidth=1.5;strokeR(ctx,552,nY,444,nH,14);
  ctx.fillStyle='#756558';ctx.font=`800 18px ${mono}`;ctx.fillText('⚡ 严禁开在对门的邻居', 576, nY+34);
  ctx.fillStyle='#2b211b';ctx.font=`800 23px ${serif}`;ctx.fillText(wrap(ctx,p.clash[0],396)[0], 576, nY+72);
  ctx.fillStyle='#685a4e';ctx.font=`400 18px ${sans}`;ctx.fillText(wrap(ctx,p.clash[1],396)[0], 576, nY+108);

  // Footer
  ctx.fillStyle='#756558';ctx.font=`600 19px ${sans}`;
  ctx.fillText('如果不用上班，你天生适合开一家什么小店  ·  长按保存分享', 86, 1372);
  ctx.textAlign='right';ctx.fillText('DREAM SHOP LAB', 994, 1372);
  ctx.textAlign='left';
  return c;
}

function showPoster(){
  if(!report) return;
  const status=document.getElementById('posterStatus'),
        area=document.getElementById('posterArea'),
        download=document.getElementById('downloadPoster');
  status.textContent='';area.innerHTML='';download.disabled=true;
  try{
    if(posterURL) URL.revokeObjectURL(posterURL);
    posterURL=null;
    const canvas=makePoster();
    const img=document.createElement('img');
    img.className='poster';img.alt='可保存的3:4理想小店营业执照海报';
    img.src=canvas.toDataURL('image/png');
    area.append(img);
    canvas.toBlob(blob=>{
      posterURL=blob?URL.createObjectURL(blob):img.src;
      download.disabled=false;
    },'image/png');
    if(!posterDialog.open) posterDialog.showModal();
  }catch(e){
    status.textContent='当前浏览器不支持生成海报，可直接截图保存结果页。';
    if(!posterDialog.open) posterDialog.showModal();
  }
}

document.getElementById('closePoster').onclick=()=>posterDialog.close();
document.getElementById('downloadPoster').onclick=()=>{
  if(!posterURL||!report) return;
  const a=document.createElement('a');a.href=posterURL;a.download='理想小店-'+report.p.name+'.png';
  document.body.append(a);a.click();a.remove();
  document.getElementById('posterStatus').textContent='若微信/小红书内未自动下载，请直接长按上方营业执照保存。';
};
document.getElementById('closeCopy').onclick=()=>copyDialog.close();
document.getElementById('selectCopyBtn').onclick=()=>{
  const ta=document.getElementById('copyTextarea');ta.focus();ta.select();
};
home();
